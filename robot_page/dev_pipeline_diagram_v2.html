<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Claude Code 輔助開發流程與驗證迴圈（V模型）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --teal:#186b60; --teal-deep:#0f4a42; --teal-tint:#e3f2f0;
    --navy:#152a4a; --navy-deep:#0f1f38; --navy-tint:#e6ebf3;
    --orange:#e8743c; --orange-deep:#c85a26;
    --ink:#1e293b; --sub:#5b6470; --line:#33475b;
    --card:#ffffff; --page:#f2f4f6; --border:#9aa5b1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .wrap{max-width:1300px; margin:0 auto; padding:28px 16px 60px;}
  h1{font-size:19px; font-weight:800; text-align:center; margin:0 0 20px; color:var(--ink);}
  .card{
    background:var(--card); border-radius:18px; padding:16px;
    box-shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
    border:1px solid var(--border);
  }
  svg.diagram{width:100%; height:auto; display:block;}
  text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Claude Code 輔助開發流程與驗證迴圈（V模型）</h1>
  <div class="card">
    <svg class="diagram" viewBox="0 0 1300 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="var(--line)"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="1300" height="800" fill="#ffffff"/>

      <!-- ===== Top column labels ===== -->
      <text x="195" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)">（左側：需求、架構與設計）</text>
      <text x="1105" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)">（右側：整合與驗證）</text>

      <!-- =========================================================== -->
      <!-- ROW 1 : Box1 (left / teal) + Box4 (right / navy) — all boxes now a uniform 150 tall (header 34 + body 116) -->
      <!-- =========================================================== -->

      <!-- Box1 body + header (shifted -40 to start the left V-arm) -->
      <g transform="translate(-40,0)">
        <path d="M60,94 L410,94 L410,196 Q410,210 396,210 L74,210 Q60,210 60,196 Z" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
        <path d="M60,74 Q60,60 74,60 L396,60 Q410,60 410,74 L410,94 L60,94 Z" fill="var(--teal)" stroke="var(--teal-deep)" stroke-width="1.5"/>
        <text x="76" y="83" font-size="14.5" font-weight="800" fill="#ffffff">[1. 需求與規格定義]</text>

        <g transform="translate(102,124)">
          <circle r="22" fill="var(--teal-tint)"/>
          <rect x="-11" y="-13" width="16" height="20" rx="2" fill="#fff" stroke="var(--teal)" stroke-width="1.6"/>
          <line x1="-7" y1="-7" x2="1" y2="-7" stroke="var(--teal)" stroke-width="1.2"/>
          <line x1="-7" y1="-2" x2="1" y2="-2" stroke="var(--teal)" stroke-width="1.2"/>
          <line x1="-7" y1="3" x2="1" y2="3" stroke="var(--teal)" stroke-width="1.2"/>
          <circle cx="6" cy="8" r="5" fill="none" stroke="var(--teal)" stroke-width="1.6"/>
          <line x1="9.5" y1="11.5" x2="13.5" y2="15.5" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="156" y="129" font-size="15" font-weight="800" fill="var(--teal-deep)">逆向萃取規格流程</text>
        <text x="80" y="169" font-size="13" fill="var(--sub)"><tspan fill="var(--teal)">• </tspan>與 AI 共同產出規格書</text>
        <text x="80" y="187" font-size="13" fill="var(--sub)"><tspan fill="var(--teal)">• </tspan>確保對齊必要功能</text>
      </g>

      <!-- Box4 body + header (shifted +240 to start the right V-arm) -->
      <g transform="translate(240,0)">
        <path d="M690,94 L1040,94 L1040,196 Q1040,210 1026,210 L704,210 Q690,210 690,196 Z" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
        <path d="M690,74 Q690,60 704,60 L1026,60 Q1040,60 1040,74 L1040,94 L690,94 Z" fill="var(--navy)" stroke="var(--navy-deep)" stroke-width="1.5"/>
        <text x="706" y="83" font-size="14.5" font-weight="800" fill="#ffffff">[4. 系統與驗收測試]</text>

        <g transform="translate(732,124)">
          <circle r="22" fill="var(--navy-tint)"/>
          <rect x="-9" y="-13" width="18" height="24" rx="2" fill="#fff" stroke="var(--navy)" stroke-width="1.6"/>
          <rect x="-4" y="-15" width="8" height="4" rx="1" fill="var(--navy)"/>
          <line x1="-5.5" y1="-4" x2="4.5" y2="-4" stroke="var(--navy)" stroke-width="1.1"/>
          <line x1="-5.5" y1="1" x2="4.5" y2="1" stroke="var(--navy)" stroke-width="1.1"/>
          <line x1="-5.5" y1="6" x2="4.5" y2="6" stroke="var(--navy)" stroke-width="1.1"/>
          <circle cx="8" cy="10" r="7" fill="#16a34a" stroke="#fff" stroke-width="1.2"/>
          <path d="M5,10 L7.3,12.3 L11.5,7.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="786" y="129" font-size="15" font-weight="800" fill="var(--navy-deep)">測試與驗收閉環</text>
        <text x="710" y="162" font-size="13" fill="var(--sub)"><tspan fill="var(--navy)">• </tspan>隨機生成 200~300 個測試場景（含通過指標）</text>
        <text x="710" y="180" font-size="13" fill="var(--sub)"><tspan fill="var(--navy)">• </tspan>夜間壓力測試 (Stress Test)（導航+站點執行）</text>
        <text x="710" y="198" font-size="13" fill="var(--sub)"><tspan fill="var(--navy)">• </tspan>自動總結報告與改進項目</text>
      </g>

      <!-- Row1 cross-validation arrow (widest gap: top of the V) -->
      <text x="650" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">（橫向驗證）</text>
      <line x1="390" y1="139" x2="910" y2="139" stroke="var(--line)" stroke-width="1.6" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)"/>
      <text x="650" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--navy-deep)">確保最終系統的整體行為，</text>
      <text x="650" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--navy-deep)">100% 滿足基準規格書</text>

      <!-- =========================================================== -->
      <!-- ROW 2 : Box2 (left / teal) + Box3 (right / navy)             -->
      <!-- =========================================================== -->

      <g transform="translate(60,0)">
        <path d="M60,284 L410,284 L410,386 Q410,400 396,400 L74,400 Q60,400 60,386 Z" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
        <path d="M60,264 Q60,250 74,250 L396,250 Q410,250 410,264 L410,284 L60,284 Z" fill="var(--teal)" stroke="var(--teal-deep)" stroke-width="1.5"/>
        <text x="76" y="273" font-size="14.5" font-weight="800" fill="#ffffff">[2. 系統架構層 (您主導)]</text>

        <g transform="translate(102,314)">
          <circle r="22" fill="var(--teal-tint)"/>
          <rect x="-19" y="-17" width="9" height="13" rx="1.3" fill="#fff" stroke="var(--teal)" stroke-width="1.2"/>
          <line x1="-17" y1="-14" x2="-11.5" y2="-14" stroke="var(--teal)" stroke-width="0.9"/>
          <line x1="-17" y1="-11" x2="-11.5" y2="-11" stroke="var(--teal)" stroke-width="0.9"/>
          <line x1="-17" y1="-8" x2="-11.5" y2="-8" stroke="var(--teal)" stroke-width="0.9"/>
          <rect x="0" y="-9" width="11" height="7" rx="1.6" fill="#fff" stroke="var(--teal)" stroke-width="1.5"/>
          <rect x="-8" y="8" width="9" height="7" rx="1.6" fill="#fff" stroke="var(--teal)" stroke-width="1.5"/>
          <rect x="7" y="8" width="9" height="7" rx="1.6" fill="#fff" stroke="var(--teal)" stroke-width="1.5"/>
          <path d="M5.5,-2 L5.5,3 M5.5,3 L-3,8 M5.5,3 L11.5,8" fill="none" stroke="var(--teal)" stroke-width="1.4"/>
        </g>
        <text x="156" y="319" font-size="15" font-weight="800" fill="var(--teal-deep)">系統拓樸與介面規劃</text>
        <text x="80" y="352" font-size="13" fill="var(--sub)"><tspan fill="var(--teal)">• </tspan>定義 Node 職責</text>
        <text x="80" y="370" font-size="13" fill="var(--sub)"><tspan fill="var(--teal)">• </tspan>規劃 Topic/Msg</text>
        <text x="80" y="388" font-size="13" fill="var(--sub)"><tspan fill="var(--teal)">• </tspan>Action/Service</text>
      </g>

      <g transform="translate(140,0)">
        <path d="M690,284 L1040,284 L1040,386 Q1040,400 1026,400 L704,400 Q690,400 690,386 Z" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
        <path d="M690,264 Q690,250 704,250 L1026,250 Q1040,250 1040,264 L1040,284 L690,284 Z" fill="var(--navy)" stroke="var(--navy-deep)" stroke-width="1.5"/>
        <text x="706" y="273" font-size="14.5" font-weight="800" fill="#ffffff">[3. 整合與架構驗證]</text>

        <g transform="translate(732,314)">
          <circle r="22" fill="var(--navy-tint)"/>
          <circle cx="-12" cy="-8" r="3" fill="#4f8fdc"/>
          <circle cx="10" cy="-10" r="3" fill="#52b788"/>
          <circle cx="-10" cy="8" r="2.6" fill="var(--navy)"/>
          <circle cx="6" cy="10" r="3" fill="#f2a541"/>
          <path d="M-12,-8 L10,-10 M-12,-8 L-10,8 M10,-10 L6,10 M-10,8 L6,10" fill="none" stroke="var(--navy)" stroke-width="1.2"/>
          <path d="M2,-10.2 L7.5,-9.3 L2.5,-8.3 Z" fill="var(--navy)"/>
          <path d="M-12,-1 L-9,-1.3 L-10.3,3.5 Z" fill="var(--navy)"/>
          <path d="M8.7,2 L5.7,2.6 L7.6,7 Z" fill="var(--navy)"/>
          <path d="M-3,7.6 L1.8,8.7 L-2.6,10.6 Z" fill="var(--navy)"/>
        </g>
        <text x="786" y="319" font-size="15" font-weight="800" fill="var(--navy-deep)">Topic Analysis 架構驗證</text>
        <text x="710" y="352" font-size="13" fill="var(--sub)"><tspan fill="var(--navy)">• </tspan>每天 9:00 自動產生最新 Node/Callback Graph</text>
        <text x="710" y="370" font-size="13" fill="var(--sub)"><tspan fill="var(--navy)">• </tspan>自動對齊，抓出幽靈連線/死結</text>
        <text x="710" y="388" font-size="13" fill="var(--sub)"><tspan fill="var(--navy)">• </tspan>PM 透過架構變動掌握每日進度</text>
      </g>

      <!-- Row2 cross-validation arrow -->
      <text x="650" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">（橫向驗證）</text>
      <line x1="490" y1="329" x2="810" y2="329" stroke="var(--line)" stroke-width="1.6" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)"/>
      <text x="650" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--navy-deep)">實際運行的節點圖，</text>
      <text x="650" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--navy-deep)">必須與您腦海的架構圖完全一致</text>

      <!-- =========================================================== -->
      <!-- ROW 3 : Box2.1 (left / teal) + Box2.2 (right / navy)         -->
      <!-- =========================================================== -->

      <g transform="translate(140,0)">
        <path d="M60,474 L410,474 L410,576 Q410,590 396,590 L74,590 Q60,590 60,576 Z" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
        <path d="M60,454 Q60,440 74,440 L396,440 Q410,440 410,454 L410,474 L60,474 Z" fill="var(--teal)" stroke="var(--teal-deep)" stroke-width="1.5"/>
        <text x="76" y="463" font-size="14.5" font-weight="800" fill="#ffffff">[2.1 詳細設計層]</text>

        <g transform="translate(102,504)">
          <circle r="22" fill="var(--teal-tint)"/>
          <rect x="-13" y="-16" width="22" height="28" rx="2.5" fill="#fff" stroke="var(--teal)" stroke-width="1.5"/>
          <path d="M-8,-9 L-8,-4 L-2,-4 M-8,-6.5 L-2,-6.5" fill="none" stroke="var(--teal)" stroke-width="1"/>
          <rect x="-9" y="0" width="6" height="4.5" rx="1" fill="none" stroke="var(--teal)" stroke-width="1"/>
          <rect x="1" y="0" width="6" height="4.5" rx="1" fill="none" stroke="var(--teal)" stroke-width="1"/>
          <path d="M-6,-4 L-6,0 M-6,4.5 L-6,8 M1,4.5 L4,8" fill="none" stroke="var(--teal)" stroke-width="0.9"/>
          <g transform="translate(15,17) rotate(45)">
            <rect x="-2.2" y="-9" width="4.4" height="13" rx="1" fill="#f2a541"/>
            <path d="M-2.2,4 L0,9 L2.2,4 Z" fill="var(--teal-deep)"/>
          </g>
        </g>
        <text x="156" y="509" font-size="15" font-weight="800" fill="var(--teal-deep)">演算法與邏輯藍圖</text>
        <text x="80" y="542" font-size="13" fill="var(--sub)"><tspan fill="var(--teal)">• </tspan>A* 啟發函數設計</text>
        <text x="80" y="560" font-size="13" fill="var(--sub)"><tspan fill="var(--teal)">• </tspan>自由導航規則</text>
        <text x="80" y="578" font-size="13" fill="var(--sub)"><tspan fill="var(--teal)">• </tspan>站點任務邏輯</text>
      </g>

      <g transform="translate(60,0)">
        <path d="M690,474 L1040,474 L1040,576 Q1040,590 1026,590 L704,590 Q690,590 690,576 Z" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
        <path d="M690,454 Q690,440 704,440 L1026,440 Q1040,440 1040,454 L1040,474 L690,474 Z" fill="var(--navy)" stroke="var(--navy-deep)" stroke-width="1.5"/>
        <text x="706" y="463" font-size="14.5" font-weight="800" fill="#ffffff">[2.2 模組與單元測試]</text>

        <g transform="translate(732,504)">
          <circle r="22" fill="var(--navy-tint)"/>
          <rect x="-17" y="-14" width="34" height="22" rx="2" fill="#fff" stroke="var(--navy)" stroke-width="1.6"/>
          <rect x="-5" y="8" width="10" height="3" fill="var(--navy)"/>
          <rect x="-9" y="11" width="18" height="2.2" rx="1" fill="var(--navy)"/>
          <path d="M-12,2 L-5,-5 L1,1 L9,-9" fill="none" stroke="#2f9e63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9,-9 l2.6,-1.4 l-0.4,2.9 l-2.6,1.4 l1.6,-2.4 l-2.4,-1.6 z" fill="#f2a541"/>
        </g>
        <text x="786" y="509" font-size="15" font-weight="800" fill="var(--navy-deep)">視覺化測試載具</text>
        <text x="710" y="542" font-size="13" fill="var(--sub)"><tspan fill="var(--navy)">• </tspan>即時畫圖輸出現有邏輯</text>
        <text x="722" y="560" font-size="13" fill="var(--sub)">方便掌控邏輯正確性</text>
        <text x="710" y="578" font-size="13" fill="var(--sub)"><tspan fill="var(--navy)">• </tspan>快速且大量測試邏輯</text>
      </g>

      <!-- Row3 cross-validation arrow (narrowest gap: base of the V) -->
      <text x="650" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">（橫向驗證）</text>
      <line x1="570" y1="519" x2="730" y2="519" stroke="var(--line)" stroke-width="1.6" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)"/>
      <text x="650" y="545" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--navy-deep)">視覺化結果</text>
      <text x="650" y="565" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--navy-deep)">符合藍圖</text>

      <!-- =========================================================== -->
      <!-- Diagonal column connectors (the V-arms' staircase steps)     -->
      <!-- =========================================================== -->
      <path d="M200,210 L230,250" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
      <path d="M300,400 L310,440" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
      <path d="M1100,210 L1070,250" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
      <path d="M1000,400 L990,440" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

      <path d="M375,590 C375,615 470,610 552,630" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
      <path d="M925,590 C925,615 830,610 748,630" fill="none" stroke="var(--line)" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

      <!-- =========================================================== -->
      <!-- Bottom : Claude Code box (the apex of the V) — same 150 height as the other boxes -->
      <!-- =========================================================== -->
      <text x="650" y="616" text-anchor="middle" font-size="13" font-weight="800" fill="var(--sub)">[最底部：程式碼實作]</text>

      <g transform="translate(100,0)">
        <path d="M420,664 L680,664 L680,768 Q680,780 668,780 L432,780 Q420,780 420,768 Z" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
        <path d="M420,642 Q420,630 432,630 L668,630 Q680,630 680,642 L680,664 L420,664 Z" fill="var(--orange)" stroke="var(--orange-deep)" stroke-width="1.5"/>

        <g transform="translate(450,647)">
          <path d="M-4,-8 L-11,0 L-4,8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4,-8 L11,0 L4,8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="1.5" y1="9" x2="-1.5" y2="-9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <text x="475" y="652" font-size="16" font-weight="800" fill="#ffffff">撰寫底層程式碼</text>

        <text x="436" y="712" font-size="12.5" fill="var(--sub)"><tspan fill="var(--orange)">• </tspan>依指示撰寫具體代碼</text>
        <text x="436" y="732" font-size="12.5" fill="var(--sub)"><tspan fill="var(--orange)">• </tspan>實作演算法與 ROS API</text>
      </g>

    </svg>
  </div>
</div>
</body>
</html>
