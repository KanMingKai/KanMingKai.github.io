<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steering Wheel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  #container {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 32px;
  }

  .side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .wheel-wrap {
    position: relative;
    width: 120px; height: 120px;
    display: flex; align-items: center; justify-content: center;
  }

  .wheel-ripple {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .wheel-svg {
    position: relative;
    z-index: 1;
  }

  .angle-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    font-family: 'Courier New', monospace;
    text-align: center;
    min-width: 80px;
  }

  .phase-label {
    font-size: 10px;
    letter-spacing: 0.06em;
    font-family: 'Courier New', monospace;
    text-align: center;
    min-width: 80px;
    min-height: 14px;
  }

  .side-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
  }

  #arrow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #ccc;
  }

  #arrow svg { display: block; }

  #arrow span {
    font-size: 9px;
    font-family: 'Courier New', monospace;
    color: #bbb;
    letter-spacing: 0.06em;
    text-align: center;
  }
</style>
</head>
<body>
<div id="container">

  <!-- LEFT: Before (red, judder) -->
  <div class="side">
    <div class="side-title" style="color:#e03000">Before</div>
    <div class="wheel-wrap">
      <canvas class="wheel-ripple" id="ripple-l" width="160" height="160"></canvas>
      <svg class="wheel-svg" id="wheel-l" width="88" height="88" viewBox="0 0 100 100"
           fill="none" stroke="#e03000" stroke-width="6"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="40"/>
        <circle cx="50" cy="50" r="8" fill="#e03000" stroke="none" id="hub-l"/>
        <line x1="50" y1="42" x2="50" y2="12"/>
        <line x1="43" y1="55" x2="16" y2="70"/>
        <line x1="57" y1="55" x2="84" y2="70"/>
      </svg>
    </div>
  </div>

  <!-- ARROW -->
  <div id="arrow">
    <svg width="56" height="24" viewBox="0 0 56 24">
      <defs>
        <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#e03000" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#22aa55" stop-opacity="0.9"/>
        </linearGradient>
      </defs>
      <line x1="2" y1="12" x2="44" y2="12" stroke="url(#ag)" stroke-width="2" stroke-linecap="round"/>
      <polygon points="44,6 56,12 44,18" fill="#22aa55" opacity="0.9"/>
    </svg>
  </div>

  <!-- RIGHT: After (green, smooth) -->
  <div class="side">
    <div class="side-title" style="color:#22aa55">After</div>
    <div class="wheel-wrap">
      <canvas class="wheel-ripple" id="ripple-r" width="160" height="160"></canvas>
      <svg class="wheel-svg" id="wheel-r" width="88" height="88" viewBox="0 0 100 100"
           fill="none" stroke="#22aa55" stroke-width="6"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="40"/>
        <circle cx="50" cy="50" r="8" fill="#22aa55" stroke="none" id="hub-r"/>
        <line x1="50" y1="42" x2="50" y2="12"/>
        <line x1="43" y1="55" x2="16" y2="70"/>
        <line x1="57" y1="55" x2="84" y2="70"/>
      </svg>
    </div>
  </div>

</div>

<script>
// ── poly4 (same as TRJ module) ──────────────────────────────────────────────
function poly4(s)      { const s2=s*s,s3=s2*s,s4=s3*s; return 3*s4-8*s3+6*s2; }
function poly4Prime(s) { const s2=s*s; return 12*s2*s-24*s2+12*s; }

// ── Scenario parameters ────────────────────────────────────────────────────
const LANE_HALF  = 1.9;
const D          = LANE_HALF * 2;         // RMA target 3.8m
const D_LFCP     = 0.5;                   // co-Drive offset
const Z1 = 20, Z2 = 80;
const EGO_SPEED  = 60 / 3.6;
const STEER_SCALE = 10;

// ── Phase sequence ──────────────────────────────────────────────────────────
const PHASES = [
  { name:'NORMAL',      dur:2.2 },
  { name:'DETECT',      dur:0.9 },
  { name:'MOVE',        dur:(Z2)/EGO_SPEED },
  { name:'PASS',        dur:2.0 },
  { name:'RETURN',      dur:Z2/EGO_SPEED },
  { name:'IDLE',        dur:1.5 },
  { name:'LFCP_NORMAL', dur:2.0 },
  { name:'LFCP_DETECT', dur:Z1/EGO_SPEED },
  { name:'LFCP_MOVE',   dur:(Z2-Z1)/EGO_SPEED },
  { name:'LFCP_PASS',   dur:1.5 },
  { name:'LFCP_RETURN', dur:(Z2-Z1)/EGO_SPEED },
  { name:'LFCP_IDLE',   dur:1.5 },
];
const TOTAL_DUR = PHASES.reduce((a,p)=>a+p.dur,0);

// ── DOM refs ───────────────────────────────────────────────────────────────
const wheelL  = document.getElementById('wheel-l');
const hubL    = document.getElementById('hub-l');
const angleLbl= document.getElementById('angle-l');
const phaseLbl= document.getElementById('phase-l');
const rippleL = document.getElementById('ripple-l');
const rCtxL   = rippleL.getContext('2d');

const wheelR  = document.getElementById('wheel-r');
const hubR    = document.getElementById('hub-r');
const angleRbl= document.getElementById('angle-r');
const phaseRbl= document.getElementById('phase-r');
const rippleR = document.getElementById('ripple-r');
const rCtxR   = rippleR.getContext('2d');

// ── Ripple ──────────────────────────────────────────────────────────────────
function drawRipple(ctx, now, active, color) {
  ctx.clearRect(0,0,160,160);
  if (!active) return;
  const cx=80, cy=80;
  for (let i=0;i<3;i++) {
    const ph = ((now/900 + i*0.28) % 1);
    const r  = 42 + ph*28;
    const a  = (1-ph)*0.55;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle = `rgba(${color},${a})`;
    ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// ── Smooth rotation target ──────────────────────────────────────────────────
let displayAngle = 0;
let lastTime = performance.now();

function getHeading(phaseIdx, elapsed) {
  const ph = PHASES[phaseIdx].name;

  if (ph==='MOVE') {
    const scroll = elapsed * EGO_SPEED;
    const relZ   = Math.max(0, scroll - Z1);
    const s      = Math.min(1, relZ / (Z2 - Z1));
    return Math.atan(D * poly4Prime(s) / (Z2 - Z1));
  }
  if (ph==='RETURN') {
    const scroll = elapsed * EGO_SPEED;
    const relZ   = Math.max(0, scroll - Z1);
    const s      = Math.min(1, relZ / (Z2 - Z1));
    return Math.atan((D) * poly4Prime(s) / (Z2 - Z1));
  }
  if (ph==='LFCP_MOVE') {
    const scroll = elapsed * EGO_SPEED;
    const relZ   = Math.max(0, scroll - Z1);
    const s      = Math.min(1, relZ / (Z2 - Z1));
    return -Math.atan(D_LFCP * poly4Prime(s) / (Z2 - Z1));
  }
  if (ph==='LFCP_RETURN') {
    const scroll = elapsed * EGO_SPEED;
    const relZ   = Math.max(0, scroll - Z1);
    const s      = Math.min(1, relZ / (Z2 - Z1));
    return Math.atan(D_LFCP * poly4Prime(s) / (Z2 - Z1));
  }
  return 0;
}

function getColor(phaseIdx) {
  const ph = PHASES[phaseIdx].name;
  if (ph.startsWith('LFCP')) return '34,170,85';
  if (ph==='NORMAL'||ph==='IDLE') return '150,150,150';
  return '224,48,0';
}

function isActive(phaseIdx) {
  const ph = PHASES[phaseIdx].name;
  return ph==='MOVE'||ph==='RETURN'||ph==='LFCP_MOVE'||ph==='LFCP_RETURN';
}

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime)/1000, 0.05);
  lastTime = now;

  // Which phase?
  let cycleT = (now/1000) % TOTAL_DUR;
  let phIdx=0, elapsed=cycleT;
  for (let i=0;i<PHASES.length;i++) {
    if (elapsed < PHASES[i].dur) { phIdx=i; break; }
    elapsed -= PHASES[i].dur;
  }

  const ph = PHASES[phIdx].name;
  const targetHeading = getHeading(phIdx, elapsed);
  const targetDeg     = targetHeading * (180/Math.PI) * STEER_SCALE;

  // Smooth follow
  const diff = targetDeg - displayAngle;
  displayAngle += diff * Math.min(1, dt * 8);

  // ── Judder（左輪 Before）──────────────────────────────────────────────────
  let judder = 0, judderAmt = 0;
  if (ph === 'MOVE' || ph === 'RETURN') {
    const scroll = elapsed * EGO_SPEED;
    const s = Math.min(1, Math.max(0, (scroll - Z1) / (Z2 - Z1)));
    const envelope = Math.sin(s * Math.PI);
    judderAmt = envelope * 9;
    judder =
      Math.sin(now * 0.031) * judderAmt * 0.55 +
      Math.sin(now * 0.053) * judderAmt * 0.30 +
      Math.sin(now * 0.079) * judderAmt * 0.15;
  }
  const shakeX = judderAmt > 2 ? (Math.random()-0.5)*judderAmt*0.45 : 0;
  const shakeY = judderAmt > 2 ? (Math.random()-0.5)*judderAmt*0.20 : 0;

  // ── 左輪（Before · 紅 · 抖動）────────────────────────────────────────────
  const totalRotL = displayAngle + judder;
  wheelL.style.transform =
    `translate(${shakeX.toFixed(1)}px,${shakeY.toFixed(1)}px) rotate(${totalRotL.toFixed(2)}deg)`;
  drawRipple(rCtxL, now, isActive(phIdx), '224,48,0');
  angleLbl.textContent = totalRotL.toFixed(1) + '°';
  phaseLbl.textContent = judderAmt > 2 ? '⚠ 銜接點跳變' : '';
  phaseLbl.style.color = '#e03000';

  // ── 右輪（After · 綠 · 平順）─────────────────────────────────────────────
  wheelR.style.transform = `rotate(${displayAngle.toFixed(2)}deg)`;
  drawRipple(rCtxR, now, isActive(phIdx), '34,170,85');
  angleRbl.textContent = displayAngle.toFixed(1) + '°';
  phaseRbl.textContent = ph;
  phaseRbl.style.color = '#bbb';
}

requestAnimationFrame(animate);
</script>
</body>
</html>
