<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Lane Change — 3-Segment Trajectory Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }

    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 60%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.06) 100%);
    }

    #title-label {
      position: absolute; top: 22px; left: 24px;
      pointer-events: none;
    }
    #title-label .t1 {
      font-size: 15px; font-weight: 700; color: #1a1a1e;
      letter-spacing: 0.04em; line-height: 1;
      display: flex; align-items: center; gap: 8px;
    }
    #title-label .t1::before {
      content: ''; display: block;
      width: 3px; height: 16px; border-radius: 2px;
      background: #0071e3;
    }
    #title-label .t2 {
      font-size: 10.5px; color: #888; font-weight: 400;
      letter-spacing: 0.02em; margin-top: 5px; padding-left: 11px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }

    #legend {
      position: absolute; bottom: 22px; left: 24px;
      background: rgba(255,255,255,0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,0.08); border-radius: 12px;
      padding: 12px 16px; pointer-events: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    #legend .row { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #444; margin: 3px 0; }
    #legend .row b { color: #1a1a1e; font-weight: 700; width: 46px; }
    #legend .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    #legend .hd { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #999; text-transform: uppercase; margin-bottom: 6px; }

    #phase-label {
      position: absolute; top: 24px; right: 26px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
      color: #0071e3; text-transform: uppercase;
      background: rgba(0,113,227,0.08); border-radius: 980px;
      padding: 6px 14px; pointer-events: none;
      transition: opacity .25s ease;
    }

    @media (max-width: 560px) {
      #title-label { top: 12px; left: 12px; max-width: calc(100% - 88px); }
      #title-label .t1 { font-size: 11px; gap: 6px }
      #title-label .t1::before { width: 2px; height: 12px }
      #title-label .t2 { font-size: 7.5px; margin-top: 3px; padding-left: 8px; line-height: 1.4 }
      #phase-label { top: 12px; right: 12px; font-size: 8px; padding: 4px 9px }
      #legend { bottom: 12px; left: 12px; padding: 8px 10px; border-radius: 9px }
      #legend .hd { font-size: 8px; margin-bottom: 4px }
      #legend .row { font-size: 8.5px; gap: 5px; margin: 2px 0 }
      #legend .row b { width: 32px }
      #legend .dot { width: 5px; height: 5px }
    }
  </style>
</head>
<body>
<div id="canvas-container"></div>
<div id="vignette"></div>

<div id="title-label">
  <div class="t1">Vehicle Lane Change — 3-Segment Trajectory</div>
  <div class="t2">start distance · transition (bias) · end distance</div>
</div>

<div id="phase-label">Idle</div>

<div id="legend">
  <div class="hd">3-Segment Params</div>
  <div class="row"><b>Lane A</b><span class="dot" style="background:#22c55e"></span><span id="p0-txt">—</span></div>
  <div class="row"><b>Lane B</b><span class="dot" style="background:#ef4444"></span><span id="p1-txt">—</span></div>
  <div class="row"><b>bias</b><span id="bias-txt">—</span></div>
</div>

<script>
(function() {
  const show = msg => {
    let d = document.getElementById('_err');
    if (!d) { d = document.createElement('pre'); d.id='_err'; Object.assign(d.style,{position:'fixed',top:'0',left:'0',zIndex:'9999',background:'rgba(0,0,0,0.92)',color:'#f66',padding:'12px',maxWidth:'90vw',maxHeight:'60vh',overflow:'auto',fontSize:'12px',whiteSpace:'pre-wrap'}); document.body.appendChild(d); }
    d.textContent += msg + '\n';
  };
  window.addEventListener('error', e => show('ERROR: ' + e.message + '\n  at ' + e.filename + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => show('IMPORT ERROR: ' + (e.reason?.message || e.reason || 'unknown')));
})();
</script>

<script type="importmap">
{
  "imports": {
    "three":          "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 }        from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// ─── Scene ────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 24, 46);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.6, 5.6, -10.5);
camera.lookAt(1.9, 0.4, 2.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(1.9, 0.4, 2.5);
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 4;
controls.maxDistance = 26;
controls.update();

// ─── Lights ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(7, 12, -5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.1; keyLight.shadow.camera.far = 40;
keyLight.shadow.camera.left = -12; keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12; keyLight.shadow.camera.bottom = -12;
keyLight.shadow.bias = -0.0015;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xaac4ff, 0.55);
rimLight.position.set(-6, 5, 6);
scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
fillLight.position.set(-2, 3, -4);
scene.add(fillLight);

// ─── Ground ───────────────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.001;
ground.receiveShadow = true;
scene.add(ground);

// ─── Road markings (children of roadGroup — the road scrolls forever under a fixed car) ──
const LANE_HALF = 1.9;
const LANE_SHIFT = LANE_HALF * 2;      // Lane A center (0) -> Lane B center (3.8)
const Z_FROM = -5, Z_TO = 15;
const DASH_LEN = 2.2, GAP_LEN = 1.6;
const ROAD_CYCLE = DASH_LEN + GAP_LEN;  // dash pattern period -> seamless infinite scroll

const roadGroup = new THREE.Group();
scene.add(roadGroup);

function straightPts(x, zFrom, zTo, n = 80) {
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(new THREE.Vector3(x, 0.02, zFrom + (zTo - zFrom) * (i / n)));
  return pts;
}
function makeThickLine(x, zFrom, zTo, color, width) {
  const pts = straightPts(x, zFrom, zTo);
  const flat = []; for (const p of pts) flat.push(p.x, p.y, p.z);
  const geo = new LineGeometry(); geo.setPositions(flat);
  const mat = new LineMaterial({ color, linewidth: width, resolution: new THREE.Vector2(window.innerWidth, window.innerHeight), worldUnits: false });
  const line = new Line2(geo, mat);
  line.frustumCulled = false;
  return { line, mat };
}
function makeThickDashedLine(x, zFrom, zTo, color, width, dashLen = 2.2, gapLen = 1.6) {
  const group = new THREE.Group();
  const mats = [];
  let z = zFrom;
  while (z < zTo) {
    const zEnd = Math.min(z + dashLen, zTo);
    const flat = [x, 0.02, z, x, 0.02, zEnd];
    const geo = new LineGeometry(); geo.setPositions(flat);
    const mat = new LineMaterial({ color, linewidth: width, resolution: new THREE.Vector2(window.innerWidth, window.innerHeight), worldUnits: false });
    const seg = new Line2(geo, mat); seg.frustumCulled = false;
    group.add(seg); mats.push(mat);
    z = zEnd + gapLen;
  }
  return { group, mats };
}

const allLineMats = [];
const edgeLeft  = makeThickLine(-LANE_HALF, Z_FROM, Z_TO, 0x666666, 2); roadGroup.add(edgeLeft.line); allLineMats.push(edgeLeft.mat);
const edgeRight = makeThickLine(LANE_HALF * 3, Z_FROM, Z_TO, 0x666666, 2); roadGroup.add(edgeRight.line); allLineMats.push(edgeRight.mat);
const centerDivider = makeThickDashedLine(LANE_HALF, Z_FROM, Z_TO, 0x444444, 3, DASH_LEN, GAP_LEN); roadGroup.add(centerDivider.group); allLineMats.push(...centerDivider.mats);

// ─── Materials for the vehicle (same recipe as LetralFunction.html's buildEgo) ──
function buildEgo() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.6, 4.2),
    new THREE.MeshPhysicalMaterial({ color: 0xf4f4f2, metalness: 0.45, roughness: 0.22, clearcoat: 1.0, clearcoatRoughness: 0.08 })
  );
  body.position.y = 0.55; body.castShadow = true; g.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.5, 2.2),
    new THREE.MeshPhysicalMaterial({ color: 0x3a4a5a, metalness: 0.2, roughness: 0.3, transparent: true, opacity: 0.78 })
  );
  cabin.position.set(0, 1.05, -0.3); cabin.castShadow = true; g.add(cabin);
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(1.82, 0.04, 4.22),
    new THREE.MeshBasicMaterial({ color: 0x0071e3, transparent: true, opacity: 0.7 })
  );
  stripe.position.y = 0.28; g.add(stripe);
  const wGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 24);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  for (const [x, y, z] of [[-0.95,0.32,-1.35],[0.95,0.32,-1.35],[-0.95,0.32,1.35],[0.95,0.32,1.35]]) {
    const w = new THREE.Mesh(wGeo, wMat); w.rotation.z = Math.PI/2; w.position.set(x,y,z); w.castShadow=true; g.add(w);
  }
  for (const x of [-0.65, 0.65]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.06), new THREE.MeshBasicMaterial({ color: 0xfff8e0 }));
    hl.position.set(x, 0.5, 2.12); g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.10, 0.06), new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.9 }));
    tl.position.set(x, 0.5, -2.12); g.add(tl);
  }
  return g;
}
const ego = buildEgo();
scene.add(ego);

// ─── 3-segment trajectory — same shape as LetralFunction.html's lane-change (RMA) logic ──
// seg1 (start distance): straight in the current lane
// seg2 (transition):     quartic bias curve, zero slope at both ends
// seg3 (end distance):   straight in the new lane
function poly4(s) { const s2 = s*s, s3 = s2*s, s4 = s3*s; return 3*s4 - 8*s3 + 6*s2; }
function poly4Prime(s) { const s2 = s*s; return 12*s2*s - 24*s2 + 12*s; }

const SEG1_LEN = 3.5;                   // start distance
const SEG2_LEN = 7.0;                   // transition distance
const SEG3_LEN = 3.5;                   // end distance
const MOVE_DIST = SEG1_LEN + SEG2_LEN + SEG3_LEN;
const BIAS = LANE_SHIFT;                // lateral offset the transition covers
const T_LEG = 2.6;                       // matches the robotic-arm demo's cycle (for the side-by-side page)
const FORWARD_SPEED = MOVE_DIST / T_LEG; // constant forward speed — car always drives ahead, never back

function trajX(relZ) {
  if (relZ <= SEG1_LEN) return 0;
  if (relZ <= SEG1_LEN + SEG2_LEN) return BIAS * poly4((relZ - SEG1_LEN) / SEG2_LEN);
  return BIAS;
}
function trajHeading(relZ) {
  if (relZ <= SEG1_LEN || relZ > SEG1_LEN + SEG2_LEN) return 0;
  const s = (relZ - SEG1_LEN) / SEG2_LEN;
  return Math.atan(BIAS * poly4Prime(s) / SEG2_LEN);
}
function trajXReturn(relZ) {
  if (relZ <= SEG1_LEN) return BIAS;
  if (relZ <= SEG1_LEN + SEG2_LEN) return BIAS * (1 - poly4((relZ - SEG1_LEN) / SEG2_LEN));
  return 0;
}
function trajHeadingReturn(relZ) {
  if (relZ <= SEG1_LEN || relZ > SEG1_LEN + SEG2_LEN) return 0;
  const s = (relZ - SEG1_LEN) / SEG2_LEN;
  return -Math.atan(BIAS * poly4Prime(s) / SEG2_LEN);
}

document.getElementById('p0-txt').textContent = `x=0.00  start distance ${SEG1_LEN}m`;
document.getElementById('p1-txt').textContent = `x=${BIAS.toFixed(2)}  end distance ${SEG3_LEN}m`;
document.getElementById('bias-txt').textContent = `${BIAS.toFixed(2)}m over ${SEG2_LEN}m transition`;

// ─── Trajectory trail — shows only the *remaining* (not-yet-driven) portion of the
// current leg, redrawn each frame while transitioning so it shrinks as the car eats
// into it. No trailing/already-driven line is kept behind the car. Hidden while holding. ──
const curveAnchor = new THREE.Group();
scene.add(curveAnchor);

function buildSegmentedTrail(color) {
  const group = new THREE.Group();
  const lines = [];
  for (let i = 0; i < 3; i++) {
    const geo = new LineGeometry(); geo.setPositions(new Array(3 * 41).fill(0));
    const mat = new LineMaterial({ color, linewidth: 3, transparent: true, opacity: 0.5, resolution: new THREE.Vector2(window.innerWidth, window.innerHeight) });
    const line = new Line2(geo, mat);
    group.add(line); lines.push({ line, mat });
  }
  return { group, lines };
}
// draws only the part of [relZ, MOVE_DIST] that's still ahead, positioned relative to the car
function updateRemainingTrail(trail, fn, relZ) {
  const ranges = [
    [0, SEG1_LEN, 0.3],
    [SEG1_LEN, SEG1_LEN + SEG2_LEN, 0.85],
    [SEG1_LEN + SEG2_LEN, MOVE_DIST, 0.3],
  ];
  ranges.forEach(([zFrom, zTo, opacity], i) => {
    const { line, mat } = trail.lines[i];
    const from = Math.max(zFrom, relZ);
    if (from >= zTo) { line.visible = false; return; }
    line.visible = true;
    const N = 40;
    const positions = [];
    for (let j = 0; j <= N; j++) {
      const absZ = from + (zTo - from) * (j / N);
      positions.push(fn(absZ), 0.03, absZ - relZ);
    }
    line.geometry.setPositions(positions);
    line.computeLineDistances();
    mat.opacity = opacity;
  });
}
const trail = buildSegmentedTrail(0x0071e3);
curveAnchor.add(trail.group);
for (const { mat } of trail.lines) allLineMats.push(mat);

// ─── Target-lane gizmo (only the destination marker is shown while transitioning) ──
function makeGizmo(color) {
  const g = new THREE.Group();
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6 }));
  dot.position.y = 0.05;
  g.add(dot);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.4, 32), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.021;
  g.add(ring);
  curveAnchor.add(g);
  return g;
}
const gizmoEnd = makeGizmo(0xef4444);
let legEndX = BIAS; // x of the destination lane for the current leg

// ─── Animation state machine (same rhythm as the robotic-arm demo) ────────
const HOLD_DUR = 1.0;
const phases = ['hold-start', 'move-forward', 'hold-end', 'move-backward'];
let phaseIdx = 0;
let phaseT = 0;
const phaseLabelEl = document.getElementById('phase-label');
const phaseNames = { 'hold-start': 'Hold · Lane A', 'move-forward': 'Trajectory → End', 'hold-end': 'Hold · Lane B', 'move-backward': 'Trajectory → Start' };

let liveX = 0;
let liveHeading = 0;
const clock = new THREE.Clock();
let travelZ = 0;
let inMove = false;

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  phaseT += dt;
  travelZ += FORWARD_SPEED * dt; // always advances, regardless of phase

  const phase = phases[phaseIdx];
  phaseLabelEl.textContent = phaseNames[phase];

  let relZ = 0, fn = null;

  if (phase === 'hold-start') {
    liveX = 0; liveHeading = 0; inMove = false;
    if (phaseT >= HOLD_DUR) { phaseT = 0; phaseIdx = 1; }
  } else if (phase === 'move-forward') {
    relZ = FORWARD_SPEED * phaseT; fn = trajX;
    liveX = trajX(relZ);
    liveHeading = trajHeading(relZ);
    inMove = true; legEndX = BIAS;
    if (relZ >= MOVE_DIST) { phaseT = 0; phaseIdx = 2; }
  } else if (phase === 'hold-end') {
    liveX = BIAS; liveHeading = 0; inMove = false;
    if (phaseT >= HOLD_DUR) { phaseT = 0; phaseIdx = 3; }
  } else {
    relZ = FORWARD_SPEED * phaseT; fn = trajXReturn;
    liveX = trajXReturn(relZ);
    liveHeading = trajHeadingReturn(relZ);
    inMove = true; legEndX = 0;
    if (relZ >= MOVE_DIST) { phaseT = 0; phaseIdx = 0; }
  }

  // road: fixed sideways — only scrolls forever forward (never reverses)
  roadGroup.position.set(0, 0, -(travelZ % ROAD_CYCLE));
  // trajectory: only shown while transitioning — draws just the remaining (ahead)
  // portion, shrinking as the car drives through it. Hidden while holding in a lane.
  curveAnchor.visible = inMove;
  if (inMove) {
    updateRemainingTrail(trail, fn, Math.min(relZ, MOVE_DIST));
    gizmoEnd.position.set(legEndX, 0, MOVE_DIST - Math.min(relZ, MOVE_DIST));
  }
  // the car itself now carries the lane-change offset, not the world
  ego.rotation.y = liveHeading;

  const timeSec = performance.now() / 1000;
  ego.position.x = liveX;
  ego.position.y = Math.sin(timeSec * 1.4) * 0.012;

  controls.update();
  renderer.render(scene, camera);
}
tick();

// ─── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  for (const m of allLineMats) m.resolution.set(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
