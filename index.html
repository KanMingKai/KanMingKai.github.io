<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>甘銘凱 Ming-Kai Kan — 履歷</title>
<!--
  轉址頁。履歷本體在 home/index.html。

  為什麼需要這個檔:GitHub Pages 把 repo 根目錄當網站根目錄,
  https://kanmingkai.github.io/ 會去找根目錄的 index.html。
  履歷移進 home/ 之後,根目錄若沒有這個檔,首頁就會 404。

  如果你希望網址直接是 .../home/ 而不要轉址,刪掉這個檔即可
  (代價是 https://kanmingkai.github.io/ 會 404)。
-->
<link rel="canonical" href="https://kanmingkai.github.io/home/">
<meta http-equiv="refresh" content="0; url=home/index.html">
<script>location.replace('home/index.html');</script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#1d1d1f}
  a{color:#0071e3;font-weight:600}
</style>
</head>
<body>
  <p>正在前往履歷…若沒有自動跳轉,請點 <a href="home/index.html">這裡</a>。</p>
</body>
</html>
