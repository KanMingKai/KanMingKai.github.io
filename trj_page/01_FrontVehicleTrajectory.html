<body>
<div class="simnote">示意動畫 · 非實測數據</div>
<div style="width:100vw;height:100vh;position:relative;overflow:hidden;">
  <div id="mount" style="width:100%;height:100%;"></div>

  <div id="title-label">
    <div class="t1">Follow Leading Vehicle</div>
    <div class="t2">Live Demo to 20+ OEM Customers · In Production on Passenger Cars and Trucks</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

// ─── Road constants ───────────────────────────────────────────────────────
const LANE_W     = 3.5;
const NB_L_EDGE  = -3.5,  NB_R_EDGE  = 7.0;
const NB_DIV_L   =  0.0,  NB_DIV_R   = 3.5;
const NB_CTR_L   = -1.75, NB_CTR_C   = 1.75, NB_CTR_R = 5.25;
const CTR_LINE_X = -3.5;
const OPP_L_EDGE = -10.5;
const OPP_DIV    = -7.0;
const OPP_CTR_R  = -5.25, OPP_CTR_L  = -8.75;
const FULL_W     = NB_R_EDGE - OPP_L_EDGE;
const FULL_CX    = (NB_R_EDGE + OPP_L_EDGE) / 2;

const SPEED      = 40 / 3.6;
const STOP_Z     = SPEED * 2 + 50;  // 路口前直線 50m
const CROSS_HALF = SPEED * 5 / 2;
const CYCLE_LEN  = SPEED * 28;

const CURVE_START = STOP_Z - SPEED * 2;  // 路口前開始偏移
const CURVE_LEN   = 35;
const CURVE_AMP   = 1.0;

function poly4(s) {
  const s2=s*s, s3=s2*s, s4=s3*s;
  return 3*s4 - 8*s3 + 6*s2;
}

function vehALogicalX(absZ) {
  const relZ = absZ - CURVE_START;
  if (relZ <= 0) return NB_CTR_C;
  if (relZ >= CURVE_LEN) return NB_CTR_C - CURVE_AMP;
  return NB_CTR_C - CURVE_AMP * poly4(relZ / CURVE_LEN);
}

const DASH_LEN = 3.0, GAP_LEN = 1.5;
const A_OFF = 18, B_OFF = 28, C_OFF = 12;
const OPP1_OFF = 20, OPP2_OFF = 50;

// ─── Three.js helpers ─────────────────────────────────────────────────────
function makeSlab(w, d, color, cx = 0, cz = 0, y = 0.005) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({ color })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(cx, y, cz);
  m.receiveShadow = true;
  return m;
}

function solidLine(x, zFrom, zTo, color = 0xcccccc, w = 0.15, op = 0.8) {
  const len = zTo - zFrom;
  if (len <= 0) return new THREE.Group();
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, len),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.013, (zFrom + zTo) / 2);
  return m;
}

function dashedLine(x, color, zFrom, zTo, lw = 0.13, op = 0.82) {
  const cyc = DASH_LEN + GAP_LEN;
  const zS  = Math.floor(zFrom / cyc) * cyc;
  const cnt = Math.ceil((zTo - zS) / cyc) + 2;
  const g   = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op });
  for (let i = 0; i < cnt; i++) {
    const z0 = zS + i * cyc, z1 = z0 + DASH_LEN;
    const cz0 = Math.max(z0, zFrom), cz1 = Math.min(z1, zTo);
    if (cz1 <= cz0) continue;
    const len = cz1 - cz0;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(lw, len), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.013, cz0 + len / 2);
    g.add(m);
  }
  return g;
}

function buildEgo() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.6, 4.2),
    new THREE.MeshPhysicalMaterial({ color: 0xf4f4f2, metalness: 0.45, roughness: 0.22, clearcoat: 1.0, clearcoatRoughness: 0.08 })
  );
  body.position.y = 0.55; body.castShadow = true; g.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.5, 2.2),
    new THREE.MeshPhysicalMaterial({ color: 0x3a4a5a, metalness: 0.2, roughness: 0.3, transparent: true, opacity: 0.78 })
  );
  cabin.position.set(0, 1.05, -0.3); cabin.castShadow = true; g.add(cabin);
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(1.82, 0.04, 4.22),
    new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.7 })
  );
  stripe.position.y = 0.28; g.add(stripe);
  const wGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 24);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  for (const [x, y, z] of [[-0.95,0.32,-1.35],[0.95,0.32,-1.35],[-0.95,0.32,1.35],[0.95,0.32,1.35]]) {
    const w = new THREE.Mesh(wGeo, wMat); w.rotation.z = Math.PI/2; w.position.set(x,y,z); w.castShadow=true; g.add(w);
  }
  for (const x of [-0.65, 0.65]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xfff8e0 }));
    hl.position.set(x, 0.5, 2.12); g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.10, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.9 }));
    tl.position.set(x, 0.5, -2.12); g.add(tl);
  }
  return g;
}

function buildVehicle(bodyColor, accentColor, isEgo = false) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.58, 4.2),
    new THREE.MeshPhysicalMaterial({
      color: bodyColor, metalness: isEgo ? 0.5 : 0.3,
      roughness: isEgo ? 0.2 : 0.5, clearcoat: isEgo ? 1 : 0.3
    })
  );
  body.position.y = 0.54; body.castShadow = true; g.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.48, 2.1),
    new THREE.MeshPhysicalMaterial({ color: 0x2a3a4a, transparent: true, opacity: 0.8 })
  );
  cabin.position.set(0, 1.02, -0.25); g.add(cabin);

  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(1.84, 0.04, 4.24),
    new THREE.MeshBasicMaterial({ color: accentColor, transparent: true, opacity: 0.85 })
  );
  stripe.position.y = 0.26; g.add(stripe);

  const wGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 16);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  for (const [wx, wz] of [[-0.95,-1.35],[0.95,-1.35],[-0.95,1.35],[0.95,1.35]]) {
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(wx, 0.32, wz);
    w.castShadow = true; g.add(w);
  }

  const hlMat = new THREE.MeshBasicMaterial({ color: isEgo ? 0xffffee : 0xffeecc });
  const tlMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
  for (const hx of [-0.62, 0.62]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.1, 0.05), hlMat);
    hl.position.set(hx, 0.55, 2.13); g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.1, 0.05), tlMat);
    tl.position.set(hx, 0.55, -2.13); g.add(tl);
  }
  return g;
}

function makeDetBox(w, h, d, color) {
  const g   = new THREE.Group();
  const geo = new THREE.BoxGeometry(w, h, d);
  g.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 })
  ));
  g.add(new THREE.Mesh(geo,
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.06, side: THREE.DoubleSide })
  ));
  return g;
}

function makeLabel(text, hexColor) {
  const c   = document.createElement('canvas');
  c.width = 220; c.height = 52;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor + 'cc';
  ctx.beginPath(); ctx.roundRect(3, 3, 214, 46, 7); ctx.fill();
  ctx.strokeStyle = hexColor; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(3, 3, 214, 46, 7); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText(text, 110, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true
  }));
  sp.scale.set(3.0, 0.75, 1);
  sp.position.set(0, 2.2, 0);
  return sp;
}


// ─── Scene setup ──────────────────────────────────────────────────────────
const mount = document.getElementById('mount');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.FogExp2(0xffffff, 0.010);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(mount.clientWidth, mount.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
mount.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(55, mount.clientWidth / mount.clientHeight, 0.1, 300);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 1.3);
dir.position.set(-10, 20, -15); dir.castShadow = true;
dir.shadow.mapSize.set(1024, 1024);
Object.assign(dir.shadow.camera, { near:0.1, far:120, left:-50, right:50, top:50, bottom:-50 });
scene.add(dir);
const rim = new THREE.DirectionalLight(0xaabbdd, 0.4);
rim.position.set(10, 8, 5); scene.add(rim);

// Street lamps
const INT_CZ = STOP_Z + CROSS_HALF;
for (const [lx, z] of [
  [OPP_L_EDGE-1, STOP_Z-1], [NB_R_EDGE+1, STOP_Z-1],
  [OPP_L_EDGE-1, STOP_Z+CROSS_HALF*2+1], [NB_R_EDGE+1, STOP_Z+CROSS_HALF*2+1]
]) {
  const pl = new THREE.PointLight(0xffcc88, 1.4, 30);
  pl.position.set(-lx, 5, z);
  scene.add(pl);
}



// Road geometry
scene.add(makeSlab(400, 800, 0xffffff, 0, 200, -0.02));

// Lane markings (X negated)
const SF = -70, ST = STOP_Z;
scene.add(solidLine(-FULL_CX, ST - 0.125, ST + 0.125, 0x666666, FULL_W, 0.9));
scene.add(solidLine(-NB_R_EDGE,  SF, ST, 0x444444));
scene.add(solidLine(-OPP_L_EDGE, SF, ST, 0x444444));
scene.add(dashedLine(-NB_DIV_L, 0x555555, SF, ST));
scene.add(dashedLine(-NB_DIV_R, 0x555555, SF, ST));
scene.add(dashedLine(-OPP_DIV,  0x555555, SF, ST));
scene.add(solidLine(-(CTR_LINE_X - 0.14), SF, ST, 0xffaa00, 0.14, 0.9));
scene.add(solidLine(-(CTR_LINE_X + 0.14), SF, ST, 0xffaa00, 0.14, 0.9));

// 本車道中心線（橘色），路口前截斷
scene.add(solidLine(-NB_CTR_C, SF, STOP_Z, 0xff6600, 0.12, 0.9));

// 路口後車道線
const SA = STOP_Z + CROSS_HALF * 2;  // 路口後起點
const SE = SA + 150;                  // 路口後終點
scene.add(solidLine(-NB_R_EDGE,  SA, SE, 0x444444));
scene.add(solidLine(-OPP_L_EDGE, SA, SE, 0x444444));
scene.add(dashedLine(-NB_DIV_L, 0x555555, SA, SE));
scene.add(dashedLine(-NB_DIV_R, 0x555555, SA, SE));
scene.add(dashedLine(-OPP_DIV,  0x555555, SA, SE));
scene.add(solidLine(-(CTR_LINE_X - 0.14), SA, SE, 0xffaa00, 0.14, 0.9));
scene.add(solidLine(-(CTR_LINE_X + 0.14), SA, SE, 0xffaa00, 0.14, 0.9));
// 路口後本車道中心線（橘色）
scene.add(solidLine(-NB_CTR_C, SA, SE, 0xff6600, 0.12, 0.9));

// Vehicles
const ego = buildEgo();
scene.add(ego);
ego.traverse(obj => { if (obj.isMesh) { obj.renderOrder = 10; obj.material.depthTest = true; } });

const vehA = buildVehicle(0x3366cc, 0x4488ff);
const vehB = buildVehicle(0x334466, 0x5577aa);
const vehC = buildVehicle(0x334466, 0x5577aa);
scene.add(vehA); scene.add(vehB); scene.add(vehC);
const bA = makeDetBox(1.9,1.6,4.3,0x4488ff); bA.position.y=0.75; vehA.add(bA);
const bB = makeDetBox(1.9,1.5,4.3,0x7799cc); bB.position.y=0.75; vehB.add(bB);
const bC = makeDetBox(1.9,1.5,4.3,0x7799cc); bC.position.y=0.75; vehC.add(bC);
[vehA, vehB, vehC].forEach(v => v.traverse(obj => { if (obj.isMesh) { obj.renderOrder = 10; } }));
vehA.add(makeLabel('CIPV — Vehicle A', '#4488ff'));
vehB.add(makeLabel('Vehicle B', '#5577aa'));
vehC.add(makeLabel('Vehicle C', '#5577aa'));

const vO1 = buildVehicle(0x2a1a1a, 0xcc4422);
const vO2 = buildVehicle(0x1a1a2a, 0xcc4422);
vO1.rotation.y = Math.PI; vO2.rotation.y = Math.PI;
scene.add(vO1); scene.add(vO2);

// Path lines - 藍色粗線 + 橘色粗線
const { LineGeometry } = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineGeometry.js');
const { LineMaterial } = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineMaterial.js');
const { Line2 }        = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/Line2.js');

const pathGeo = new LineGeometry();
pathGeo.setPositions(new Array(61 * 3).fill(0));
const pathMat = new LineMaterial({
  color: 0x2266ff, linewidth: 3,
  resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
  worldUnits: false
});
const pathLine = new Line2(pathGeo, pathMat);
pathLine.frustumCulled = false;
pathLine.renderOrder = 1;
scene.add(pathLine);

const orangeGeo = new LineGeometry();
orangeGeo.setPositions(new Array(61 * 3).fill(0));
const orangeMat = new LineMaterial({
  color: 0xff8800, linewidth: 3,
  resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
  worldUnits: false, depthTest: false
});
const orangeLine = new Line2(orangeGeo, orangeMat);
orangeLine.frustumCulled = false;
orangeLine.renderOrder = 2;
scene.add(orangeLine);

const updatePath = (egoZ, pathLen, vAz) => {
  // 藍色：前車已走過的軌跡（ego 車頭 → 前車位置）
  const ptsBlue = [];
  const blueLen = vAz - (egoZ + 2.1);
  for (let i = 0; i <= 60; i++) {
    const z  = egoZ + 2.1 + (i / 60) * Math.max(0, blueLen);
    const wx = -vehALogicalX(z);
    ptsBlue.push(wx, 0.05, z);
  }
  pathLine.geometry.setPositions(ptsBlue);

  // 橘色：道路中心線（固定 x = -NB_CTR_C，往前延伸）
  const ptsOrange = [];
  for (let i = 0; i <= 60; i++) {
    const z = egoZ + 2.1 + (i / 60) * pathLen;
    ptsOrange.push(-NB_CTR_C, 0.08, z);
  }
  orangeLine.geometry.setPositions(ptsOrange);
};

// ─── 三段軌跡線（phase 1 出現，固定在路面）─────────────────────────────────
const TSEG1 = 10, TSEG2 = 30, TSEG3 = 15;
const TRAJ_COLORS_FVT    = [0xff8800, 0xff2200, 0xff8800];
const TRAJ_OPACITIES_FVT = [0.45, 0.85, 1.00];

function makeTrajLine(color, opacity) {
  const geo = new LineGeometry();
  geo.setPositions(new Array(61 * 3).fill(0));
  const mat = new LineMaterial({
    color, opacity, transparent: true, linewidth: 3,
    resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
    worldUnits: false, depthTest: true
  });
  const line = new Line2(geo, mat);
  line.frustumCulled = false;
  line.renderOrder = 3;
  scene.add(line);
  return line;
}

const trajLines = [
  makeTrajLine(TRAJ_COLORS_FVT[0], TRAJ_OPACITIES_FVT[0]),
  makeTrajLine(TRAJ_COLORS_FVT[1], TRAJ_OPACITIES_FVT[1]),
  makeTrajLine(TRAJ_COLORS_FVT[2], TRAJ_OPACITIES_FVT[2]),
];

let trajDeployZ = null;
let trajDeployZ2 = null;

// 第二組軌跡（路口後：前車位置 → 道路中心）
const trajLines2 = [
  makeTrajLine(TRAJ_COLORS_FVT[0], TRAJ_OPACITIES_FVT[0]),
  makeTrajLine(TRAJ_COLORS_FVT[1], TRAJ_OPACITIES_FVT[1]),
  makeTrajLine(TRAJ_COLORS_FVT[2], TRAJ_OPACITIES_FVT[2]),
];

function buildTrajLines2(deployZ) {
  const xStart = -vehALogicalX(deployZ);        // Seg1: 前車軌跡終點 x（藍色線）
  const xEnd   = -NB_CTR_C;                     // Seg3: 道路中心（橘色線）

  // Seg1: 前車 x，z = deployZ → deployZ+TSEG1
  const f1 = [];
  for (let i = 0; i <= 30; i++) {
    f1.push(xStart, 0.09, deployZ + i / 30 * TSEG1);
  }
  trajLines2[0].geometry.setPositions(f1);

  // Seg2: poly4 從前車 x 過渡到道路中心
  const f2 = [];
  const z2Start = deployZ + TSEG1;
  for (let i = 0; i <= 60; i++) {
    const s = i / 60;
    const z = z2Start + s * TSEG2;
    f2.push(xStart + (xEnd - xStart) * poly4(s), 0.09, z);
  }
  trajLines2[1].geometry.setPositions(f2);

  // Seg3: 道路中心（橘色），z = deployZ+TSEG1+TSEG2 → +TSEG3
  const f3 = [];
  const z3Start = deployZ + TSEG1 + TSEG2;
  for (let i = 0; i <= 30; i++) {
    f3.push(xEnd, 0.09, z3Start + i / 30 * TSEG3);
  }
  trajLines2[2].geometry.setPositions(f3);
}

function buildTrajLines(deployZ) {
  // Seg1: 本車道中心（x = -NB_CTR_C），z = deployZ → deployZ+TSEG1
  const f1 = [];
  for (let i = 0; i <= 30; i++) {
    f1.push(-NB_CTR_C, 0.09, deployZ + i / 30 * TSEG1);
  }
  trajLines[0].geometry.setPositions(f1);

  // Seg2: poly4 過渡從 -NB_CTR_C 到前車 x，z = deployZ+TSEG1 → deployZ+TSEG1+TSEG2
  const f2 = [];
  const z2Start = deployZ + TSEG1;
  for (let i = 0; i <= 60; i++) {
    const s  = i / 60;
    const z  = z2Start + s * TSEG2;
    const x0 = -NB_CTR_C;
    const x1 = -vehALogicalX(z);
    f2.push(x0 + (x1 - x0) * poly4(s), 0.09, z);
  }
  trajLines[1].geometry.setPositions(f2);

  // Seg3: 沿前車軌跡，z = deployZ+TSEG1+TSEG2 → deployZ+TSEG1+TSEG2+TSEG3
  const f3 = [];
  const z3Start = deployZ + TSEG1 + TSEG2;
  for (let i = 0; i <= 30; i++) {
    const z = z3Start + i / 30 * TSEG3;
    f3.push(-vehALogicalX(z), 0.09, z);
  }
  trajLines[2].geometry.setPositions(f3);
}

// ─── Animation loop ───────────────────────────────────────────────────────
let totalScroll = 0, lastTime = performance.now();
let modePhase = 0, phaseStart = 0, cycleStartTime = performance.now();

const animate = (now) => {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  totalScroll += SPEED * dt;

  const cyc  = totalScroll % CYCLE_LEN;
  const egoZ = cyc;

  // ── ego x 位置：phase 1 跟著三段軌跡走，其他跟前車 ──────────────────────
  let egoWX, heading = 0;
  if (modePhase === 1 && trajDeployZ !== null) {
    const relZ = egoZ - trajDeployZ;
    if (relZ <= TSEG1) {
      egoWX = NB_CTR_C;
      heading = 0;
    } else if (relZ <= TSEG1 + TSEG2) {
      const s  = (relZ - TSEG1) / TSEG2;
      const dx = vehALogicalX(egoZ) - NB_CTR_C;
      egoWX = NB_CTR_C + dx * poly4(s);
      const dz = 0.5;
      const s1 = Math.max(0, Math.min(1, (relZ - TSEG1 - dz) / TSEG2));
      const s2 = Math.max(0, Math.min(1, (relZ - TSEG1 + dz) / TSEG2));
      const x1 = NB_CTR_C + dx * poly4(s1);
      const x2 = NB_CTR_C + dx * poly4(s2);
      heading = Math.atan(-(x2 - x1) / (2 * dz));
    } else {
      egoWX = vehALogicalX(egoZ);
      const dz = 0.5;
      heading = Math.atan(-(vehALogicalX(egoZ + dz) - vehALogicalX(egoZ - dz)) / (2 * dz));
    }
  } else if (modePhase === 3) {
    if (trajDeployZ2 !== null) {
      const relZ = egoZ - trajDeployZ2;
      const xStart = vehALogicalX(trajDeployZ2);
      const xEnd   = NB_CTR_C;
      if (relZ <= TSEG1) {
        egoWX = xStart;
        heading = 0;
      } else if (relZ <= TSEG1 + TSEG2) {
        const s  = (relZ - TSEG1) / TSEG2;
        egoWX = xStart + (xEnd - xStart) * poly4(s);
        const dz = 0.5;
        const s1 = Math.max(0, Math.min(1, (relZ - TSEG1 - dz) / TSEG2));
        const s2 = Math.max(0, Math.min(1, (relZ - TSEG1 + dz) / TSEG2));
        const x1 = xStart + (xEnd - xStart) * poly4(s1);
        const x2 = xStart + (xEnd - xStart) * poly4(s2);
        heading = Math.atan(-(x2 - x1) / (2 * dz));
      } else {
        egoWX = NB_CTR_C;
        heading = 0;
      }
    } else {
      egoWX = vehALogicalX(egoZ);
      heading = 0;
    }
  } else if (modePhase === 0) {
    egoWX = NB_CTR_C;
    heading = 0;
  } else {
    egoWX = vehALogicalX(egoZ);
    heading = 0;
  }

  ego.position.set(-egoWX, 0, egoZ);
  ego.rotation.y = heading;

  const vAz = egoZ + A_OFF, vBz = egoZ + B_OFF, vCz = egoZ + C_OFF;
  vehA.position.set(-vehALogicalX(vAz), 0, vAz);
  vehB.position.set(-NB_CTR_L, 0, vBz);
  vehC.position.set(-NB_CTR_R, 0, vCz);

  const os = totalScroll % CYCLE_LEN;
  vO1.position.set(-OPP_CTR_R, 0, STOP_Z + OPP1_OFF - os);
  vO2.position.set(-OPP_CTR_L, 0, STOP_Z + OPP2_OFF - os);

  // 相機跟著車頭方向
  const camDist = 14, camLookAhead = 10;
  const camX = -egoWX - Math.sin(heading) * camDist;
  const camZ =  egoZ  - Math.cos(heading) * camDist;
  const lookX = -egoWX + Math.sin(heading) * camLookAhead;
  const lookZ =  egoZ  + Math.cos(heading) * camLookAhead;
  camera.position.set(camX, 8, camZ);
  camera.lookAt(new THREE.Vector3(lookX, 1.0, lookZ));

  const TRAJ_TOTAL = TSEG1 + TSEG2 + TSEG3;
  if      (modePhase === 0 && egoZ >= STOP_Z)                                                { modePhase = 1; phaseStart = now; }
  else if (modePhase === 1 && trajDeployZ !== null && egoZ >= trajDeployZ + TRAJ_TOTAL)      { modePhase = 3; phaseStart = now; }
  else if (modePhase === 3 && trajDeployZ !== null && egoZ >= trajDeployZ + TRAJ_TOTAL + 80) { modePhase = 0; cycleStartTime = now; trajDeployZ = null; trajDeployZ2 = null; totalScroll = 0; }
  if (cyc < 0.5 && totalScroll > 1) { modePhase = 0; cycleStartTime = now; trajDeployZ = null; trajDeployZ2 = null; }

  const cycleSec = (now - cycleStartTime) / 1000;
  const dur      = modePhase > 0 ? (now - phaseStart) / 1000 : 0;
  const distA = vAz - egoZ;

  // ── 第一組三段軌跡：phase 1 進入時部署 ───────────────────────────────────
  if (modePhase === 1 && trajDeployZ === null) {
    trajDeployZ = egoZ;
    buildTrajLines(trajDeployZ);
  }
  trajLines.forEach(l => l.visible = modePhase === 1);

  // ── 第二組三段軌跡：phase 3 進入時部署 ───────────────────────────────────
  if (modePhase === 3 && trajDeployZ2 === null) {
    trajDeployZ2 = egoZ;
    buildTrajLines2(trajDeployZ2);
  }
  trajLines2.forEach(l => l.visible = modePhase === 3);

  const returnedToCenter = modePhase === 3 && trajDeployZ2 !== null &&
                           (egoZ - trajDeployZ2) > TSEG1 + TSEG2 + TSEG3;
  pathLine.visible   = !returnedToCenter;
  orangeLine.visible = modePhase === 0;
  updatePath(egoZ, distA, vAz);

  renderer.render(scene, camera);
};

requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = mount.clientWidth / mount.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  pathMat.resolution.set(window.innerWidth, window.innerHeight);
  orangeMat.resolution.set(window.innerWidth, window.innerHeight);
  trajLines.forEach(l => l.material.resolution.set(window.innerWidth, window.innerHeight));
});
</script>
</body>
</html>
