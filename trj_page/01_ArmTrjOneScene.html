<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>從機械手臂到 trj — 同一個場景</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #canvas-container {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(100vw, 1300px); height: min(80vh, 620px);
      overflow: hidden; border-radius: 20px;
    }
    #canvas-container canvas { position: absolute; inset: 0; display: block; }

    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 60%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.06) 100%);
    }

    .title-label { position: absolute; top: 22px; left: 0; pointer-events: none; transform: translateX(-50%); text-align: center; }
    .title-label .t1 {
      font-size: 17px; font-weight: 700; color: #1a1a1e;
      letter-spacing: 0.03em; line-height: 1;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .title-label .t1::before {
      content: ''; display: block;
      width: 3px; height: 16px; border-radius: 2px;
      background: #0071e3;
    }

    #bridge-headline {
      position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
      font-size: 16px; color: #1a1a1e; font-weight: 700; letter-spacing: .01em;
      white-space: nowrap;
    }
    #bridge-arrow {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none; display: block;
    }

    #phase-label {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      font-size: 13px; font-weight: 700; letter-spacing: .05em;
      color: #0071e3; text-transform: uppercase;
      background: rgba(0,113,227,0.08); border-radius: 980px;
      padding: 8px 18px; pointer-events: none;
      transition: opacity .25s ease;
    }

    @media (max-width: 720px) {
      .title-label .t1 { font-size: 13px }
      #bridge-headline { font-size: 11px; top: calc(50% - 80px) }
      #bridge-arrow { width: 46px; height: auto }
      #phase-label { font-size: 10px; padding: 5px 12px; bottom: 90px }
    }
  </style>
</head>
<body>
<div id="canvas-container">
  <div id="vignette"></div>

  <div class="title-label" id="title-arm">
    <div class="t1">Robotic Arm</div>
  </div>
  <div class="title-label" id="title-veh">
    <div class="t1">trj · Vehicle Lane Change</div>
  </div>

  <div id="bridge-headline">導入機器手臂概念到 trj</div>
  <svg id="bridge-arrow" width="90" height="36" viewBox="0 0 100 40" aria-hidden="true">
    <path d="M0,12 H60 V0 L100,20 L60,40 V28 H0 Z" fill="#0071e3"/>
  </svg>

  <div id="phase-label">Idle</div>
</div>


<script>
(function() {
  const show = msg => {
    let d = document.getElementById('_err');
    if (!d) { d = document.createElement('pre'); d.id='_err'; Object.assign(d.style,{position:'fixed',top:'0',left:'0',zIndex:'9999',background:'rgba(0,0,0,0.92)',color:'#f66',padding:'12px',maxWidth:'90vw',maxHeight:'60vh',overflow:'auto',fontSize:'12px',whiteSpace:'pre-wrap'}); document.body.appendChild(d); }
    d.textContent += msg + '\n';
  };
  window.addEventListener('error', e => show('ERROR: ' + e.message + '\n  at ' + e.filename + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => show('IMPORT ERROR: ' + (e.reason?.message || e.reason || 'unknown')));
})();
</script>

<script type="importmap">
{
  "imports": {
    "three":          "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { Line2 }        from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// ─── One shared scene ───────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 34, 72);

const stageEl = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stageEl.prepend(renderer.domElement);

// Fixed camera — no drag/orbit interaction. The FOV is refit on resize so the
// whole composition scales to fit the stage instead of cropping at the sides.
const BASE_FOV = 42;                 // vertical FOV, tuned at BASE_ASPECT
const BASE_ASPECT = 1300 / 620;      // reference stage shape used while designing the scene

const camera = new THREE.PerspectiveCamera(BASE_FOV, stageEl.clientWidth / stageEl.clientHeight, 0.1, 140);
camera.position.set(1.2, 9.9, -10.7);
camera.lookAt(0.3, -0.9, 1.3);

function fitCameraToWindow() {
  const aspect = stageEl.clientWidth / stageEl.clientHeight;
  camera.aspect = aspect;
  camera.fov = aspect < BASE_ASPECT
    ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_FOV / 2)) * BASE_ASPECT / aspect))
    : BASE_FOV;
  camera.updateProjectionMatrix();
}
fitCameraToWindow();

// ─── One shared lighting rig (wide enough to cover both subjects) ─────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(4, 16, -8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.1; keyLight.shadow.camera.far = 50;
keyLight.shadow.camera.left = -20; keyLight.shadow.camera.right = 20;
keyLight.shadow.camera.top = 20; keyLight.shadow.camera.bottom = -20;
keyLight.shadow.bias = -0.0015;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xaac4ff, 0.55);
rimLight.position.set(-10, 6, 6);
scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
fillLight.position.set(0, 4, -10);
scene.add(fillLight);

// ─── One shared ground ──────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.001;
ground.receiveShadow = true;
scene.add(ground);

// ─── Two groups, side by side in the same world ────────────────────────────
// (camera looks toward +Z, which mirrors the X axis on screen — arm must sit at
// +X to render on the left, matching the "Robotic Arm" label there)
const ARM_X = 7.2;
const VEH_X = -7.8;
const armGroup = new THREE.Group();
armGroup.position.x = ARM_X;
scene.add(armGroup);
const vehicleGroup = new THREE.Group();
vehicleGroup.position.x = VEH_X;
vehicleGroup.scale.setScalar(0.62); // the car+road scene reads larger than the arm at 1:1 — scale it down to match
scene.add(vehicleGroup);

// ─── Titles hug the top of each subject (projected from world space, close
// enough that title + object read as one group instead of two floating parts). ──
const titleArmEl = document.getElementById('title-arm');
const titleVehEl = document.getElementById('title-veh');
const armTitleAnchor = new THREE.Vector3(ARM_X, 2.3, 0.1);   // clear of the arm's raised gripper
const vehTitleAnchor = new THREE.Vector3(VEH_X, 1.6, 0);     // clear of the road lines behind the car

function toScreen(worldPos) {
  const v = worldPos.clone().project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * stageEl.clientWidth,
    y: (1 - (v.y * 0.5 + 0.5)) * stageEl.clientHeight,
  };
}
function positionTitles() {
  const gap = stageEl.clientHeight * 0.07; // scales with the stage instead of a fixed px gap
  const a = toScreen(armTitleAnchor);
  const b = toScreen(vehTitleAnchor);
  titleArmEl.style.left = a.x + 'px';
  titleArmEl.style.top = (a.y - gap) + 'px';
  titleVehEl.style.left = b.x + 'px';
  titleVehEl.style.top = (b.y - gap) + 'px';
}
positionTitles();

const allLineMats = [];

/* ============================== ROBOTIC ARM ============================== */

const plateOuter = new THREE.Mesh(
  new THREE.CylinderGeometry(2.7, 2.7, 0.05, 64),
  new THREE.MeshStandardMaterial({ color: 0xeef1f5, roughness: 0.85, metalness: 0.05 })
);
plateOuter.position.y = 0.025;
plateOuter.receiveShadow = true;
armGroup.add(plateOuter);

const plateInner = new THREE.Mesh(
  new THREE.CylinderGeometry(1.15, 1.15, 0.06, 64),
  new THREE.MeshStandardMaterial({ color: 0xd8dee6, roughness: 0.7, metalness: 0.15 })
);
plateInner.position.y = 0.055;
plateInner.receiveShadow = true;
armGroup.add(plateInner);

const matArm    = new THREE.MeshStandardMaterial({ color: 0xf3f5f8, roughness: 0.38, metalness: 0.35 });
const matJoint  = new THREE.MeshStandardMaterial({ color: 0x0071e3, roughness: 0.28, metalness: 0.5, emissive: 0x0071e3, emissiveIntensity: 0.12 });
const matBase   = new THREE.MeshStandardMaterial({ color: 0x2b2f38, roughness: 0.45, metalness: 0.45 });
const matGrip   = new THREE.MeshStandardMaterial({ color: 0x1d1d1f, roughness: 0.4, metalness: 0.4 });
const matTip    = new THREE.MeshStandardMaterial({ color: 0x0071e3, emissive: 0x0a84ff, emissiveIntensity: 1.3, roughness: 0.3 });

const L1 = 1.6, L2 = 1.5, R_LINK = 0.15;
function makeLink(len) {
  const g = new THREE.CapsuleGeometry(R_LINK, Math.max(len - 2 * R_LINK, 0.05), 6, 12);
  const m = new THREE.Mesh(g, matArm);
  m.position.y = len / 2;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

const armBaseMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.72, 0.5, 32), matBase);
armBaseMesh.position.y = 0.25;
armBaseMesh.castShadow = true; armBaseMesh.receiveShadow = true;
armGroup.add(armBaseMesh);

const turretGroup = new THREE.Group();
turretGroup.position.y = 0.5;
armGroup.add(turretGroup);

const turretMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.3, 24), matBase);
turretMesh.position.y = 0.15;
turretMesh.castShadow = true;
turretGroup.add(turretMesh);

const SHOULDER_H = 0.3;
const shoulderPivot = new THREE.Object3D();
shoulderPivot.position.y = SHOULDER_H;
turretGroup.add(shoulderPivot);

const shoulderJoint = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16), matJoint);
shoulderJoint.castShadow = true;
shoulderPivot.add(shoulderJoint);

const upperArmMesh = makeLink(L1);
shoulderPivot.add(upperArmMesh);

const elbowPivot = new THREE.Object3D();
elbowPivot.position.y = L1;
shoulderPivot.add(elbowPivot);

const elbowJoint = new THREE.Mesh(new THREE.SphereGeometry(0.17, 18, 14), matJoint);
elbowJoint.castShadow = true;
elbowPivot.add(elbowJoint);

const forearmMesh = makeLink(L2);
elbowPivot.add(forearmMesh);

const wristGroup = new THREE.Object3D();
wristGroup.position.y = L2;
elbowPivot.add(wristGroup);

const wristJoint = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), matGrip);
wristGroup.add(wristJoint);

const fingerGeo = new THREE.BoxGeometry(0.05, 0.26, 0.09);
const fingerL = new THREE.Mesh(fingerGeo, matGrip);
fingerL.position.set(-0.09, 0.16, 0); fingerL.rotation.z = 0.18; fingerL.castShadow = true;
wristGroup.add(fingerL);
const fingerR = new THREE.Mesh(fingerGeo, matGrip);
fingerR.position.set(0.09, 0.16, 0); fingerR.rotation.z = -0.18; fingerR.castShadow = true;
wristGroup.add(fingerR);

const tipMarker = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), matTip);
tipMarker.position.y = 0.22;
wristGroup.add(tipMarker);

function quinticCoeffs(p0, v0, p1, v1, T) {
  const dp = p1 - p0;
  const c0 = p0, c1 = v0, c2 = 0;
  const c3 = (20 * dp - (8 * v1 + 12 * v0) * T) / (2 * T ** 3);
  const c4 = (30 * -dp + (14 * v1 + 16 * v0) * T) / (2 * T ** 4);
  const c5 = (12 * dp - 6 * (v1 + v0) * T) / (2 * T ** 5);
  return [c0, c1, c2, c3, c4, c5];
}
function evalPoly(c, t) {
  return c[0] + c[1]*t + c[2]*t*t + c[3]*t**3 + c[4]*t**4 + c[5]*t**5;
}
class Quintic3 {
  constructor(P0, V0, P1, V1, T) {
    this.T = T;
    this.cx = quinticCoeffs(P0.x, V0.x, P1.x, V1.x, T);
    this.cy = quinticCoeffs(P0.y, V0.y, P1.y, V1.y, T);
    this.cz = quinticCoeffs(P0.z, V0.z, P1.z, V1.z, T);
  }
  at(t, out = new THREE.Vector3()) {
    const tt = Math.max(0, Math.min(this.T, t));
    out.set(evalPoly(this.cx, tt), evalPoly(this.cy, tt), evalPoly(this.cz, tt));
    return out;
  }
}

const T_LEG = 2.6;   // shared by both the arm's quintic and trj's 3-segment leg
const HOLD_DUR = 1.0;

const armP0 = new THREE.Vector3(-1.55, 1.35, 1.30);
const armV0 = new THREE.Vector3(1.10, 0.70, -0.50);
const armP1 = new THREE.Vector3(1.85, 2.05, 1.35);
const armV1 = new THREE.Vector3(0.50, -0.60, 0.90);


const armTraj = new Quintic3(armP0, armV0, armP1, armV1, T_LEG);

function buildTrailLine(traj, color) {
  const N = 160;
  const positions = [];
  const v = new THREE.Vector3();
  for (let i = 0; i <= N; i++) {
    traj.at((i / N) * traj.T, v);
    positions.push(v.x, v.y, v.z);
  }
  const geo = new LineGeometry();
  geo.setPositions(positions);
  const mat = new LineMaterial({
    color, linewidth: 3, transparent: true, opacity: 0.55,
    resolution: new THREE.Vector2(stageEl.clientWidth, stageEl.clientHeight)
  });
  const line = new Line2(geo, mat);
  line.computeLineDistances();
  return { line, mat };
}
const armTrail = buildTrailLine(armTraj, 0x0071e3);
armGroup.add(armTrail.line);
allLineMats.push(armTrail.mat);

function makeArmGizmo(pos, vel, color) {
  const g = new THREE.Group();
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6 }));
  g.add(dot);
  const dir = vel.clone().normalize();
  const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, 0), 0.55, color, 0.14, 0.09);
  g.add(arrow);
  g.position.copy(pos);
  armGroup.add(g);
  return g;
}
makeArmGizmo(armP0, armV0, 0x22c55e);
makeArmGizmo(armP1, armV1, 0xef4444);

const SHOULDER_WORLD_H = 0.5 + SHOULDER_H;
function solveIK(target) {
  const yaw = Math.atan2(target.x, target.z);
  const r = Math.sqrt(target.x * target.x + target.z * target.z);
  const h = target.y - SHOULDER_WORLD_H;

  let D = Math.sqrt(r * r + h * h);
  const maxReach = L1 + L2 - 0.02;
  const minReach = Math.abs(L1 - L2) + 0.02;
  D = Math.max(minReach, Math.min(maxReach, D));

  const alpha = Math.atan2(r, h);
  const cosBeta = (L1 * L1 + D * D - L2 * L2) / (2 * L1 * D);
  const beta = Math.acos(Math.max(-1, Math.min(1, cosBeta)));
  const shoulderPitch = alpha - beta;

  const cosPsi = (L1 * L1 + L2 * L2 - D * D) / (2 * L1 * L2);
  const psi = Math.acos(Math.max(-1, Math.min(1, cosPsi)));
  const elbowPitch = Math.PI - psi;

  return { yaw, shoulderPitch, elbowPitch };
}
function applyArmPose(target) {
  const { yaw, shoulderPitch, elbowPitch } = solveIK(target);
  turretGroup.rotation.y = yaw;
  shoulderPivot.rotation.x = shoulderPitch;
  elbowPivot.rotation.x = elbowPitch;
}

/* ============================== VEHICLE / trj ============================== */

const LANE_HALF = 1.9;
const LANE_SHIFT = LANE_HALF * 2;
const Z_FROM = -5, Z_TO = 15;
const DASH_LEN = 2.2, GAP_LEN = 1.6;
const ROAD_CYCLE = DASH_LEN + GAP_LEN;

const roadGroup = new THREE.Group();
vehicleGroup.add(roadGroup);

function straightPts(x, zFrom, zTo, n = 80) {
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(new THREE.Vector3(x, 0.02, zFrom + (zTo - zFrom) * (i / n)));
  return pts;
}
function makeThickLine(x, zFrom, zTo, color, width) {
  const pts = straightPts(x, zFrom, zTo);
  const flat = []; for (const p of pts) flat.push(p.x, p.y, p.z);
  const geo = new LineGeometry(); geo.setPositions(flat);
  const mat = new LineMaterial({ color, linewidth: width, resolution: new THREE.Vector2(stageEl.clientWidth, stageEl.clientHeight), worldUnits: false });
  const line = new Line2(geo, mat);
  line.frustumCulled = false;
  return { line, mat };
}
function makeThickDashedLine(x, zFrom, zTo, color, width, dashLen = 2.2, gapLen = 1.6) {
  const group = new THREE.Group();
  const mats = [];
  let z = zFrom;
  while (z < zTo) {
    const zEnd = Math.min(z + dashLen, zTo);
    const flat = [x, 0.02, z, x, 0.02, zEnd];
    const geo = new LineGeometry(); geo.setPositions(flat);
    const mat = new LineMaterial({ color, linewidth: width, resolution: new THREE.Vector2(stageEl.clientWidth, stageEl.clientHeight), worldUnits: false });
    const seg = new Line2(geo, mat); seg.frustumCulled = false;
    group.add(seg); mats.push(mat);
    z = zEnd + gapLen;
  }
  return { group, mats };
}

const edgeLeft  = makeThickLine(-LANE_HALF, Z_FROM, Z_TO, 0x666666, 2); roadGroup.add(edgeLeft.line); allLineMats.push(edgeLeft.mat);
const edgeRight = makeThickLine(LANE_HALF * 3, Z_FROM, Z_TO, 0x666666, 2); roadGroup.add(edgeRight.line); allLineMats.push(edgeRight.mat);
const centerDivider = makeThickDashedLine(LANE_HALF, Z_FROM, Z_TO, 0x444444, 3, DASH_LEN, GAP_LEN); roadGroup.add(centerDivider.group); allLineMats.push(...centerDivider.mats);

function buildEgo() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.6, 4.2),
    new THREE.MeshPhysicalMaterial({ color: 0xf4f4f2, metalness: 0.45, roughness: 0.22, clearcoat: 1.0, clearcoatRoughness: 0.08 })
  );
  body.position.y = 0.55; body.castShadow = true; g.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.5, 2.2),
    new THREE.MeshPhysicalMaterial({ color: 0x3a4a5a, metalness: 0.2, roughness: 0.3, transparent: true, opacity: 0.78 })
  );
  cabin.position.set(0, 1.05, -0.3); cabin.castShadow = true; g.add(cabin);
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(1.82, 0.04, 4.22),
    new THREE.MeshBasicMaterial({ color: 0x0071e3, transparent: true, opacity: 0.7 })
  );
  stripe.position.y = 0.28; g.add(stripe);
  const wGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 24);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  for (const [x, y, z] of [[-0.95,0.32,-1.35],[0.95,0.32,-1.35],[-0.95,0.32,1.35],[0.95,0.32,1.35]]) {
    const w = new THREE.Mesh(wGeo, wMat); w.rotation.z = Math.PI/2; w.position.set(x,y,z); w.castShadow=true; g.add(w);
  }
  for (const x of [-0.65, 0.65]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.06), new THREE.MeshBasicMaterial({ color: 0xfff8e0 }));
    hl.position.set(x, 0.5, 2.12); g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.10, 0.06), new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.9 }));
    tl.position.set(x, 0.5, -2.12); g.add(tl);
  }
  return g;
}
const ego = buildEgo();
vehicleGroup.add(ego);

function poly4(s) { const s2 = s*s, s3 = s2*s, s4 = s3*s; return 3*s4 - 8*s3 + 6*s2; }
function poly4Prime(s) { const s2 = s*s; return 12*s2*s - 24*s2 + 12*s; }

const SEG1_LEN = 3.5, SEG2_LEN = 7.0, SEG3_LEN = 3.5;
const MOVE_DIST = SEG1_LEN + SEG2_LEN + SEG3_LEN;
const BIAS = LANE_SHIFT;
const FORWARD_SPEED = MOVE_DIST / T_LEG;

function trajX(relZ) {
  if (relZ <= SEG1_LEN) return 0;
  if (relZ <= SEG1_LEN + SEG2_LEN) return BIAS * poly4((relZ - SEG1_LEN) / SEG2_LEN);
  return BIAS;
}
function trajHeading(relZ) {
  if (relZ <= SEG1_LEN || relZ > SEG1_LEN + SEG2_LEN) return 0;
  const s = (relZ - SEG1_LEN) / SEG2_LEN;
  return Math.atan(BIAS * poly4Prime(s) / SEG2_LEN);
}
function trajXReturn(relZ) {
  if (relZ <= SEG1_LEN) return BIAS;
  if (relZ <= SEG1_LEN + SEG2_LEN) return BIAS * (1 - poly4((relZ - SEG1_LEN) / SEG2_LEN));
  return 0;
}
function trajHeadingReturn(relZ) {
  if (relZ <= SEG1_LEN || relZ > SEG1_LEN + SEG2_LEN) return 0;
  const s = (relZ - SEG1_LEN) / SEG2_LEN;
  return -Math.atan(BIAS * poly4Prime(s) / SEG2_LEN);
}


const curveAnchor = new THREE.Group();
vehicleGroup.add(curveAnchor);

function buildSegmentedTrail(color) {
  const group = new THREE.Group();
  const lines = [];
  for (let i = 0; i < 3; i++) {
    const geo = new LineGeometry(); geo.setPositions(new Array(3 * 41).fill(0));
    const mat = new LineMaterial({ color, linewidth: 3, transparent: true, opacity: 0.5, resolution: new THREE.Vector2(stageEl.clientWidth, stageEl.clientHeight) });
    const line = new Line2(geo, mat);
    group.add(line); lines.push({ line, mat });
  }
  return { group, lines };
}
function updateRemainingTrail(trail, fn, relZ) {
  const ranges = [
    [0, SEG1_LEN, 0.3],
    [SEG1_LEN, SEG1_LEN + SEG2_LEN, 0.85],
    [SEG1_LEN + SEG2_LEN, MOVE_DIST, 0.3],
  ];
  ranges.forEach(([zFrom, zTo, opacity], i) => {
    const { line, mat } = trail.lines[i];
    const from = Math.max(zFrom, relZ);
    if (from >= zTo) { line.visible = false; return; }
    line.visible = true;
    const N = 40;
    const positions = [];
    for (let j = 0; j <= N; j++) {
      const absZ = from + (zTo - from) * (j / N);
      positions.push(fn(absZ), 0.03, absZ - relZ);
    }
    line.geometry.setPositions(positions);
    line.computeLineDistances();
    mat.opacity = opacity;
  });
}
const vehTrail = buildSegmentedTrail(0x0071e3);
curveAnchor.add(vehTrail.group);
for (const { mat } of vehTrail.lines) allLineMats.push(mat);

function makeVehGizmo(color) {
  const g = new THREE.Group();
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6 }));
  dot.position.y = 0.05;
  g.add(dot);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.4, 32), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.021;
  g.add(ring);
  curveAnchor.add(g);
  return g;
}
const gizmoEnd = makeVehGizmo(0xef4444);
let legEndX = BIAS;

/* ============================== ONE shared animation loop ============================== */

const phases = ['hold-start', 'move-forward', 'hold-end', 'move-backward'];
let phaseIdx = 0;
let phaseT = 0;
const phaseLabelEl = document.getElementById('phase-label');
const phaseNames = { 'hold-start': 'Hold · A', 'move-forward': 'Trajectory → B', 'hold-end': 'Hold · B', 'move-backward': 'Trajectory → A' };

const armLiveTarget = new THREE.Vector3();
const clock = new THREE.Clock();
let travelZ = 0;
let vehLiveX = 0, vehLiveHeading = 0, inMove = false;

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  phaseT += dt;
  travelZ += FORWARD_SPEED * dt;

  const phase = phases[phaseIdx];
  phaseLabelEl.textContent = phaseNames[phase];

  let relZ = 0, fn = null;

  if (phase === 'hold-start') {
    armLiveTarget.copy(armP0);
    vehLiveX = 0; vehLiveHeading = 0; inMove = false;
    if (phaseT >= HOLD_DUR) { phaseT = 0; phaseIdx = 1; }
  } else if (phase === 'move-forward') {
    armTraj.at(phaseT, armLiveTarget);
    relZ = FORWARD_SPEED * phaseT; fn = trajX;
    vehLiveX = trajX(relZ);
    vehLiveHeading = trajHeading(relZ);
    inMove = true; legEndX = BIAS;
    if (phaseT >= T_LEG) { phaseT = 0; phaseIdx = 2; }
  } else if (phase === 'hold-end') {
    armLiveTarget.copy(armP1);
    vehLiveX = BIAS; vehLiveHeading = 0; inMove = false;
    if (phaseT >= HOLD_DUR) { phaseT = 0; phaseIdx = 3; }
  } else {
    armTraj.at(T_LEG - phaseT, armLiveTarget);
    relZ = FORWARD_SPEED * phaseT; fn = trajXReturn;
    vehLiveX = trajXReturn(relZ);
    vehLiveHeading = trajHeadingReturn(relZ);
    inMove = true; legEndX = 0;
    if (phaseT >= T_LEG) { phaseT = 0; phaseIdx = 0; }
  }

  applyArmPose(armLiveTarget);

  // road: fixed sideways — only scrolls forever forward (never reverses)
  roadGroup.position.set(0, 0, -(travelZ % ROAD_CYCLE));
  curveAnchor.visible = inMove;
  if (inMove) {
    updateRemainingTrail(vehTrail, fn, Math.min(relZ, MOVE_DIST));
    gizmoEnd.position.set(legEndX, 0, MOVE_DIST - Math.min(relZ, MOVE_DIST));
  }
  // the car itself now carries the lane-change offset, not the world
  ego.rotation.y = vehLiveHeading;

  const timeSec = performance.now() / 1000;
  ego.position.x = vehLiveX;
  ego.position.y = Math.sin(timeSec * 1.4) * 0.012;

  renderer.render(scene, camera);
}
tick();

window.addEventListener('resize', () => {
  fitCameraToWindow();
  renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
  for (const m of allLineMats) m.resolution.set(stageEl.clientWidth, stageEl.clientHeight);
  positionTitles();
});
</script>
</body>
</html>
