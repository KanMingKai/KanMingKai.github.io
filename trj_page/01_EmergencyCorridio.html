<script type="importmap">
{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 }        from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// ─── Scene ────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 55, 110);

// ─── Renderer ─────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ─── Camera ───────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 8, -14);
camera.lookAt(0, 0, 10);

// ─── Controls ─────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0, 6);
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.update();

// ─── Lights ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(8, 18, -10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.1; dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -30; dirLight.shadow.camera.right = 30;
dirLight.shadow.camera.top  = 30;  dirLight.shadow.camera.bottom = -30;
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0xaabbdd, 0.5);
rimLight.position.set(-8, 5, 4);
scene.add(rimLight);

// ─── Ground plane ─────────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

// ─── Helpers ──────────────────────────────────────────────────────────────
function straightPts(x, zFrom, zTo, n = 80) {
  const pts = [];
  for (let i = 0; i <= n; i++)
    pts.push(new THREE.Vector3(x, 0.02, zFrom + (zTo - zFrom) * (i / n)));
  return pts;
}

function makeDashedLine(points, color, dashLen = 1.2, gapLen = 0.8, opacity = 0.75) {
  const group = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  let acc = 0, drawing = true, buf = [];
  const flush = () => {
    if (buf.length >= 2)
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(buf), mat));
    buf = [];
  };
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const segLen = a.distanceTo(b);
    const dir = b.clone().sub(a).normalize();
    let t = 0;
    while (t < segLen) {
      const limit = drawing ? dashLen : gapLen;
      const step  = Math.min(limit - acc, segLen - t);
      if (drawing) buf.push(a.clone().addScaledVector(dir, t));
      t += step; acc += step;
      if (acc >= limit - 1e-6) {
        if (drawing) { buf.push(a.clone().addScaledVector(dir, t)); flush(); }
        drawing = !drawing; acc = 0;
      }
    }
  }
  if (drawing && buf.length >= 2) flush();
  return group;
}

// ─── Constants ────────────────────────────────────────────────────────────
const LANE_HALF  = 1.9;
const ROAD_LEN   = 80;
const LANE_CYCLE = 4.0;

const D         = 1.2;          // RMA lateral target (m, rightward)
const Z1        = 20;           // seg1 length: center (m)
const Z2        = 80;           // seg1+seg2 total (m)
const SEG3_LEN  = 60;           // seg3 draw length (m)
const EGO_SPEED = 60 / 3.6;    // 16.67 m/s
const AMB_SPEED = 90 / 3.6;    // 25.00 m/s
const REL_SPEED = AMB_SPEED - EGO_SPEED;

// 4th-order poly: f(s)=3s⁴-8s³+6s², satisfies 5 boundary conditions
function poly4(s) {
  const s2 = s*s, s3 = s2*s, s4 = s3*s;
  return 3*s4 - 8*s3 + 6*s2;
}

function poly4Prime(s) {
  const s2 = s*s;
  return 12*s2*s - 24*s2 + 12*s;
}

function trajWX(relZ) {
  if (relZ <= 0)  return 0;
  if (relZ <= Z1) return 0;
  if (relZ <= Z2) return D * poly4((relZ - Z1) / (Z2 - Z1));
  return D;
}

function trajReturnWX(relZ) {
  if (relZ <= 0)  return D;
  if (relZ <= Z1) return D;
  if (relZ <= Z2) return D * (1 - poly4((relZ - Z1) / (Z2 - Z1)));
  return 0;
}

function ease5(t) {
  t = Math.max(0, Math.min(1, t));
  return t*t*t * (6*t*t - 15*t + 10);
}

// ─── worldGroup: shifts laterally when ego drifts ─────────────────────────
const worldGroup = new THREE.Group();
scene.add(worldGroup);

// Lane markings (laneGroup scrolls in Z for infinite road illusion)
const laneGroup = new THREE.Group();

function makeThickLine(x, zFrom, zTo, color, width) {
  const pts = straightPts(x, zFrom, zTo);
  const flat = [];
  for (const p of pts) flat.push(p.x, p.y, p.z);
  const geo = new LineGeometry(); geo.setPositions(flat);
  const mat = new LineMaterial({
    color, linewidth: width,
    resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
    worldUnits: false
  });
  const line = new Line2(geo, mat);
  line.frustumCulled = false;
  return line;
}

function makeThickDashedLine(x, zFrom, zTo, color, width, dashLen = 2.5, gapLen = 1.5) {
  const group = new THREE.Group();
  let z = zFrom;
  while (z < zTo) {
    const zEnd = Math.min(z + dashLen, zTo);
    const flat = [x, 0.02, z, x, 0.02, zEnd];
    const geo = new LineGeometry(); geo.setPositions(flat);
    const mat = new LineMaterial({
      color, linewidth: width,
      resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
      worldUnits: false
    });
    const seg = new Line2(geo, mat);
    seg.frustumCulled = false;
    group.add(seg);
    z = zEnd + gapLen;
  }
  return group;
}

// 本車道邊界：粗深灰虛線
laneGroup.add(makeThickDashedLine(-LANE_HALF, -10, ROAD_LEN, 0x444444, 3));
laneGroup.add(makeThickDashedLine( LANE_HALF, -10, ROAD_LEN, 0x444444, 3));

// 最外側路邊線：粗深灰實線
laneGroup.add(makeThickLine(-LANE_HALF * 3, -10, ROAD_LEN, 0x666666, 2));
laneGroup.add(makeThickLine( LANE_HALF * 3, -10, ROAD_LEN, 0x666666, 2));

// 中心線：細橘色實線
const centerLine = makeThickLine(0, -10, ROAD_LEN, 0xff6600, 1.5);
laneGroup.add(centerLine);
worldGroup.add(laneGroup);

// ─── RMA Trajectory (world-fixed, in worldGroup so it shifts laterally) ──
// trajGroup.position.z = -(totalScroll - deploy_scroll) scrolls it backward
const trajGroup = new THREE.Group();
trajGroup.frustumCulled = false;
worldGroup.add(trajGroup);

const TRAJ_COLORS   = [0xff2200, 0xff8c00, 0xff2200];
const TRAJ_OPACITIES = [0.35, 0.70, 1.00];
let trajLines = [];      // refs to the 3 line objects

const retTrajGroup = new THREE.Group();
retTrajGroup.frustumCulled = false;
worldGroup.add(retTrajGroup);
let retTrajLines = [];

let ecSeg3Line, ecRetSeg3Line;

function updateSeg3(line, xVal, seg3Start, groupRelZ) {
  const localEnd = ROAD_LEN + groupRelZ;
  if (localEnd <= seg3Start) { line.visible = false; return; }
  line.visible = true;
  const flat = [];
  for (let i = 0; i <= 30; i++) flat.push(xVal, 0.05, seg3Start + i / 30 * (localEnd - seg3Start));
  line.geometry.setPositions(flat);
}

function buildRMALines() {
  for (const l of trajLines) {
    l.geometry.dispose(); l.material.dispose(); trajGroup.remove(l);
  }
  trajLines = [];

  function addLine(flat, color, opacity) {
    const geo = new LineGeometry(); geo.setPositions(flat);
    const mat = new LineMaterial({
      color, opacity, transparent: true, linewidth: 3,
      resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
      worldUnits: false
    });
    const line = new Line2(geo, mat);
    line.frustumCulled = false;
    trajGroup.add(line); trajLines.push(line);
    return line;
  }

  // Seg 1: road center, z = 0 → Z1
  const f1 = [];
  for (let i = 0; i <= 30; i++) f1.push(0, 0.05, i / 30 * Z1);
  addLine(f1, TRAJ_COLORS[0], TRAJ_OPACITIES[0]);

  // Seg 2: poly4 transition, z = Z1 → Z2
  const f2 = [];
  for (let i = 0; i <= 80; i++) { const s = i / 80; f2.push(-D * poly4(s), 0.05, Z1 + s * (Z2 - Z1)); }
  addLine(f2, TRAJ_COLORS[1], TRAJ_OPACITIES[1]);

  // Seg 3: road edge, z = Z2 → Z2+SEG3_LEN
  const f3 = [];
  for (let i = 0; i <= 30; i++) f3.push(-D, 0.05, Z2 + i / 30 * SEG3_LEN);
  ecSeg3Line = addLine(f3, TRAJ_COLORS[2], TRAJ_OPACITIES[2]);
}

function buildRMAReturnLines() {
  for (const l of retTrajLines) {
    l.geometry.dispose(); l.material.dispose(); retTrajGroup.remove(l);
  }
  retTrajLines = [];

  function addLine(flat, color, opacity) {
    const geo = new LineGeometry(); geo.setPositions(flat);
    const mat = new LineMaterial({
      color, opacity, transparent: true, linewidth: 3,
      resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
      worldUnits: false
    });
    const line = new Line2(geo, mat);
    line.frustumCulled = false;
    retTrajGroup.add(line); retTrajLines.push(line);
    return line;
  }

  // Return Seg1: stay at right shoulder (-D in worldGroup), Z = 0 → Z1
  const f1 = [];
  for (let i = 0; i <= 30; i++) f1.push(-D, 0.05, i / 30 * Z1);
  addLine(f1, TRAJ_COLORS[0], TRAJ_OPACITIES[0]);

  // Return Seg2: polynomial from -D back to 0, Z = Z1 → Z2
  const f2 = [];
  for (let i = 0; i <= 80; i++) { const s = i / 80; f2.push(-D * (1 - poly4(s)), 0.05, Z1 + s * (Z2 - Z1)); }
  addLine(f2, TRAJ_COLORS[1], TRAJ_OPACITIES[1]);

  // Return Seg3: center (X=0), Z = Z2 → Z2+SEG3_LEN
  const f3 = [];
  for (let i = 0; i <= 30; i++) f3.push(0, 0.05, Z2 + i / 30 * SEG3_LEN);
  ecRetSeg3Line = addLine(f3, TRAJ_COLORS[2], TRAJ_OPACITIES[2]);
}

buildRMALines();
trajGroup.visible = false;
buildRMAReturnLines();
retTrajGroup.visible = false;

// ─── Ego vehicle ──────────────────────────────────────────────────────────
function buildEgo() {
  const g = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.6, 4.2),
    new THREE.MeshPhysicalMaterial({
      color: 0xf4f4f2, metalness: 0.45, roughness: 0.22,
      clearcoat: 1.0, clearcoatRoughness: 0.08
    })
  );
  body.position.y = 0.55; body.castShadow = true; g.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.5, 2.2),
    new THREE.MeshPhysicalMaterial({
      color: 0x3a4a5a, metalness: 0.2, roughness: 0.3,
      transparent: true, opacity: 0.78
    })
  );
  cabin.position.set(0, 1.05, -0.3); cabin.castShadow = true; g.add(cabin);

  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(1.82, 0.04, 4.22),
    new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.7 })
  );
  stripe.position.y = 0.28; g.add(stripe);

  const wGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 24);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  for (const [x, y, z] of [[-0.95,0.32,-1.35],[0.95,0.32,-1.35],[-0.95,0.32,1.35],[0.95,0.32,1.35]]) {
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI / 2; w.position.set(x, y, z); w.castShadow = true; g.add(w);
  }

  for (const x of [-0.65, 0.65]) {
    const hl = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.12, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xfff8e0 })
    );
    hl.position.set(x, 0.5, 2.12); g.add(hl);

    const tl = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.10, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.9 })
    );
    tl.position.set(x, 0.5, -2.12); g.add(tl);
  }
  return g;
}

const ego = buildEgo();
scene.add(ego);

// ─── Ambulance ────────────────────────────────────────────────────────────
function buildAmbulance() {
  const g = new THREE.Group();

  // Main body (white box van)
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.9, 0.75, 4.8),
    new THREE.MeshPhysicalMaterial({ color: 0xf0eeea, metalness: 0.2, roughness: 0.35 })
  );
  body.position.y = 0.65; body.castShadow = true; g.add(body);

  // Upper cabin / box
  const top = new THREE.Mesh(
    new THREE.BoxGeometry(1.85, 0.65, 3.8),
    new THREE.MeshPhysicalMaterial({ color: 0xe8e6e0 })
  );
  top.position.set(0, 1.36, 0.15); g.add(top);

  // Red cross (right side)
  const crossMat = new THREE.MeshBasicMaterial({ color: 0xcc1111 });
  const cv = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.38, 0.38), crossMat);
  cv.position.set(0.97, 0.75, 0); g.add(cv);
  const ch = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.80), crossMat);
  ch.position.set(0.97, 0.75, 0); g.add(ch);

  // Siren lightbar on roof
  const barMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const bar = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.18, 0.55), barMat);
  bar.position.set(0, 1.71, 0.3); g.add(bar);

  const blueMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, transparent: true, opacity: 0.95 });
  const redMat  = new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.95 });
  const blueLight = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.14, 0.42), blueMat);
  const redLight  = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.14, 0.42), redMat);
  blueLight.position.set(-0.42, 1.73, 0.32); g.add(blueLight);
  redLight.position.set ( 0.42, 1.73, 0.32); g.add(redLight);
  g.userData.blueLight = blueLight;
  g.userData.redLight  = redLight;

  // Wheels
  const wGeo = new THREE.CylinderGeometry(0.33, 0.33, 0.24, 24);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  for (const [x, y, z] of [[-0.97,0.33,-1.55],[0.97,0.33,-1.55],[-0.97,0.33,1.55],[0.97,0.33,1.55]]) {
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI / 2; w.position.set(x, y, z); g.add(w);
  }

  // Headlights
  for (const x of [-0.68, 0.68]) {
    const hl = new THREE.Mesh(
      new THREE.BoxGeometry(0.34, 0.14, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xfffce0 })
    );
    hl.position.set(x, 0.62, 2.42); g.add(hl);
  }

  return g;
}

const ambulance = buildAmbulance();
ambulance.visible = false;
worldGroup.add(ambulance);


// ─── Phase state machine ──────────────────────────────────────────────────
let totalScroll = 0;
const PH = { NORMAL:0, DETECT:1, MOVE:2, PASS:3, RETURN:4, IDLE:5 };
let phase        = PH.NORMAL;
let phaseStartS  = 0;      // real time (s) when current phase began
let deploy_scroll = 0;     // totalScroll at which trajectory was deployed
let return_scroll = 0;     // totalScroll at which return trajectory was deployed
let ambStartS    = 0;      // real time (s) when DETECT phase started
let lastTime     = performance.now();

const PASS_HOLD  = 2.5;
const RETURN_DUR = 2.5;
const IDLE_DUR   = 1.5;
const NORMAL_DUR = 3.0;

// ─── Animation loop ───────────────────────────────────────────────────────
function animate(now) {
  requestAnimationFrame(animate);

  const dt      = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const timeSec = now / 1000;

  totalScroll += EGO_SPEED * dt;
  const relZ = totalScroll - deploy_scroll;

  // ── Phase transitions ────────────────────────────────────────────────
  if (phase === PH.NORMAL) {
    if (timeSec - phaseStartS >= NORMAL_DUR) {
      phase = PH.DETECT; phaseStartS = timeSec;
      deploy_scroll = totalScroll;
      ambStartS = timeSec;
      trajGroup.visible = true;
    }
  } else if (phase === PH.DETECT) {
    // position-based: exit when car has driven Z1 meters on center segment
    if (relZ >= Z1) { phase = PH.MOVE; phaseStartS = timeSec; }
  } else if (phase === PH.MOVE) {
    // position-based: exit when car reaches end of polynomial (at road edge)
    if (relZ >= Z2) { phase = PH.PASS; phaseStartS = timeSec; }
  } else if (phase === PH.PASS) {
    if (timeSec - phaseStartS >= PASS_HOLD) {
      phase = PH.RETURN; phaseStartS = timeSec;
      return_scroll = totalScroll;
      retTrajGroup.visible = true;
      trajGroup.visible = false;
    }
  } else if (phase === PH.RETURN) {
    const relZ_ret = totalScroll - return_scroll;
    if (relZ_ret >= Z2) {
      phase = PH.IDLE; phaseStartS = timeSec;
      retTrajGroup.visible = false;
    }
  } else { // IDLE
    if (timeSec - phaseStartS >= IDLE_DUR) { phase = PH.NORMAL; phaseStartS = timeSec; }
  }

  // ── egoX and trajectory alpha ────────────────────────────────────────
  let egoX = 0, trajAlpha = 0, retTrajAlpha = 0;

  if (phase === PH.DETECT) {
    egoX = 0;
    trajAlpha = ease5(Math.min((timeSec - phaseStartS) / 0.8, 1.0));
  } else if (phase === PH.MOVE) {
    egoX = trajWX(relZ);     // position-driven: car follows world-fixed trajectory
    trajAlpha = 1.0;
  } else if (phase === PH.PASS) {
    egoX = D;
    trajAlpha = 1.0;
  } else if (phase === PH.RETURN) {
    const relZ_ret = totalScroll - return_scroll;
    egoX = trajReturnWX(relZ_ret);   // position-driven return
    retTrajAlpha = 1.0;
  }

  // ── Trajectory: world-fixed Z scroll + per-line opacity ──────────────
  if (phase >= PH.DETECT && phase < PH.RETURN) {
    const dRelZ = totalScroll - deploy_scroll;
    trajGroup.position.z = -dRelZ;
    for (let i = 0; i < trajLines.length; i++) {
      trajLines[i].material.opacity = TRAJ_OPACITIES[i] * trajAlpha;
    }
    updateSeg3(ecSeg3Line, -D, Z2, dRelZ);
  }
  if (phase === PH.RETURN) {
    const relZ_ret = totalScroll - return_scroll;
    retTrajGroup.position.z = -relZ_ret;
    for (let i = 0; i < retTrajLines.length; i++) {
      retTrajLines[i].material.opacity = TRAJ_OPACITIES[i];
    }
    updateSeg3(ecRetSeg3Line, 0, Z2, relZ_ret);
  }

  // ── Ambulance position ───────────────────────────────────────────────
  let ambRelZ = -200, ambWX = 0;
  const flash = (Math.floor(now / 380) % 2 === 0) && phase >= PH.DETECT && phase <= PH.PASS;

  if (phase >= PH.DETECT && phase <= PH.RETURN) {
    ambRelZ = -40 + (timeSec - ambStartS) * REL_SPEED;
    // Ambulance aligned to left lane boundary
    ambWX = -LANE_HALF;
    ambulance.visible = true;
    // worldGroup coords are mirrored: negate road X for 3D placement
    ambulance.position.set(-ambWX, 0, ambRelZ);

    const bl = ambulance.userData.blueLight.material;
    const rl = ambulance.userData.redLight.material;
    bl.opacity = flash ? 0.95 : 0.08;
    rl.opacity = flash ? 0.95 : 0.08;
  } else {
    ambulance.visible = false;
  }

  // ── Road scroll (infinite loop illusion) ─────────────────────────────
  laneGroup.position.z = -(totalScroll % LANE_CYCLE);

  // ── Heading angle from trajectory derivative → road rotation ─────────
  let heading = 0;
  if (phase === PH.MOVE) {
    const s = Math.max(0, Math.min(1, (relZ - Z1) / (Z2 - Z1)));
    heading = Math.atan(D * poly4Prime(s) / (Z2 - Z1));
  } else if (phase === PH.RETURN) {
    const s = Math.max(0, Math.min(1, (totalScroll - return_scroll - Z1) / (Z2 - Z1)));
    heading = -Math.atan(D * poly4Prime(s) / (Z2 - Z1));
  }

  // ── World shifts laterally so road drifts relative to fixed ego ───────
  // Camera right = world -X, so negate to make ego appear to move right on screen
  worldGroup.position.x = egoX;
  worldGroup.rotation.y = heading;

  // ── Ego idle bob ─────────────────────────────────────────────────────
  ego.position.y = Math.sin(timeSec * 1.4) * 0.012;

  // ── Update UI ─────────────────────────────────────────────────────────
  // 橘色中心線：移動過程隱藏
  centerLine.visible = !(phase === PH.DETECT || phase === PH.MOVE || phase === PH.PASS || phase === PH.RETURN);

  controls.update();
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// ─── Resize ───────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  const res = new THREE.Vector2(window.innerWidth, window.innerHeight);
  for (const l of [...trajLines, ...retTrajLines]) l.material.resolution.copy(res);
  laneGroup.traverse(obj => {
    if (obj.isLine2) obj.material.resolution.copy(res);
  });
});
</script>
</body>
</html>
