<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interface 三段式建立 — 動畫分鏡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
/* ============================================================
   Interface 三段式建立 — 連續動畫
   ------------------------------------------------------------
   ★ 沿用 01_ChangeDashboardFlow.html 的三條規則：
     (1) class 一律 .pif- 前綴，將來併進 01_trj_page.html 不撞名；
     (2) 顏色一律 var(--token,#fallback)，併進去自動吃主頁 token，
         單獨開啟也不會壞；
     (3) 綠色只給 Interface 一個角色用，藍色給功能與 pipeline，
         看到綠色就等於「唯一對外的那道介面」。

   ★ 版面相對原本三張截圖的改動：
     Interface 的座標三個鏡頭都一樣，不再從上方掉下來。
     鏡頭之間只做「加東西」，視線不用重新找位置，
     三段連起來才會讀成同一句話而不是三張圖。

   ★ 播放：單一 rAF 迴圈驅動分鏡，沒有任何控制項與字幕，
     圖自己循環。捲出畫面就停止累加 t，回到畫面接著跑。
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans,-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif);
  background:var(--bg,#fff);color:var(--ink,#1d1d1f);line-height:1.5;-webkit-font-smoothing:antialiased;
}

.pif{max-width:1080px;margin:0 auto;padding:28px 22px 34px}

/* ---------- 標題列 ---------- */
.pif-head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.pif-h1{font-size:clamp(21px,2.8vw,29px);font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.pif-sub{
  font-size:clamp(12.5px,1.5vw,14.5px);color:var(--ink-2,#6e6e73);font-weight:600;
  padding-left:18px;border-left:1.5px solid var(--line,#d2d2d7);
}
.pif-lead{font-size:13px;color:var(--ink-2,#6e6e73);max-width:640px;margin:12px 0 20px;line-height:1.8}
.pif-lead b{color:var(--ink,#1d1d1f);font-weight:700}

/* ---------- 圖例（沿用 cdf 那頁的寫法，兩張圖擺一起才像同一套） ---------- */
.pif-legend{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 16px;font-size:12px;color:var(--ink-2,#6e6e73)}
.pif-lg{display:flex;align-items:center;gap:7px;font-weight:600}
.pif-lg i{width:22px;height:0;border-top:1.8px dashed;display:inline-block}
.pif-lg--feat i{border-top-color:#93c5fd}
.pif-lg--out  i{border-top-color:#16a34a}
.pif-lg--sys  i{border-top-color:#c7ccd1}

/* ---------- 舞台 ---------- */
.pif-stage{
  position:relative;border:1px solid var(--line,#d2d2d7);border-radius:18px;
  background:var(--bg,#fff);box-shadow:var(--shadow,0 4px 20px rgba(0,0,0,.06));
  overflow:hidden;
}
.pif-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pif-scroll::-webkit-scrollbar{height:5px}
.pif-scroll::-webkit-scrollbar-thumb{background:var(--line,#d2d2d7);border-radius:3px}
.pif-svg{display:block;width:100%;min-width:720px;height:auto}
.pif-svg text{font-family:var(--sans,"Noto Sans TC",sans-serif)}

/* ---------- 線條規格：全圖只有這一套 ---------- */
/* 幾何完全一致（同一顆 marker 形狀、同一個 stroke-width、同一組 dash），
   只有顏色帶語意：
     .pif-ln--sys  灰  pipeline 既有的資料流
     .pif-ln--feat 藍  功能接進介面
     .pif-ln--out  綠  介面送進 Trajectory Planning 的指令
   要調粗細只改這一條規則，四種箭頭一起跟著變。 */
.pif-ln{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:5 4}
.pif-ln--sys {stroke:#c7ccd1;marker-end:url(#pifArrSys)}
.pif-ln--feat{stroke:#93c5fd;marker-end:url(#pifArrFeat)}
.pif-ln--out {stroke:#16a34a;marker-end:url(#pifArrOut)}
/* 所有線用同一支流動動畫、同一個速度，看起來才像同一個系統 */
.pif-ln{animation:pifFlow 1.1s linear infinite}
@keyframes pifFlow{to{stroke-dashoffset:-9}}

/* ---------- 分鏡進出場 ---------- */
/* 只用 opacity + 位移，不動 layout；SVG 群組的 transform 走 CSS 才能有過場 */
.pif-layer{
  opacity:0;transform:translateY(-9px);
  transition:opacity .52s cubic-bezier(.22,.9,.3,1),transform .52s cubic-bezier(.22,.9,.3,1);
  pointer-events:none;
}
.pif-layer.pif-on{opacity:1;transform:translateY(0);pointer-events:auto}
/* 連線進場只往前推一點點，不跟著整層掉下來，線頭才不會離開盒子邊緣 */
.pif-conn{transform:none}
.pif-conn:not(.pif-on){opacity:0}

/* Interface 在第一鏡的強調呼吸 */
.pif-iface{transition:filter .5s ease}
.pif-stage[data-scene="0"] .pif-iface{filter:drop-shadow(0 4px 14px rgba(22,163,74,.42))}

/* ---------- 盒子規格：同樣只有這一套 ---------- */
/* rx 一律 12、外框一律 1.2；只有「主角」用 2 加重，沒有第三種粗細 */
.pif-box{fill:#fff;stroke:#d2d2d7;stroke-width:1.2}
.pif-box--feat{fill:#eef4ff;stroke:#93c5fd;stroke-width:1.2}
.pif-box--hero{stroke-width:2}

.pif-note{margin-top:18px;text-align:center;font-size:11.5px;color:var(--ink-3,#86868b);line-height:1.75}
.pif-hint{display:none;text-align:center;font-size:11px;color:var(--ink-3,#86868b);margin-top:8px;font-family:var(--mono,monospace)}

@media(max-width:680px){
  .pif{padding:20px 14px 26px}
  .pif-sub{padding-left:0;border-left:0;border-top:1px solid var(--line,#d2d2d7);padding-top:8px;width:100%}
  .pif-hint{display:block}
}
/* 使用者關掉動效：不自動播，直接給資訊最完整的第三鏡 */
@media(prefers-reduced-motion:reduce){
  .pif-layer{transition:none}
  .pif-ln{animation:none}
}
</style>
</head>
<body>

<div class="pif">

  <!-- ============ 標題 ============ -->
  <div class="pif-head">
    <div class="pif-h1">一道介面，接住所有功能</div>
    <div class="pif-sub">三個鏡頭，每鏡 2 秒，循環播放</div>
  </div>
  <p class="pif-lead">
    trj 對外只開<b>一個介面</b>：偏移量 / 起點 / 終點。功能從一個長到四個、從自己的長到同事的，
    <b>底層 code 一行沒改</b>——變的只有介面上面那一層。
  </p>

  <!-- 線只有一種畫法，顏色才是語意。圖例只需要解釋顏色。 -->
  <div class="pif-legend">
    <span class="pif-lg pif-lg--feat"><i></i>功能接進介面</span>
    <span class="pif-lg pif-lg--out"><i></i>介面送出的指令</span>
    <span class="pif-lg pif-lg--sys"><i></i>pipeline 既有資料流</span>
  </div>

  <!-- ============ 舞台 ============ -->
  <div class="pif-stage" id="pifStage" data-scene="0">
    <div class="pif-scroll">
    <!-- 人像下移後上方多出一片空白，viewBox 從 y=40 起算把它收掉 -->
    <svg class="pif-svg" viewBox="0 40 800 364" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="三段動畫：先定義 Interface，接著把上下匝道與前車軌跡兩個自有功能接上，最後同事的緊急走廊與變換車道也接進同一道介面">
      <defs>
        <linearGradient id="pifPipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0a84ff"/>
          <stop offset="42%" stop-color="#0071e3"/>
          <stop offset="100%" stop-color="#28c6e8"/>
        </linearGradient>
        <!-- 綠色漸層的角度與停點數量刻意跟 pifPipeGrad 一模一樣，
             這樣 Interface 與 TRAJECTORY PLANNING 兩個框放在一起，
             差別只有色相，不會有一個看起來比較「新」 -->
        <linearGradient id="pifIfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#22c55e"/>
          <stop offset="42%" stop-color="#16a34a"/>
          <stop offset="100%" stop-color="#4ade80"/>
        </linearGradient>
        <!-- 三顆箭頭：座標一字不差，只有 fill 不同。要改箭頭大小三顆一起改。 -->
        <marker id="pifArrSys"  markerWidth="6" markerHeight="6" refX="4.6" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0.4 L5,3 L0,5.6 Z" fill="#c7ccd1"/>
        </marker>
        <marker id="pifArrFeat" markerWidth="6" markerHeight="6" refX="4.6" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0.4 L5,3 L0,5.6 Z" fill="#93c5fd"/>
        </marker>
        <marker id="pifArrOut"  markerWidth="6" markerHeight="6" refX="4.6" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0.4 L5,3 L0,5.6 Z" fill="#16a34a"/>
        </marker>
        <symbol id="pifPerson" viewBox="0 0 24 24">
          <circle cx="12" cy="6.6" r="4.3"/>
          <path d="M3.6,21 C3.6,15.4 7.4,12.6 12,12.6 C16.6,12.6 20.4,15.4 20.4,21 Z"/>
        </symbol>
        <pattern id="pifDots" width="18" height="18" patternUnits="userSpaceOnUse">
          <circle cx="1.4" cy="1.4" r="1.05" fill="#f0f2f5"/>
        </pattern>
      </defs>

      <rect x="0" y="40" width="800" height="364" fill="url(#pifDots)"/>

      <!-- ══════════ 底層：永遠都在的 pipeline ══════════ -->
      <g>
        <rect class="pif-box" x="32" y="300" width="132" height="70" rx="12"/>
        <text x="98" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1f" letter-spacing="0.5">SENSING</text>
        <text x="98" y="346" text-anchor="middle" font-size="9.5" fill="#86868b">Camera・Radar</text>
        <text x="98" y="357" text-anchor="middle" font-size="9.5" fill="#86868b">LiDAR</text>

        <path class="pif-ln pif-ln--sys" d="M164,335 H177"/>

        <rect class="pif-box" x="179" y="300" width="132" height="70" rx="12"/>
        <text x="245" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1f" letter-spacing="0.5">FUSION</text>
        <text x="245" y="346" text-anchor="middle" font-size="9.5" fill="#86868b">Object /</text>
        <text x="245" y="357" text-anchor="middle" font-size="9.5" fill="#86868b">Environment</text>

        <path class="pif-ln pif-ln--sys" d="M311,335 H324"/>

        <!-- 主角：Trajectory Planning。rx 跟其他盒子一樣 12，只靠框線加粗與底色分階級 -->
        <rect x="326" y="296" width="147" height="78" rx="12" fill="url(#pifPipeGrad)" opacity="0.1"/>
        <rect class="pif-box--hero" x="326" y="296" width="147" height="78" rx="12" fill="none" stroke="url(#pifPipeGrad)"/>
        <text x="399.5" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0071e3" letter-spacing="0.3">TRAJECTORY</text>
        <text x="399.5" y="341" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0071e3" letter-spacing="0.3">PLANNING</text>
        <text x="399.5" y="357" text-anchor="middle" font-size="9.5" fill="#0071e3" font-weight="600">by trj module</text>

        <path class="pif-ln pif-ln--sys" d="M473,335 H486"/>

        <rect class="pif-box" x="488" y="300" width="132" height="70" rx="12"/>
        <text x="554" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1f" letter-spacing="0.5">CONTROL</text>
        <text x="554" y="346" text-anchor="middle" font-size="9.5" fill="#86868b">Tracking &amp;</text>
        <text x="554" y="357" text-anchor="middle" font-size="9.5" fill="#86868b">Stability</text>

        <path class="pif-ln pif-ln--sys" d="M620,335 H633"/>

        <rect class="pif-box" x="635" y="300" width="132" height="70" rx="12"/>
        <text x="701" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1f" letter-spacing="0.5">ACTUATION</text>
        <text x="701" y="346" text-anchor="middle" font-size="9.5" fill="#86868b">Steering・Throttle</text>
        <text x="701" y="357" text-anchor="middle" font-size="9.5" fill="#86868b">Brake・Gear</text>
      </g>

      <!-- ══════════ 永遠都在：Interface → Trajectory Planning ══════════ -->
      <g>
        <path class="pif-ln pif-ln--out" d="M399.5,248 V288"/>
        <text x="412" y="273" font-size="11.5" font-weight="700" fill="#16a34a">偏移量 / 起點 / 終點</text>
      </g>

      <!-- Interface 本體（第一鏡就在最終位置，後面兩鏡不再移動）
           畫法與下方 TRAJECTORY PLANNING 完全同一套：
           淡底(opacity .1) + 漸層外框(.pif-box--hero) + 同色字，只有色相不同 -->
      <g class="pif-iface">
        <rect x="310" y="194" width="180" height="52" rx="12" fill="url(#pifIfaceGrad)" opacity="0.1"/>
        <rect class="pif-box--hero" x="310" y="194" width="180" height="52" rx="12" fill="none" stroke="url(#pifIfaceGrad)"/>
        <text x="400" y="217" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a" letter-spacing="0.3">INTERFACE</text>
        <text x="400" y="233" text-anchor="middle" font-size="9.5" fill="#16a34a" font-weight="600">trj 對外唯一入口</text>
      </g>

      <!-- ══════════ SCENE 2：自己的兩個功能 ══════════ -->
      <!-- 連線先畫，盒子後畫，線頭才不會壓在卡片上 -->
      <g class="pif-layer pif-conn" id="pifConnA">
        <path class="pif-ln pif-ln--feat" d="M124,142 C124,178 250,180 348,191"/>
        <path class="pif-ln pif-ln--feat" d="M308,142 C308,170 342,178 372,190"/>
      </g>
      <g class="pif-layer" id="pifRowA">
        <rect class="pif-box--feat" x="40" y="96" width="168" height="46" rx="12"/>
        <text x="124" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0071e3">On/Off-Ramp</text>

        <rect class="pif-box--feat" x="224" y="96" width="168" height="46" rx="12"/>
        <text x="308" y="115" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0071e3">Front Vehicle</text>
        <text x="308" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0071e3">Trajectory</text>

        <!-- 兩個功能各自掛一個 Me，人像都對齊自己那顆盒子的水平中心，
             不用視線去猜一個人像管到哪幾格 -->
        <use href="#pifPerson" x="101" y="64" width="21" height="21" fill="#1f3b57"/>
        <text x="127" y="81" font-size="12.5" font-weight="700" fill="#1d1d1f">Me</text>

        <use href="#pifPerson" x="285" y="64" width="21" height="21" fill="#1f3b57"/>
        <text x="311" y="81" font-size="12.5" font-weight="700" fill="#1d1d1f">Me</text>
      </g>

      <!-- ══════════ SCENE 3：同事的兩個功能 ══════════ -->
      <!-- 只補「新增的那兩條」，前兩條原封不動留在 pifConnA，鏡頭切換時線不會重畫也不會位移 -->
      <g class="pif-layer pif-conn" id="pifConnB">
        <path class="pif-ln pif-ln--feat" d="M492,142 C492,170 458,178 428,190"/>
        <path class="pif-ln pif-ln--feat" d="M676,142 C676,178 550,180 452,191"/>
      </g>
      <g class="pif-layer" id="pifRowB">
        <rect class="pif-box--feat" x="408" y="96" width="168" height="46" rx="12"/>
        <text x="492" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0071e3">Emergency Corridor</text>

        <rect class="pif-box--feat" x="592" y="96" width="168" height="46" rx="12"/>
        <text x="676" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0071e3">Lane Change</text>

        <!-- 同樣對齊各自盒子的中心（492 / 676），跟上面兩個 Me 同一個規則 -->
        <use href="#pifPerson" x="455" y="64" width="21" height="21" fill="#1f3b57"/>
        <text x="481" y="75" font-size="12" font-weight="700" fill="#1d1d1f">Function</text>
        <text x="481" y="88" font-size="12" font-weight="700" fill="#1d1d1f">Owner 1</text>

        <use href="#pifPerson" x="639" y="64" width="21" height="21" fill="#1f3b57"/>
        <text x="665" y="75" font-size="12" font-weight="700" fill="#1d1d1f">Function</text>
        <text x="665" y="88" font-size="12" font-weight="700" fill="#1d1d1f">Owner 2</text>
      </g>
    </svg>
    </div>
    <div class="pif-hint">← 左右滑動查看完整圖 →</div>
  </div>

  <p class="pif-note">
    三個鏡頭裡，綠色那一塊從頭到尾沒有動過——會長大的永遠是它上面那排功能。
  </p>
</div>

<script>
(function(){
  var DUR   = 2000;              // 每鏡停留 2 秒
  var N     = 3;
  var stage = document.getElementById('pifStage');

  // 每一鏡要點亮哪些圖層：後面的鏡頭包含前面的（只加不減）
  var LAYERS = [
    [],
    ['pifRowA','pifConnA'],
    ['pifRowA','pifConnA','pifRowB','pifConnB']
  ];
  var ALL = ['pifRowA','pifConnA','pifRowB','pifConnB'];

  var scene = 0, t = 0, visible = true, last = null;

  function render(){
    stage.setAttribute('data-scene', scene);
    var on = LAYERS[scene];
    ALL.forEach(function(id){
      document.getElementById(id).classList.toggle('pif-on', on.indexOf(id) !== -1);
    });
  }

  function frame(ts){
    if(last === null) last = ts;
    var dt = ts - last; last = ts;
    if(visible){
      // 分頁切回來時 dt 可能是好幾秒，夾住避免一次跳過整鏡
      t += Math.min(dt, 100);
      if(t >= DUR){ t -= DUR; scene = (scene + 1) % N; render(); }
    }
    requestAnimationFrame(frame);
  }

  // 捲出畫面就停：省掉看不到的地方在跑 rAF 重繪
  if(window.IntersectionObserver){
    new IntersectionObserver(function(es){ visible = es[0].isIntersecting; }, {threshold:.15})
      .observe(stage);
  }
  document.addEventListener('visibilitychange', function(){ last = null; });

  render();

  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    // 關掉動效的人直接停在資訊最完整的最後一鏡，不自動跑
    scene = N - 1; render();
  }else{
    requestAnimationFrame(frame);
  }
})();
</script>

</body>
</html>
