<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRJ 三大成效</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"SF Pro TC","SF Pro Display",-apple-system,BlinkMacSystemFont,
              "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#fff;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 24px;-webkit-font-smoothing:antialiased;
}
.g{
  background:linear-gradient(118deg,#0a84ff 0%,#0071e3 42%,#28c6e8 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}
.cols{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  max-width:820px;width:100%;
}
.card{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:28px 16px 24px;background:#f5f5f7;border-radius:24px;gap:18px;
}
.anim{height:110px;display:flex;align-items:center;justify-content:center;position:relative}
.metric{font-size:clamp(34px,4.8vw,54px);font-weight:700;letter-spacing:-.04em;line-height:1}
.from-to{font-size:12.5px;color:#6e6e73;font-weight:500;margin-top:7px;letter-spacing:-.005em}
.label{font-size:11px;color:#86868b;margin-top:3px}
@media(max-width:540px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="cols">

  <!-- ── Card 1: 晶片爆表 → 37% ── -->
  <div class="card">
    <div class="label">TC277 運算資源佔用</div>
    <div class="anim">
      <canvas id="chip-bad" width="160" height="160"
        style="width:100px;height:100px;border-radius:14px;display:block"></canvas>
    </div>
    <div class="metric">
      <span style="color:#ef4444;opacity:.6;font-size:.72em">100%</span>
      <span style="color:#9ca3af;font-size:.45em;font-weight:500;margin:0 5px;vertical-align:middle">→</span>
      <span class="g">37%</span>
    </div>
  </div>

  <!-- ── Card 2: 沙漏超慢 → −98% ── -->
  <div class="card">
    <div class="label">新功能開發週期</div>
    <div class="anim">
      <div style="position:relative;width:88px;height:110px;
                  display:flex;align-items:center;justify-content:center">
        <canvas id="hg-slow" width="88" height="110"
          style="position:absolute;top:0;left:0"></canvas>
        <div style="position:relative;z-index:2;pointer-events:none;
                    line-height:1;text-align:center;margin-top:6px">
          <div id="hg-days" style="font-size:20px;font-weight:700;
               letter-spacing:-.04em;color:#9ca3af">0</div>
          <div style="font-size:9px;font-weight:600;color:#9ca3af;margin-top:1px">天</div>
        </div>
      </div>
    </div>
    <div class="metric">
      <span style="color:#9ca3af;font-size:.72em">4個月</span>
      <span style="color:#9ca3af;font-size:.45em;font-weight:500;margin:0 5px;vertical-align:middle">→</span>
      <span class="g">2天</span>
    </div>
  </div>

  <!-- ── Card 3: 箭頭互射 → 1 套 ── -->
  <div class="card">
    <div class="label">統一軌跡規格</div>
    <div class="anim">
      <canvas id="chaos" width="200" height="110"
        style="width:200px;height:110px;display:block"></canvas>
    </div>
    <div class="metric">
      <span style="color:#9ca3af;font-size:.72em">N套</span>
      <span style="color:#9ca3af;font-size:.45em;font-weight:500;margin:0 5px;vertical-align:middle">→</span>
      <span class="g">1 套邏輯</span>
    </div>
  </div>

</div><!-- /cols -->

<script>
/* ── roundRect polyfill ── */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r);this.closePath();return this;
  };
}

/* ════════════════════════════════════
   Card 1 — 紅色晶片爆表（110%）
════════════════════════════════════ */
(function(){
  const c=document.getElementById('chip-bad').getContext('2d');
  let t=0,w=0;
  const bubbles=Array.from({length:14},()=>({
    x:28+Math.random()*100,y:136-Math.random()*60,
    r:1.5+Math.random()*2.8,speed:.4+Math.random()*.6,wobble:Math.random()*Math.PI*2
  }));

  function shell(flash){
    c.fillStyle='#ffffff';c.beginPath();c.roundRect(0,0,160,160,16);c.fill();
    c.strokeStyle='#e2c4c4';c.lineWidth=2.5;c.lineCap='round';
    [30,46,62,80,98,114,130].forEach(p=>{
      c.beginPath();c.moveTo(p,6);c.lineTo(p,22);c.stroke();
      c.beginPath();c.moveTo(p,138);c.lineTo(p,154);c.stroke();
      c.beginPath();c.moveTo(6,p);c.lineTo(22,p);c.stroke();
      c.beginPath();c.moveTo(138,p);c.lineTo(154,p);c.stroke();
    });
    c.fillStyle='#fff5f5';
    c.strokeStyle=flash?`rgba(239,68,68,${flash})`:'#fecaca';
    c.lineWidth=flash?3:1.5;
    c.beginPath();c.roundRect(22,22,116,116,8);c.fill();c.stroke();
  }
  function water(pct,wc,wlc,wo){
    const bot=136,h=112,topY=bot-Math.min(pct,1)*h,amp=pct>.98?1.5:4;
    c.save();c.beginPath();c.roundRect(23,23,114,114,7);c.clip();
    c.beginPath();c.moveTo(22,topY);
    for(let x=22;x<=138;x+=2)
      c.lineTo(x,topY+Math.sin(x*.08+wo)*amp+Math.sin(x*.05-wo*1.3)*(amp*.6));
    c.lineTo(138,bot);c.lineTo(22,bot);c.closePath();c.fillStyle=wc;c.fill();
    c.beginPath();c.moveTo(22,topY);
    for(let x=22;x<=138;x+=2)
      c.lineTo(x,topY+Math.sin(x*.07+wo*1.4+1.2)*(amp*.7)+Math.sin(x*.12-wo*.9)*(amp*.4));
    c.lineTo(138,topY+12);c.lineTo(22,topY+12);c.closePath();c.fillStyle=wlc;c.fill();
    c.restore();
  }
  function frame(){
    w+=.05;t++;
    const flash=(Math.sin(t*.38)*.5+.5)*.9;
    c.clearRect(0,0,160,160);
    shell(flash);
    water(1.06,'rgba(239,68,68,0.88)','rgba(252,165,165,0.5)',w);
    // bubbles
    c.save();c.beginPath();c.roundRect(23,23,114,114,7);c.clip();
    bubbles.forEach(b=>{
      b.y-=b.speed;b.wobble+=.04;b.x+=Math.sin(b.wobble)*.4;
      if(b.y<24){b.y=136;b.x=28+Math.random()*100;}
      c.beginPath();c.arc(b.x,b.y,b.r,0,Math.PI*2);
      c.strokeStyle='rgba(255,255,255,0.6)';c.lineWidth=.8;c.stroke();
      c.fillStyle='rgba(255,255,255,0.14)';c.fill();
    });
    c.restore();
    // splash at top
    const sp=(t%26)/26;
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2,r=8+sp*24,fade=1-sp;
      const px=80+Math.cos(a)*r,py=24+Math.sin(a)*r*.38;
      c.beginPath();c.arc(px,py,2.5*fade+.3,0,Math.PI*2);
      c.fillStyle=`rgba(239,68,68,${fade*.9})`;c.fill();
    }
    // center label
    c.font='bold 26px monospace';c.fillStyle='#dc2626';
    c.textAlign='center';c.textBaseline='middle';c.fillText('110%',80,72);
    c.font='500 10px monospace';c.fillStyle='rgba(0,0,0,0.35)';
    c.fillText('CPU LOAD',80,92);
    c.textAlign='left';c.textBaseline='alphabetic';
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ════════════════════════════════════
   Card 2 — 極慢沙漏（灰色，感受4個月）
════════════════════════════════════ */
(function(){
  const cv=document.getElementById('hg-slow');
  const ctx=cv.getContext('2d');
  const W=88,H=110;
  const daysEl=document.getElementById('hg-days');
  // one full drain = 8 seconds (feels painfully slow)
  const CYCLE_MS=8000;
  let start=null;

  function draw(p){
    ctx.clearRect(0,0,W,H);
    const cx=W/2,top=6,bot=H-6,hw=W*.33,nw=W*.075,neckY=H/2;
    const sand='#b0b0b0',sandH='#c8c8c8',glass='#efefef',line='#d4d4d4';

    function shape(){
      ctx.beginPath();
      ctx.moveTo(cx-hw,top);
      ctx.bezierCurveTo(cx-hw,top+H*.20,cx-nw,neckY-H*.14,cx-nw,neckY);
      ctx.bezierCurveTo(cx-nw,neckY+H*.14,cx-hw,bot-H*.20,cx-hw,bot);
      ctx.lineTo(cx+hw,bot);
      ctx.bezierCurveTo(cx+hw,bot-H*.20,cx+nw,neckY+H*.14,cx+nw,neckY);
      ctx.bezierCurveTo(cx+nw,neckY-H*.14,cx+hw,top+H*.20,cx+hw,top);
      ctx.closePath();
    }
    shape();ctx.fillStyle=glass;ctx.fill();

    const topH=neckY-top-1;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx-hw,top);
    ctx.bezierCurveTo(cx-hw,top+H*.20,cx-nw,neckY-H*.14,cx-nw,neckY);
    ctx.lineTo(cx+nw,neckY);
    ctx.bezierCurveTo(cx+nw,neckY-H*.14,cx+hw,top+H*.20,cx+hw,top);
    ctx.closePath();ctx.clip();
    const g1=ctx.createLinearGradient(cx-hw,0,cx+hw,0);
    g1.addColorStop(0,sand);g1.addColorStop(.5,sandH);g1.addColorStop(1,sand);
    ctx.fillStyle=g1;
    ctx.fillRect(0,neckY-topH*(1-p),W,topH*(1-p)+4);
    ctx.restore();

    const botH=bot-neckY-1;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx-nw,neckY);
    ctx.bezierCurveTo(cx-nw,neckY+H*.14,cx-hw,bot-H*.20,cx-hw,bot);
    ctx.lineTo(cx+hw,bot);
    ctx.bezierCurveTo(cx+hw,bot-H*.20,cx+nw,neckY+H*.14,cx+nw,neckY);
    ctx.closePath();ctx.clip();
    const g2=ctx.createLinearGradient(cx-hw,0,cx+hw,0);
    g2.addColorStop(0,sand);g2.addColorStop(.5,sandH);g2.addColorStop(1,sand);
    ctx.fillStyle=g2;
    ctx.fillRect(0,bot-botH*p,W,botH*p+3);
    ctx.restore();

    // trickle (very thin, slow)
    if(p<0.97){
      ctx.save();shape();ctx.clip();
      ctx.strokeStyle='rgba(160,160,160,0.7)';ctx.lineWidth=1.2;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx,neckY);ctx.lineTo(cx,neckY+7);ctx.stroke();
      ctx.restore();
    }
    shape();
    const wg=ctx.createLinearGradient(cx-hw,0,cx+hw,0);
    wg.addColorStop(0,'rgba(255,255,255,.55)');wg.addColorStop(.15,'rgba(255,255,255,0)');
    wg.addColorStop(.85,'rgba(255,255,255,0)');wg.addColorStop(1,'rgba(255,255,255,.4)');
    ctx.fillStyle=wg;ctx.fill();
    shape();ctx.strokeStyle=line;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#d0d0d0';
    ctx.fillRect(cx-hw,top-1,hw*2,3);ctx.fillRect(cx-hw,bot-1.5,hw*2,3);
  }

  function loop(now){
    if(!start)start=now;
    // linear 0→1 over CYCLE_MS, then reset
    const raw=((now-start)%CYCLE_MS)/CYCLE_MS;
    // map to fake "120 days" (4 months)
    const days=Math.floor(raw*120);
    draw(raw);
    daysEl.textContent=days;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* ════════════════════════════════════
   Card 3 — 混亂箭頭互射
════════════════════════════════════ */
(function(){
  const cv=document.getElementById('chaos');
  const ctx=cv.getContext('2d');
  const W=200,H=110;

  // 4 nodes, each shooting at all others in turn
  const nodes=[
    {x:34, y:30},{x:100,y:14},{x:166,y:30},{x:68,y:80},{x:132,y:80}
  ];

  // pre-build all arrow pairs (each node → every other)
  const pairs=[];
  for(let i=0;i<nodes.length;i++)
    for(let j=0;j<nodes.length;j++)
      if(i!==j) pairs.push({f:i,t:j,offset:(i*nodes.length+j)*.17});

  function person(x,y,col,sz=10){
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.lineCap='round';
    ctx.fillStyle='none';
    ctx.beginPath();ctx.arc(x,y,sz*.38,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y+sz*.38);ctx.lineTo(x,y+sz);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y+sz);ctx.lineTo(x-sz*.35,y+sz*1.55);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y+sz);ctx.lineTo(x+sz*.35,y+sz*1.55);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-sz*.48,y+sz*.65);ctx.lineTo(x+sz*.48,y+sz*.65);ctx.stroke();
    ctx.restore();
  }

  function arrow(sx,sy,ex,ey,progress,alpha){
    if(progress<=0||alpha<=0)return;
    const p=Math.min(1,progress);
    const dx=ex-sx,dy=ey-sy;
    const lx=sx+dx*p,ly=sy+dy*p;
    ctx.save();
    ctx.strokeStyle=`rgba(239,68,68,${alpha})`;
    ctx.lineWidth=1.3;ctx.lineCap='round';
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(lx,ly);ctx.stroke();
    ctx.setLineDash([]);
    if(p>0.12){
      const angle=Math.atan2(dy,dx);
      ctx.translate(lx,ly);ctx.rotate(angle);
      ctx.fillStyle=`rgba(239,68,68,${alpha})`;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-7,3);ctx.lineTo(-7,-3);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }

  let t=0;
  function frame(){
    t++;
    ctx.clearRect(0,0,W,H);

    // draw arrows
    pairs.forEach(p=>{
      const s=nodes[p.f],e=nodes[p.t];
      // each pair pulses independently
      const ph=((t*.012+p.offset)%1);
      const progress=ph<.55?ph/.55:0; // shoot, then disappear
      const alpha=ph<.55?Math.min(1,progress*3)*(1-Math.max(0,progress-.7)/.3):0;
      if(alpha>0.02){
        // midpoint offset for arc-like path using line (simple)
        arrow(s.x,s.y,e.x,e.y,progress,alpha*.75);
      }
    });

    // draw people
    nodes.forEach(n=>person(n.x,n.y,'#9ca3af',9));

    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
