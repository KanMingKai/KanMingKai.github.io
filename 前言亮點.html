<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 — N2 強化版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"SF Pro TC","SF Pro Display",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  background:#f5f5f7;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:48px 24px;-webkit-font-smoothing:antialiased;
}
.g{background:linear-gradient(118deg,#0a84ff 0%,#0071e3 42%,#28c6e8 100%);
   -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:880px;width:100%}

.card{border-radius:22px;overflow:hidden;box-shadow:0 1px 16px rgba(0,0,0,.06)}

/* 類別標題：置頂 */
.cat-top{
  font-size:14px;font-weight:600;color:#374151;
  text-align:center;padding:18px 18px 10px;letter-spacing:.01em;
  background:linear-gradient(145deg,#fff5f5 0%,#fee2e2 100%);
}

/* 問題區 */
.prob{
  padding:14px 22px 20px;
  background:linear-gradient(145deg,#fff5f5 0%,#fee2e2 100%);
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.prob-label{
  font-size:9px;font-weight:700;letter-spacing:.14em;color:#dc2626;
  text-transform:uppercase;display:flex;align-items:center;gap:5px;
}
.prob-label::before{content:'';display:block;width:16px;height:1px;background:#dc2626;opacity:.5}
.prob-label::after{content:'';display:block;width:16px;height:1px;background:#dc2626;opacity:.5}

/* 動畫圖示 */
.icon-lg{
  width:80px;height:80px;background:#fff;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
  box-shadow:0 2px 12px rgba(239,68,68,.2);
}
.num-before{font-size:20px;font-weight:700;color:#dc2626;letter-spacing:-.02em;opacity:.7}
.num-after-sub{font-size:13px;font-weight:500;color:#6b7280;letter-spacing:.04em;margin-top:-4px}

/* 解方區 */
.sol{
  background:#fff;
  padding:22px 22px 32px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.sol-label{
  font-size:9px;font-weight:700;letter-spacing:.14em;color:#0071e3;
  text-transform:uppercase;display:flex;align-items:center;gap:5px;
}
.sol-label::before{content:'';display:block;width:16px;height:1px;background:#0071e3;opacity:.4}
.sol-label::after{content:'';display:block;width:16px;height:1px;background:#0071e3;opacity:.4}

.num-after{font-size:clamp(52px,7.5vw,80px);font-weight:900;letter-spacing:-.07em;line-height:1;margin:4px 0}

@media(max-width:540px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="cols">

  <!-- Card 1: CPU Load -->
  <div class="card">
    <div class="cat-top">TC277 運算資源佔用</div>
    <div class="prob">
      <div class="prob-label">BEFORE</div>
      <div class="icon-lg">
        <canvas id="chip-bad" width="160" height="160" style="width:70px;height:70px;border-radius:14px;display:block"></canvas>
      </div>
      <div class="num-before">100%</div>
    </div>
    <div class="sol">
      <div class="sol-label">AFTER</div>
      <div class="num-after g">37%</div>
    </div>
  </div>

  <!-- Card 2: Dev Cycle -->
  <div class="card">
    <div class="cat-top">新功能開發週期</div>
    <div class="prob">
      <div class="prob-label">BEFORE</div>
      <div class="icon-lg" style="position:relative">
        <div style="transform:scale(0.64);transform-origin:center center;
                    position:absolute;width:88px;height:110px;
                    display:flex;align-items:center;justify-content:center;
                    left:50%;top:50%;margin-left:-44px;margin-top:-55px">
          <canvas id="hg-slow" width="88" height="110" style="position:absolute;top:0;left:0"></canvas>
          <div style="position:relative;z-index:2;line-height:1;text-align:center;margin-top:6px">
            <div id="hg-days" style="font-size:20px;font-weight:700;color:#ef4444">0</div>
            <div style="font-size:9px;color:#ef4444;margin-top:1px">天</div>
          </div>
        </div>
      </div>
      <div class="num-before">4個月</div>
    </div>
    <div class="sol">
      <div class="sol-label">AFTER</div>
      <div class="num-after g">2天</div>
    </div>
  </div>

  <!-- Card 3: Spec Unification -->
  <div class="card">
    <div class="cat-top">統一軌跡規劃邏輯</div>
    <div class="prob">
      <div class="prob-label">BEFORE</div>
      <div class="icon-lg">
        <canvas id="chaos" width="140" height="140" style="width:70px;height:70px;display:block"></canvas>
      </div>
      <div class="num-before">N套軌跡邏輯</div>
    </div>
    <div class="sol">
      <div class="sol-label">AFTER</div>
      <div class="num-after g">1套</div>
      <div class="num-after-sub">軌跡邏輯</div>
    </div>
  </div>

</div>
<script>
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();return this;};}

/* === Card 1: CPU overflow chip === */
(function(){const c=document.getElementById('chip-bad').getContext('2d');let t=0,w=0;const bubbles=Array.from({length:14},()=>({x:28+Math.random()*100,y:136-Math.random()*60,r:1.5+Math.random()*2.8,speed:.4+Math.random()*.6,wobble:Math.random()*Math.PI*2}));function shell(f){c.fillStyle='#fff';c.beginPath();c.roundRect(0,0,160,160,16);c.fill();c.strokeStyle='#e2c4c4';c.lineWidth=2.5;c.lineCap='round';[30,46,62,80,98,114,130].forEach(p=>{c.beginPath();c.moveTo(p,6);c.lineTo(p,22);c.stroke();c.beginPath();c.moveTo(p,138);c.lineTo(p,154);c.stroke();c.beginPath();c.moveTo(6,p);c.lineTo(22,p);c.stroke();c.beginPath();c.moveTo(138,p);c.lineTo(154,p);c.stroke();});c.fillStyle='#fff5f5';c.strokeStyle=f?`rgba(239,68,68,${f})`:'#fecaca';c.lineWidth=f?3:1.5;c.beginPath();c.roundRect(22,22,116,116,8);c.fill();c.stroke();}function water(pct,wc,wlc,wo){const bot=136,h=112,topY=bot-Math.min(pct,1)*h,amp=pct>.98?1.5:4;c.save();c.beginPath();c.roundRect(23,23,114,114,7);c.clip();c.beginPath();c.moveTo(22,topY);for(let x=22;x<=138;x+=2)c.lineTo(x,topY+Math.sin(x*.08+wo)*amp+Math.sin(x*.05-wo*1.3)*(amp*.6));c.lineTo(138,bot);c.lineTo(22,bot);c.closePath();c.fillStyle=wc;c.fill();c.beginPath();c.moveTo(22,topY);for(let x=22;x<=138;x+=2)c.lineTo(x,topY+Math.sin(x*.07+wo*1.4+1.2)*(amp*.7)+Math.sin(x*.12-wo*.9)*(amp*.4));c.lineTo(138,topY+12);c.lineTo(22,topY+12);c.closePath();c.fillStyle=wlc;c.fill();c.restore();}function frame(){w+=.05;t++;const f=(Math.sin(t*.38)*.5+.5)*.9;c.clearRect(0,0,160,160);shell(f);water(1.06,'rgba(239,68,68,0.88)','rgba(252,165,165,0.5)',w);c.save();c.beginPath();c.roundRect(23,23,114,114,7);c.clip();bubbles.forEach(b=>{b.y-=b.speed;b.wobble+=.04;b.x+=Math.sin(b.wobble)*.4;if(b.y<24){b.y=136;b.x=28+Math.random()*100;}c.beginPath();c.arc(b.x,b.y,b.r,0,Math.PI*2);c.strokeStyle='rgba(255,255,255,0.6)';c.lineWidth=.8;c.stroke();c.fillStyle='rgba(255,255,255,0.14)';c.fill();});c.restore();const sp=(t%26)/26;for(let i=0;i<8;i++){const a=i/8*Math.PI*2,r=8+sp*24,fade=1-sp;const px=80+Math.cos(a)*r,py=24+Math.sin(a)*r*.38;c.beginPath();c.arc(px,py,2.5*fade+.3,0,Math.PI*2);c.fillStyle=`rgba(239,68,68,${fade*.9})`;c.fill();}c.font='bold 26px monospace';c.fillStyle='#dc2626';c.textAlign='center';c.textBaseline='middle';c.fillText('110%',80,72);c.font='500 10px monospace';c.fillStyle='rgba(0,0,0,0.35)';c.fillText('CPU LOAD',80,92);c.textAlign='left';c.textBaseline='alphabetic';requestAnimationFrame(frame);}frame();})();

/* === Card 2: Hourglass (red sand) === */
(function(){const cv=document.getElementById('hg-slow'),ctx=cv.getContext('2d');const W=88,H=110,daysEl=document.getElementById('hg-days'),CYCLE_MS=8000;let start=null;function draw(p){ctx.clearRect(0,0,W,H);const cx=W/2,top=6,bot=H-6,hw=W*.33,nw=W*.075,neckY=H/2;const sand='rgba(220,38,38,0.78)',sandH='rgba(252,165,165,0.88)',glass='#fff5f5',line='#fecaca';function shape(){ctx.beginPath();ctx.moveTo(cx-hw,top);ctx.bezierCurveTo(cx-hw,top+H*.20,cx-nw,neckY-H*.14,cx-nw,neckY);ctx.bezierCurveTo(cx-nw,neckY+H*.14,cx-hw,bot-H*.20,cx-hw,bot);ctx.lineTo(cx+hw,bot);ctx.bezierCurveTo(cx+hw,bot-H*.20,cx+nw,neckY+H*.14,cx+nw,neckY);ctx.bezierCurveTo(cx+nw,neckY-H*.14,cx+hw,top+H*.20,cx+hw,top);ctx.closePath();}shape();ctx.fillStyle=glass;ctx.fill();const topH=neckY-top-1;ctx.save();ctx.beginPath();ctx.moveTo(cx-hw,top);ctx.bezierCurveTo(cx-hw,top+H*.20,cx-nw,neckY-H*.14,cx-nw,neckY);ctx.lineTo(cx+nw,neckY);ctx.bezierCurveTo(cx+nw,neckY-H*.14,cx+hw,top+H*.20,cx+hw,top);ctx.closePath();ctx.clip();const g1=ctx.createLinearGradient(cx-hw,0,cx+hw,0);g1.addColorStop(0,sand);g1.addColorStop(.5,sandH);g1.addColorStop(1,sand);ctx.fillStyle=g1;ctx.fillRect(0,neckY-topH*(1-p),W,topH*(1-p)+4);ctx.restore();const botH=bot-neckY-1;ctx.save();ctx.beginPath();ctx.moveTo(cx-nw,neckY);ctx.bezierCurveTo(cx-nw,neckY+H*.14,cx-hw,bot-H*.20,cx-hw,bot);ctx.lineTo(cx+hw,bot);ctx.bezierCurveTo(cx+hw,bot-H*.20,cx+nw,neckY+H*.14,cx+nw,neckY);ctx.closePath();ctx.clip();const g2=ctx.createLinearGradient(cx-hw,0,cx+hw,0);g2.addColorStop(0,sand);g2.addColorStop(.5,sandH);g2.addColorStop(1,sand);ctx.fillStyle=g2;ctx.fillRect(0,bot-botH*p,W,botH*p+3);ctx.restore();if(p<0.97){ctx.save();shape();ctx.clip();ctx.strokeStyle='rgba(220,38,38,0.65)';ctx.lineWidth=1.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,neckY);ctx.lineTo(cx,neckY+7);ctx.stroke();ctx.restore();}shape();const wg=ctx.createLinearGradient(cx-hw,0,cx+hw,0);wg.addColorStop(0,'rgba(255,255,255,.55)');wg.addColorStop(.15,'rgba(255,255,255,0)');wg.addColorStop(.85,'rgba(255,255,255,0)');wg.addColorStop(1,'rgba(255,255,255,.4)');ctx.fillStyle=wg;ctx.fill();shape();ctx.strokeStyle=line;ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#fca5a5';ctx.fillRect(cx-hw,top-1,hw*2,3);ctx.fillRect(cx-hw,bot-1.5,hw*2,3);}function loop(now){if(!start)start=now;const raw=((now-start)%CYCLE_MS)/CYCLE_MS;draw(raw);daysEl.textContent=Math.floor(raw*120);requestAnimationFrame(loop);}requestAnimationFrame(loop);})();

/* === Card 3: Incompatible connectors === */
(function(){
  const cv=document.getElementById('chaos'),ctx=cv.getContext('2d');
  const W=140,H=140,CX=70,CY=70;

  // 4 connector plugs at corners: [baseX, baseY, type, color]
  // type 0=USB-A rect, 1=square T-pin, 2=D-sub, 3=oval 2-pin
  const plugs=[
    {bx:20,by:20,type:0,col:'#ef4444'},
    {bx:120,by:20,type:1,col:'#f97316'},
    {bx:20,by:120,type:2,col:'#8b5cf6'},
    {bx:120,by:120,type:3,col:'#ec4899'},
  ];

  function drawSocket(){
    ctx.save();
    ctx.strokeStyle='#374151';ctx.fillStyle='#f9fafb';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(CX-9,CY-14,18,28,3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#d1d5db';
    [-9,-3,3,9].forEach(dy=>{ctx.fillRect(CX-5,CY+dy-1,10,2);});
    ctx.restore();
  }

  function drawPlug(x,y,type,col,alpha){
    ctx.save();ctx.globalAlpha=alpha;
    ctx.strokeStyle=col;ctx.fillStyle=col+'28';ctx.lineWidth=1.8;
    if(type===0){
      // USB-A: rectangle with 3 equal pins
      ctx.beginPath();ctx.roundRect(x-9,y-5,18,10,3);ctx.fill();ctx.stroke();
      ctx.fillStyle=col;
      [x-5,x-1,x+3].forEach(px=>{ctx.fillRect(px,y-2,2,4);});
    } else if(type===1){
      // Square with T-bar
      ctx.beginPath();ctx.roundRect(x-9,y-7,18,14,2);ctx.fill();ctx.stroke();
      ctx.fillStyle=col;
      ctx.fillRect(x-5,y-4,10,2);ctx.fillRect(x-1,y-4,2,7);
    } else if(type===2){
      // D-sub shape
      ctx.beginPath();
      ctx.moveTo(x-8,y-7);ctx.lineTo(x+3,y-7);
      ctx.arcTo(x+10,y-7,x+10,y,7);ctx.arcTo(x+10,y+7,x+3,y+7,7);
      ctx.lineTo(x-8,y+7);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.fillStyle=col;
      ctx.fillRect(x-4,y-3,5,2);ctx.fillRect(x-4,y+1,5,2);
    } else {
      // Oval with 2 round pins
      ctx.beginPath();ctx.ellipse(x,y,10,6,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(x-4,y,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+4,y,2,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  function drawX(x,y,alpha){
    if(alpha<=0)return;
    ctx.save();ctx.globalAlpha=alpha;
    ctx.strokeStyle='#ef4444';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x-7,y-7);ctx.lineTo(x+7,y+7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+7,y-7);ctx.lineTo(x-7,y+7);ctx.stroke();
    ctx.restore();
  }

  let t=0;
  const CYCLE=150;

  function frame(){
    t++;
    ctx.clearRect(0,0,W,H);

    const ai=Math.floor(t/CYCLE)%4;   // which plug is active
    const ct=(t%CYCLE)/CYCLE;          // 0→1 within cycle

    // Dashed lines from each plug toward socket (stop at ~52% of distance)
    plugs.forEach((p,i)=>{
      const dx=CX-p.bx,dy=CY-p.by;
      const ex=p.bx+dx*0.52,ey=p.by+dy*0.52;
      ctx.save();ctx.globalAlpha=i===ai?0.65:0.18;
      ctx.strokeStyle=p.col;ctx.lineWidth=1.2;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.moveTo(p.bx,p.by);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    });

    // Central socket
    drawSocket();

    // X marks at the blocked connection point on each line
    plugs.forEach((p,i)=>{
      const dx=CX-p.bx,dy=CY-p.by;
      const mx=p.bx+dx*0.52,my=p.by+dy*0.52;
      let xa;
      if(i===ai){
        // Fade in when plug approaches, hold, fade out on return
        xa=ct<0.35?0.1:ct<0.46?(ct-0.35)/0.11:ct<0.68?1:1-(ct-0.68)/0.32;
      } else {
        // Dim ambient pulse
        xa=0.08+0.06*Math.sin(t*0.055+i*1.6);
      }
      drawX(mx,my,xa);
    });

    // Draw plugs (active one slides toward socket then bounces back)
    plugs.forEach((p,i)=>{
      let x=p.bx,y=p.by;
      if(i===ai){
        const dx=CX-p.bx,dy=CY-p.by;
        // Target: 36% of the way to center
        const tx=p.bx+dx*0.36,ty=p.by+dy*0.36;
        if(ct<0.30){
          // Ease-out toward socket
          const e=1-Math.pow(1-ct/0.30,2);
          x=p.bx+(tx-p.bx)*e;y=p.by+(ty-p.by)*e;
        } else if(ct<0.43){
          // Bounce back slightly
          const b=(ct-0.30)/0.13;
          x=tx+(p.bx-tx)*b*0.45;y=ty+(p.by-ty)*b*0.45;
        } else if(ct<0.68){
          // Hold at bounced position
          x=tx+(p.bx-tx)*0.45;y=ty+(p.by-ty)*0.45;
        } else {
          // Return to base
          const r=(ct-0.68)/0.32;
          const hx=tx+(p.bx-tx)*0.45,hy=ty+(p.by-ty)*0.45;
          x=hx+(p.bx-hx)*r;y=hy+(p.by-hy)*r;
        }
      }
      drawPlug(x,y,p.type,p.col,i===ai?1:0.38);
    });

    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
