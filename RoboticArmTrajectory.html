<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robotic Arm — Quintic Trajectory Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }

    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 60%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.06) 100%);
    }

    #title-label {
      position: absolute; top: 22px; left: 24px;
      pointer-events: none;
    }
    #title-label .t1 {
      font-size: 15px; font-weight: 700; color: #1a1a1e;
      letter-spacing: 0.04em; line-height: 1;
      display: flex; align-items: center; gap: 8px;
    }
    #title-label .t1::before {
      content: ''; display: block;
      width: 3px; height: 16px; border-radius: 2px;
      background: #0071e3;
    }
    #title-label .t2 {
      font-size: 10.5px; color: #888; font-weight: 400;
      letter-spacing: 0.02em; margin-top: 5px; padding-left: 11px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }

    #legend {
      position: absolute; bottom: 22px; left: 24px;
      background: rgba(255,255,255,0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,0.08); border-radius: 12px;
      padding: 12px 16px; pointer-events: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    #legend .row { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #444; margin: 3px 0; }
    #legend .row b { color: #1a1a1e; font-weight: 700; width: 16px; }
    #legend .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    #legend .hd { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #999; text-transform: uppercase; margin-bottom: 6px; }

    #phase-label {
      position: absolute; top: 24px; right: 26px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
      color: #0071e3; text-transform: uppercase;
      background: rgba(0,113,227,0.08); border-radius: 980px;
      padding: 6px 14px; pointer-events: none;
      transition: opacity .25s ease;
    }

    @media (max-width: 560px) {
      #title-label { top: 12px; left: 12px; max-width: calc(100% - 88px); }
      #title-label .t1 { font-size: 11px; gap: 6px }
      #title-label .t1::before { width: 2px; height: 12px }
      #title-label .t2 { font-size: 7.5px; margin-top: 3px; padding-left: 8px; line-height: 1.4 }
      #phase-label { top: 12px; right: 12px; font-size: 8px; padding: 4px 9px }
      #legend { bottom: 12px; left: 12px; padding: 8px 10px; border-radius: 9px }
      #legend .hd { font-size: 8px; margin-bottom: 4px }
      #legend .row { font-size: 8.5px; gap: 5px; margin: 2px 0 }
      #legend .row b { width: 12px }
      #legend .dot { width: 5px; height: 5px }
    }
  </style>
</head>
<body>
<div id="canvas-container"></div>
<div id="vignette"></div>

<div id="title-label">
  <div class="t1">Robotic Arm — Quintic Trajectory</div>
  <div class="t2">P(t): position + velocity boundary conditions at t=0 and t=T</div>
</div>

<div id="phase-label">Idle</div>

<div id="legend">
  <div class="hd">Boundary Conditions</div>
  <div class="row"><b>P0</b><span class="dot" style="background:#22c55e"></span><span id="p0-txt">—</span></div>
  <div class="row"><b>P1</b><span class="dot" style="background:#ef4444"></span><span id="p1-txt">—</span></div>
</div>

<script>
(function() {
  const show = msg => {
    let d = document.getElementById('_err');
    if (!d) { d = document.createElement('pre'); d.id='_err'; Object.assign(d.style,{position:'fixed',top:'0',left:'0',zIndex:'9999',background:'rgba(0,0,0,0.92)',color:'#f66',padding:'12px',maxWidth:'90vw',maxHeight:'60vh',overflow:'auto',fontSize:'12px',whiteSpace:'pre-wrap'}); document.body.appendChild(d); }
    d.textContent += msg + '\n';
  };
  window.addEventListener('error', e => show('ERROR: ' + e.message + '\n  at ' + e.filename + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => show('IMPORT ERROR: ' + (e.reason?.message || e.reason || 'unknown')));
})();
</script>

<script type="importmap">
{
  "imports": {
    "three":          "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 }        from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// ─── Scene ────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 20, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.6, 4.4, 6.6);
camera.lookAt(0, 1.3, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.25, 0);
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.update();

// ─── Lights ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(6, 11, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.1; keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -8; keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8; keyLight.shadow.camera.bottom = -8;
keyLight.shadow.bias = -0.0015;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xaac4ff, 0.55);
rimLight.position.set(-7, 5, -4);
scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
fillLight.position.set(-2, 3, 6);
scene.add(fillLight);

// ─── Ground + pedestal plate ────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.001;
ground.receiveShadow = true;
scene.add(ground);

const plateOuter = new THREE.Mesh(
  new THREE.CylinderGeometry(2.7, 2.7, 0.05, 64),
  new THREE.MeshStandardMaterial({ color: 0xeef1f5, roughness: 0.85, metalness: 0.05 })
);
plateOuter.position.y = 0.025;
plateOuter.receiveShadow = true;
scene.add(plateOuter);

const plateInner = new THREE.Mesh(
  new THREE.CylinderGeometry(1.15, 1.15, 0.06, 64),
  new THREE.MeshStandardMaterial({ color: 0xd8dee6, roughness: 0.7, metalness: 0.15 })
);
plateInner.position.y = 0.055;
plateInner.receiveShadow = true;
scene.add(plateInner);

// ─── Materials ────────────────────────────────────────────────────────────
const matArm    = new THREE.MeshStandardMaterial({ color: 0xf3f5f8, roughness: 0.38, metalness: 0.35 });
const matJoint  = new THREE.MeshStandardMaterial({ color: 0x0071e3, roughness: 0.28, metalness: 0.5, emissive: 0x0071e3, emissiveIntensity: 0.12 });
const matBase   = new THREE.MeshStandardMaterial({ color: 0x2b2f38, roughness: 0.45, metalness: 0.45 });
const matGrip   = new THREE.MeshStandardMaterial({ color: 0x1d1d1f, roughness: 0.4, metalness: 0.4 });
const matTip    = new THREE.MeshStandardMaterial({ color: 0x0071e3, emissive: 0x0a84ff, emissiveIntensity: 1.3, roughness: 0.3 });

// ─── Arm geometry constants ─────────────────────────────────────────────
const L1 = 1.6;   // upper arm length
const L2 = 1.5;   // forearm length (incl. wrist/gripper reach)
const R_LINK = 0.15;

function makeLink(len) {
  const g = new THREE.CapsuleGeometry(R_LINK, Math.max(len - 2 * R_LINK, 0.05), 6, 12);
  const m = new THREE.Mesh(g, matArm);
  m.position.y = len / 2;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// ─── Build arm hierarchy ─────────────────────────────────────────────────
const baseMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(0.62, 0.72, 0.5, 32),
  matBase
);
baseMesh.position.y = 0.25;
baseMesh.castShadow = true; baseMesh.receiveShadow = true;
scene.add(baseMesh);

const turretGroup = new THREE.Group();
turretGroup.position.y = 0.5;
scene.add(turretGroup);

const turretMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.5, 0.3, 24),
  matBase
);
turretMesh.position.y = 0.15;
turretMesh.castShadow = true;
turretGroup.add(turretMesh);

const SHOULDER_H = 0.3; // local height within turret
const shoulderPivot = new THREE.Object3D();
shoulderPivot.position.y = SHOULDER_H;
turretGroup.add(shoulderPivot);

const shoulderJoint = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16), matJoint);
shoulderJoint.castShadow = true;
shoulderPivot.add(shoulderJoint);

const upperArmMesh = makeLink(L1);
shoulderPivot.add(upperArmMesh);

const elbowPivot = new THREE.Object3D();
elbowPivot.position.y = L1;
shoulderPivot.add(elbowPivot);

const elbowJoint = new THREE.Mesh(new THREE.SphereGeometry(0.17, 18, 14), matJoint);
elbowJoint.castShadow = true;
elbowPivot.add(elbowJoint);

const forearmMesh = makeLink(L2);
elbowPivot.add(forearmMesh);

const wristGroup = new THREE.Object3D();
wristGroup.position.y = L2;
elbowPivot.add(wristGroup);

const wristJoint = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), matGrip);
wristGroup.add(wristJoint);

// simple claw gripper
const fingerGeo = new THREE.BoxGeometry(0.05, 0.26, 0.09);
const fingerL = new THREE.Mesh(fingerGeo, matGrip);
fingerL.position.set(-0.09, 0.16, 0);
fingerL.rotation.z = 0.18;
fingerL.castShadow = true;
wristGroup.add(fingerL);
const fingerR = new THREE.Mesh(fingerGeo, matGrip);
fingerR.position.set(0.09, 0.16, 0);
fingerR.rotation.z = -0.18;
fingerR.castShadow = true;
wristGroup.add(fingerR);

const tipMarker = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), matTip);
tipMarker.position.y = 0.22;
wristGroup.add(tipMarker);

// ─── Quintic polynomial (position + velocity boundary conditions, zero boundary accel) ──
function quinticCoeffs(p0, v0, p1, v1, T) {
  const dp = p1 - p0;
  const c0 = p0, c1 = v0, c2 = 0;
  const c3 = (20 * dp - (8 * v1 + 12 * v0) * T) / (2 * T ** 3);
  const c4 = (30 * -dp + (14 * v1 + 16 * v0) * T) / (2 * T ** 4);
  const c5 = (12 * dp - 6 * (v1 + v0) * T) / (2 * T ** 5);
  return [c0, c1, c2, c3, c4, c5];
}
function evalPoly(c, t) {
  return c[0] + c[1]*t + c[2]*t*t + c[3]*t**3 + c[4]*t**4 + c[5]*t**5;
}

class Quintic3 {
  constructor(P0, V0, P1, V1, T) {
    this.T = T;
    this.cx = quinticCoeffs(P0.x, V0.x, P1.x, V1.x, T);
    this.cy = quinticCoeffs(P0.y, V0.y, P1.y, V1.y, T);
    this.cz = quinticCoeffs(P0.z, V0.z, P1.z, V1.z, T);
  }
  at(t, out = new THREE.Vector3()) {
    const tt = Math.max(0, Math.min(this.T, t));
    out.set(evalPoly(this.cx, tt), evalPoly(this.cy, tt), evalPoly(this.cz, tt));
    return out;
  }
}

// ─── Boundary conditions ─────────────────────────────────────────────────
const P0 = new THREE.Vector3(-1.55, 1.35, 1.30);
const V0 = new THREE.Vector3(1.10, 0.70, -0.50);
const P1 = new THREE.Vector3(1.85, 2.05, 1.35);
const V1 = new THREE.Vector3(0.50, -0.60, 0.90);
const T_LEG = 2.6;

document.getElementById('p0-txt').textContent = `(${P0.x.toFixed(2)}, ${P0.y.toFixed(2)}, ${P0.z.toFixed(2)})  slope (${V0.x.toFixed(1)}, ${V0.y.toFixed(1)}, ${V0.z.toFixed(1)})`;
document.getElementById('p1-txt').textContent = `(${P1.x.toFixed(2)}, ${P1.y.toFixed(2)}, ${P1.z.toFixed(2)})  slope (${V1.x.toFixed(1)}, ${V1.y.toFixed(1)}, ${V1.z.toFixed(1)})`;

const forwardTraj = new Quintic3(P0, V0, P1, V1, T_LEG);

// ─── Trajectory trail (static reference curve) ───────────────────────────
function buildTrailLine(traj, color) {
  const N = 160;
  const positions = [];
  const v = new THREE.Vector3();
  for (let i = 0; i <= N; i++) {
    traj.at((i / N) * traj.T, v);
    positions.push(v.x, v.y, v.z);
  }
  const geo = new LineGeometry();
  geo.setPositions(positions);
  const mat = new LineMaterial({
    color, linewidth: 3, transparent: true, opacity: 0.55,
    resolution: new THREE.Vector2(window.innerWidth, window.innerHeight)
  });
  const line = new Line2(geo, mat);
  line.computeLineDistances();
  return { line, mat };
}
const trail = buildTrailLine(forwardTraj, 0x0071e3);
scene.add(trail.line);

// ─── Start / end pose gizmos ──────────────────────────────────────────────
function makeGizmo(pos, vel, color) {
  const g = new THREE.Group();
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6 }));
  g.add(dot);
  const dir = vel.clone().normalize();
  const len = 0.55;
  const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, 0), len, color, 0.14, 0.09);
  g.add(arrow);
  g.position.copy(pos);
  scene.add(g);
  return g;
}
makeGizmo(P0, V0, 0x22c55e);
makeGizmo(P1, V1, 0xef4444);

// ─── Inverse kinematics: world target -> (yaw, shoulderPitch, elbowPitch) ─
const SHOULDER_WORLD_H = 0.5 + SHOULDER_H; // base height + local pivot height

function solveIK(target) {
  const yaw = Math.atan2(target.x, target.z);
  const r = Math.sqrt(target.x * target.x + target.z * target.z);
  const h = target.y - SHOULDER_WORLD_H;

  let D = Math.sqrt(r * r + h * h);
  const maxReach = L1 + L2 - 0.02;
  const minReach = Math.abs(L1 - L2) + 0.02;
  D = Math.max(minReach, Math.min(maxReach, D));

  const alpha = Math.atan2(r, h); // angle of target from vertical
  const cosBeta = (L1 * L1 + D * D - L2 * L2) / (2 * L1 * D);
  const beta = Math.acos(Math.max(-1, Math.min(1, cosBeta)));
  const shoulderPitch = alpha - beta;

  const cosPsi = (L1 * L1 + L2 * L2 - D * D) / (2 * L1 * L2);
  const psi = Math.acos(Math.max(-1, Math.min(1, cosPsi)));
  const elbowPitch = Math.PI - psi;

  return { yaw, shoulderPitch, elbowPitch };
}

function applyPose(target) {
  const { yaw, shoulderPitch, elbowPitch } = solveIK(target);
  turretGroup.rotation.y = yaw;
  shoulderPivot.rotation.x = shoulderPitch;
  elbowPivot.rotation.x = elbowPitch;
}

// ─── Animation state machine ──────────────────────────────────────────────
const HOLD_DUR = 1.0;
const phases = ['hold-start', 'move-forward', 'hold-end', 'move-backward'];
let phaseIdx = 0;
let phaseT = 0;
const phaseLabelEl = document.getElementById('phase-label');
const phaseNames = { 'hold-start': 'Hold · Start', 'move-forward': 'Trajectory → End', 'hold-end': 'Hold · End', 'move-backward': 'Trajectory → Start' };

const liveTarget = new THREE.Vector3();
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  phaseT += dt;

  const phase = phases[phaseIdx];
  phaseLabelEl.textContent = phaseNames[phase];

  if (phase === 'hold-start') {
    liveTarget.copy(P0);
    if (phaseT >= HOLD_DUR) { phaseT = 0; phaseIdx = 1; }
  } else if (phase === 'move-forward') {
    forwardTraj.at(phaseT, liveTarget);
    if (phaseT >= T_LEG) { phaseT = 0; phaseIdx = 2; }
  } else if (phase === 'hold-end') {
    liveTarget.copy(P1);
    if (phaseT >= HOLD_DUR) { phaseT = 0; phaseIdx = 3; }
  } else {
    forwardTraj.at(T_LEG - phaseT, liveTarget);
    if (phaseT >= T_LEG) { phaseT = 0; phaseIdx = 0; }
  }

  applyPose(liveTarget);
  controls.update();
  renderer.render(scene, camera);
}
tick();

// ─── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  trail.mat.resolution.set(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
