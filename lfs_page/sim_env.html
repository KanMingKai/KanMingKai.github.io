<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料驅動的車道線模擬環境 — 相機模型 · 場景記錄 · 回撥驗證</title>
<style>
  :root{
    --bg:#fbfcfd;--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#86868b;--line:#d2d2d7;
    --blue:#0071e3;--green:#0a8a5c;--amber:#c2760b;--grid:#eaeef3;
    --flow:#2a7ea8;
    --sans:"SF Pro TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  /* 兩個嵌入的 3D demo:絕對定位浮在 canvas 上,位置每幀由 placeFrame 換算。
     外框和圓角比照原本 canvas 畫的示意圖,視覺上才接得起來。 */
  .replay-frame{
    position:absolute;border:1px solid var(--line);border-radius:8px;
    background:#fff;overflow:hidden;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<iframe id="fBefore" class="replay-frame" title="改版前" scrolling="no"></iframe>
<iframe id="fAfter"  class="replay-frame" title="改版後" scrolling="no"></iframe>

<script>
/* ============================================================
   資料驅動的車道線模擬環境 — 流程動畫

     1 相機模型  Mini-FOT 取 100 km 統計相機偵測車道線的參數行為 —— 靜態
     2 場景記錄  本車座標系下,逐幀累積車道線 C0 與物件位置
     ─────── 兩者相加 = 一套可重跑的模擬環境 ───────
     3 回撥驗證  改完程式,用同一段場景重跑比對

   版面本身就是那個算式:上排兩格中間擺一個「+」,再用一支粗箭頭
   往下接到驗證那一格 —— 上排是「建環境」,下排是「用環境」。

   會動的只有 2 和 3,而且同時播:回撥驗證跑的就是場景記錄錄下來的
   那一段,兩邊同一個時間軸才看得出是同一件事。相機模型是靜態的輸入。

   自動循環,無控制項(與本專案其他 demo 一致)。
   版面兩種:寬螢幕 2+1、窄螢幕直排三列 —— 等比縮放會讓手機上
   完全看不清,所以依容器長寬比切換,而不是縮小同一份版面。
   ============================================================ */

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const CSS = getComputedStyle(document.documentElement);
const C = n => CSS.getPropertyValue(n).trim();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease  = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
// 固定亂數:每次循環的散點都在同一個位置,才像「同一批資料」
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };

/* ---------- 版面 ---------- */
const META = [
  { n: '1', t: '相機模型', s: 'Mini-FOT 統計:車速 → 有效視野距離' },
  { n: '2', t: '場景記錄', s: '左:當下場景　右:逐幀累積的結果' },
  { n: '3', t: '回撥驗證', s: '改完程式,用同一段場景重跑比對' },
];

let L = null, scale = 1, offX = 0, offY = 0;

// 上排兩格「建環境」,下排整行「用環境」——版面本身就在講這個層次。
// 第二格裡有兩個子畫面,所以比隔壁大一號。
const SHARE = 0.455;              // 上排左格佔可用寬度的比例

function buildLayout(cssW, cssH) {
  // 門檻對應 2+1 版面的長寬比(920x640 ≈ 1.44):比它更瘦就改直排
  const vertical = cssW / cssH < 1.15;

  if (vertical) {
    // 直排時 gap 要塞得下中間的「+」與粗箭頭,所以開得比原本寬。
    // 底部留 78:結語那兩行加上分隔線,比橫排版面高一倍。
    const W = 360, H = 880, pad = 16, top = 62, gap = 34;
    const avail = H - top - 78 - gap * 2;
    const share = [0.27, 0.365, 0.365];
    let y = top;
    return {
      W, H, vertical, gap, headY: 26, footY: H - 42,
      panels: META.map((m, i) => {
        const h = Math.floor(avail * share[i]);
        const box = { ...m, x: pad, y, w: W - pad * 2, h };
        y += h + gap;
        return box;
      }),
    };
  }

  const W = 920, H = 640, pad = 22, top = 66, gap = 46, rowGap = 48;
  const rowH = 236;
  const avail = W - pad * 2 - gap;
  const wL = Math.floor(avail * SHARE);
  const panels = [
    { ...META[0], x: pad,            y: top, w: wL,          h: rowH },
    { ...META[1], x: pad + wL + gap, y: top, w: avail - wL,  h: rowH },
    { ...META[2], x: pad, y: top + rowH + rowGap,
                  w: W - pad * 2, h: H - (top + rowH + rowGap) - 62 },
  ];
  return { W, H, vertical, gap, headY: 30, footY: H - 26, panels };
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width  = Math.round(r.width  * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  L = buildLayout(r.width, r.height);
  scale = Math.min(r.width / L.W, r.height / L.H);
  offX = (r.width  - L.W * scale) / 2;
  offY = (r.height - L.H * scale) / 2;
}
new ResizeObserver(resize).observe(cv);
resize();

/* ---------- 繪圖小工具 ---------- */
function text(s, x, y, { size = 12, weight = 400, color = '--ink',
                        font = 'sans', align = 'left', alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = C(color);
  ctx.font = `${weight} ${size}px ${font === 'mono' ? C('--mono') : C('--sans')}`;
  ctx.textAlign = align;
  ctx.fillText(s, x, y);
  ctx.restore();
}

function measure(s, size, font) {
  ctx.save();
  ctx.font = `400 ${size}px ${font === 'mono' ? C('--mono') : C('--sans')}`;
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}

// 面板內的繪圖區(扣掉標題列)
// 上緣留 64px 給面板標題與副標,避免與圖表的軸標籤擠在一起
const plotOf = p => ({ x: p.x + 16, y: p.y + 64, w: p.w - 32, h: p.h - 88 });

// 三格永遠都在(沒有分段揭露),所以只剩「要不要用藍色點出來」這個區別
function panelChrome(p, accent) {
  ctx.save();
  ctx.strokeStyle = accent ? C('--blue') : C('--line');
  ctx.globalAlpha = accent ? 0.85 : 0.6;
  ctx.lineWidth = accent ? 1.5 : 1;
  ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 12); ctx.stroke();
  ctx.restore();

  text(p.n, p.x + 15, p.y + 24, { size: 11, weight: 700, font: 'mono',
       color: accent ? '--blue' : '--ink-3' });
  text(p.t, p.x + 31, p.y + 24, { size: 12.5, weight: 700, color: '--ink' });
  text(p.s, p.x + 15, p.y + 41, { size: 9.5, font: 'mono', color: '--ink-3',
       alpha: 0.95 });
}

// 上排兩格中間的「+」:相機模型 加上 場景記錄
function plus(cx, cy, s, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = C('--ink-2');
  ctx.lineWidth = Math.max(3, s * 0.36);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy);
  ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s);
  ctx.stroke();
  ctx.restore();
}

// 兩排之間的粗箭頭:上面加起來的東西,往下就是拿來跑驗證的
function blockArrow(cx, y1, y2, alpha) {
  if (alpha <= 0) return;
  const h = y2 - y1;
  if (h <= 6) return;
  const halfHead  = Math.min(h * 0.62, 24);
  const halfShaft = halfHead * 0.46;
  const headH     = Math.min(h * 0.52, 22);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = C('--flow');
  ctx.beginPath();
  ctx.moveTo(cx - halfShaft, y1);
  ctx.lineTo(cx + halfShaft, y1);
  ctx.lineTo(cx + halfShaft, y2 - headH);
  ctx.lineTo(cx + halfHead,  y2 - headH);
  ctx.lineTo(cx,             y2);
  ctx.lineTo(cx - halfHead,  y2 - headH);
  ctx.lineTo(cx - halfShaft, y2 - headH);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 第 1 幕:相機模型 ----------
   統計出來的特性是「車速 → 有效視野距離」:
   低速時穩定在一個定值,超過約 40 kph 之後隨車速線性成長,
   而且有上下界。這條分段折線就是餵給模擬環境的相機模型。   */
const VMAX = 110, RMAX = 120, KNEE = 40;          // kph / m / 轉折車速

// 上下界(m):轉折前為定值,轉折後線性成長
function rangeAt(v, hi) {
  const flat = hi ? 42 : 30;
  if (v <= KNEE) return flat;
  const t = (v - KNEE) / (VMAX - KNEE);
  return flat + t * (hi ? 70 : 55);
}

function drawCamera(p) {
  const r = plotOf(p);
  const px = v => r.x + (v / VMAX) * r.w;            // 車速 → 畫布 x
  const py = m => r.y + r.h - (m / RMAX) * r.h;      // 距離 → 畫布 y

  // 格線與座標軸
  ctx.save();
  ctx.strokeStyle = C('--grid'); ctx.lineWidth = 1;
  for (const m of [40, 80, 120]) {
    ctx.beginPath(); ctx.moveTo(r.x, py(m)); ctx.lineTo(r.x + r.w, py(m)); ctx.stroke();
  }
  ctx.strokeStyle = C('--line'); ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(r.x, r.y); ctx.lineTo(r.x, r.y + r.h); ctx.lineTo(r.x + r.w, r.y + r.h);
  ctx.stroke();
  ctx.restore();

  for (const m of [40, 80]) {
    text(String(m), r.x - 4, py(m) + 3,
         { size: 8.5, font: 'mono', color: '--ink-3', align: 'right' });
  }
  text('有效視野距離 (m)', r.x, r.y - 6,
       { size: 9.5, font: 'mono', color: '--ink-3' });
  text('車速 (kph) →', r.x + r.w, r.y + r.h + 14,
       { size: 9.5, font: 'mono', color: '--ink-3', align: 'right' });

  // 實車量測散點
  const N = 420;
  ctx.save();
  ctx.fillStyle = C('--green'); ctx.globalAlpha = 0.44;
  for (let i = 0; i < N; i++) {
    const v = rnd(i + 1) * VMAX;
    // 分佈:低速時集中在定值以下,轉折後跟著上界一起抬升
    const top = rangeAt(v, true) * 1.06;
    const m = top * (0.1 + 0.9 * Math.pow(rnd(i + 90), 0.75));
    ctx.beginPath(); ctx.arc(px(v), py(m), 1.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // 上下界之間的模型帶
  ctx.save();
  ctx.globalAlpha = 0.16; ctx.fillStyle = C('--blue');
  ctx.beginPath();
  for (let v = 0; v <= VMAX; v += 5) ctx.lineTo(px(v), py(rangeAt(v, true)));
  for (let v = VMAX; v >= 0; v -= 5) ctx.lineTo(px(v), py(rangeAt(v, false)));
  ctx.closePath(); ctx.fill();

  // 上界(琥珀點劃線)與下界(藍虛線)
  for (const hi of [true, false]) {
    ctx.globalAlpha = 1;
    ctx.strokeStyle = hi ? C('--amber') : C('--blue');
    ctx.lineWidth = 1.8;
    ctx.setLineDash(hi ? [6, 3, 1.5, 3] : [5, 4]);
    ctx.beginPath();
    for (let v = 0; v <= VMAX; v += 2) ctx.lineTo(px(v), py(rangeAt(v, hi)));
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 轉折點
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = C('--ink-3'); ctx.lineWidth = 1;
  ctx.setLineDash([2, 3]);
  ctx.beginPath();
  ctx.moveTo(px(KNEE), r.y + r.h); ctx.lineTo(px(KNEE), py(90));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // 兩個標註都放在低速側的上半部 —— 那塊區域沒有散點也沒有模型帶
  text('上下界折線 = 相機模型', r.x + 6, r.y + 12,
       { size: 10, font: 'mono', color: '--blue' });
  text('≈40 kph 起隨車速線性成長', px(KNEE) + 6, py(94),
       { size: 9, font: 'mono', color: '--ink-2' });
}

/* ---------- 第 2 幕:場景記錄 ----------
   本車座標系的累積圖,和實際工具的輸出同一個型式:

     原點 = 本車當下位置;x 為縱向,負值是已經過的路;y 為橫向
     綠線 × 4 = 逐幀累積的車道線 C0
     黑點     = 逐幀累積的物件位置(多目標,會中途進出視野)

   本車動態的補償已經反映在資料裡(所以線是平滑的,不是波浪),
   那一步寫在頁面文字裡,畫面只呈現結果。
   過彎時整條尾巴會相對現在的車頭甩出去 —— 這是本車座標系的必然,
   也正好說明累積是真的在世界座標下對齊過的。               */

// 預先算好一條路:曲率先小幅擺動,後段轉成持續彎道
const PATH = (() => {
  const N = 460, DS = 0.9, a = [];
  let x = 0, y = 0, th = 0;
  for (let i = 0; i < N; i++) {
    a.push({ x, y, th });
    const u = i / N;
    // 負號:讓累積的尾巴甩向 -y,落在畫布顯示的 y 範圍內
    const kappa = -(Math.sin(u * 7.5) * 0.0022 + (u > 0.45 ? (u - 0.45) * 0.0096 : 0));
    th += kappa * DS;
    x += Math.cos(th) * DS;
    y += Math.sin(th) * DS;
  }
  return a;
})();

const LANE_OFF = [-5.4, -1.8, 1.8, 5.4];            // m,四條車道線
const OBJS = [                                       // 物件:進出視野的時機不同
  { lead: 28, off:  0.2, from: 0.00, to: 1.00 },
  { lead: 46, off: -3.5, from: 0.34, to: 1.00 },
  { lead: 62, off:  3.4, from: 0.00, to: 0.62 },
];

// 世界座標 → 以第 c 個取樣點為原點的本車座標
function toEgo(px, py, c) {
  const o = PATH[c], dx = px - o.x, dy = py - o.y;
  const ct = Math.cos(o.th), st = Math.sin(o.th);
  return { x: dx * ct + dy * st, y: -dx * st + dy * ct };
}
// 沿路徑第 i 點、橫向偏移 off 的世界座標
function offsetPt(i, off) {
  const p = PATH[Math.max(0, Math.min(PATH.length - 1, i))];
  return { x: p.x - Math.sin(p.th) * off, y: p.y + Math.cos(p.th) * off };
}

// 沿路徑第 i 點往前看 d 公尺、橫向偏移 off 時,在本車座標系的位置
function aheadInEgo(cur, d, off) {
  const w = offsetPt(cur + Math.round(d / 0.9), off);
  return toEgo(w.x, w.y, cur);
}

/* --- 子畫面 A:當下場景(透視) ---
   投影刻意不是嚴格針孔:子畫面很窄,若橫縱用同一個焦距,
   近端十公尺處的三線道會整條溢出畫面。改成橫縱各自取焦距、
   近端從 12 m 起畫、視點抬高一些,才畫得出可讀的路。          */
function drawLive(r, cur) {
  const hz   = r.y + r.h * 0.28;                 // 地平線
  const cx   = r.x + r.w * 0.5;
  const FX   = r.w * 1.10, FY = r.h * 1.60;      // 橫向/縱向焦距
  const CAMH = 4.0, D0 = 9, D1 = 95;            // 視點高 / 近端 / 遠端
  const proj = (d, l) => ({ px: cx + (l / d) * FX, py: hz + (CAMH / d) * FY });
  const laneY = (d, off) => aheadInEgo(cur, d, off).y;

  ctx.save();
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.clip();

  ctx.fillStyle = '#dde5ee'; ctx.fillRect(r.x, r.y, r.w, hz - r.y);       // 天空
  ctx.fillStyle = '#ccd3cb'; ctx.fillRect(r.x, hz, r.w, r.y + r.h - hz);  // 路旁

  // 路面
  ctx.fillStyle = '#b7bec6';
  ctx.beginPath();
  for (let d = D1; d >= D0; d -= 2) { const q = proj(d, laneY(d, -6.2)); ctx.lineTo(q.px, q.py); }
  for (let d = D0; d <= D1; d += 2) { const q = proj(d, laneY(d,  6.2)); ctx.lineTo(q.px, q.py); }
  ctx.closePath(); ctx.fill();

  // 四條車道線,只畫到相機模型給的有效視野距離
  const VR = Math.min(D1, rangeAt(78, false));

  // 中間兩條是虛線。這裡不能用 setLineDash —— 那是畫在畫面座標上的,
  // 車子開再遠虛線都釘在原地。改成把每一段實線錨在世界座標,
  // 依已行駛距離推進,虛線才會朝觀者流過來。
  const travelled = cur * 0.9;                   // m
  const PERIOD = 13, MARK = 5.5;                 // 一段虛線的週期與實線長
  const phase = travelled % PERIOD;

  const stroke = (from, to, off) => {
    ctx.beginPath();
    for (let d = from; d <= to; d += 1.5) {
      const q = proj(d, laneY(d, off));
      ctx.lineTo(q.px, q.py);
    }
    const q = proj(to, laneY(to, off));
    ctx.lineTo(q.px, q.py);
    ctx.stroke();
  };

  LANE_OFF.forEach(off => {
    const edge = Math.abs(off) > 3;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = edge ? 2.2 : 1.6;
    ctx.globalAlpha = edge ? 0.95 : 0.85;
    if (edge) {
      stroke(D0, VR, off);                       // 外側兩條是實線
    } else {
      for (let n = -1; ; n++) {
        const a = D0 + n * PERIOD - phase;
        if (a > VR) break;
        const from = Math.max(a, D0), to = Math.min(a + MARK, VR);
        if (to > from) stroke(from, to, off);
      }
    }
  });
  ctx.globalAlpha = 1;

  // 前方車輛:由遠而近畫,近的蓋住遠的
  OBJS.map(o => ({ o, d: o.lead * 0.9 }))
      .sort((a, b) => b.d - a.d)
      .forEach(({ o, d }) => {
        const u = cur / PATH.length;
        if (u < o.from || u > o.to || d < D0 || d > VR) return;
        const q = proj(d, laneY(d, o.off));
        const w = (2.0 / d) * FX, h = w * 0.85;
        ctx.fillStyle = '#454d59';
        ctx.beginPath();
        ctx.roundRect(q.px - w / 2, q.py - h, w, h, Math.max(1, w * 0.14));
        ctx.fill();
      });
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = C('--line'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
  ctx.restore();

  text('當下場景', r.x + 7, r.y + 13,
       { size: 8.5, font: 'mono', color: '--ink-2' });
}

/* --- 子畫面 B:累積圖(x 走水平、y 走垂直) --- */
function drawAccum(r, cur, k) {
  const XMIN = -200, YMIN = -100, YMAX = 20;
  // 本車在右,已經過的路往左延伸
  const G = (x, y) => ({
    px: r.x + r.w * (1 - x / XMIN),
    py: r.y + ((YMAX - y) / (YMAX - YMIN)) * r.h,
  });
  const seg = (ax, ay, bx, by) => {
    const a = G(ax, ay), b = G(bx, by);
    ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
  };

  ctx.save();
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();
  ctx.strokeStyle = C('--grid'); ctx.lineWidth = 1;
  for (const v of [-150, -100, -50]) seg(v, YMIN, v, YMAX);
  for (const v of [-80, -40, 0]) seg(XMIN, v, 0, v);
  ctx.strokeStyle = C('--line'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
  ctx.restore();

  const TRAIL = 235, lo = Math.max(0, cur - TRAIL);

  ctx.save();
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.clip();

  ctx.strokeStyle = C('--green'); ctx.lineWidth = 1.4; ctx.globalAlpha = 0.9;
  for (const off of LANE_OFF) {
    ctx.beginPath();
    for (let i = lo; i <= cur; i += 2) {
      const w = offsetPt(i, off), e = toEgo(w.x, w.y, cur), q = G(e.x, e.y);
      ctx.lineTo(q.px, q.py);
    }
    ctx.stroke();
  }

  ctx.fillStyle = '#1d1d1f'; ctx.globalAlpha = 0.85;
  for (const o of OBJS) {
    const a = Math.max(lo, Math.floor(o.from * PATH.length));
    const b = Math.min(cur, Math.floor(o.to * PATH.length));
    for (let i = a; i <= b; i += 3) {
      const w = offsetPt(i + o.lead, o.off), e = toEgo(w.x, w.y, cur);
      if (e.x > 6) continue;
      const q = G(e.x, e.y);
      ctx.beginPath(); ctx.arc(q.px, q.py, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.globalAlpha = 1; ctx.fillStyle = C('--blue');
  const eg = G(0, 0);
  ctx.beginPath(); ctx.arc(eg.px, eg.py, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  text('逐幀累積', r.x + 7, r.y + 13, { size: 8.5, font: 'mono', color: '--ink-2' });
  text('x(m) →', r.x + r.w - 6, r.y + r.h - 7,
       { size: 8, font: 'mono', color: '--ink-3', align: 'right' });
  text('y(m)', r.x + 7, r.y + r.h - 7, { size: 8, font: 'mono', color: '--ink-3' });
}

function drawRecord(p, k) {
  const r = plotOf(p);
  // 起點不從頭開始:表觀車速才不會為了把整條路跑完而飆到不合理
  const C0i = 120;
  const cur = Math.floor(C0i + ease(clamp(k / 0.92, 0, 1)) * (PATH.length - 1 - C0i));

  // 左右各一格(直排版面時左右仍然並排,因為面板本來就夠寬)
  const gap = 8, hw = (r.w - gap) / 2;
  drawLive({ x: r.x, y: r.y, w: hw, h: r.h }, cur);
  drawAccum({ x: r.x + hw + gap, y: r.y, w: hw, h: r.h }, cur, k);

  text('綠 = 車道線 C0 · 黑 = 物件 · 藍 = 本車', r.x, r.y + r.h + 13,
       { size: 8.5, font: 'mono', color: '--ink-3' });
  text('Time ' + (8.9 + (cur / PATH.length) * 17).toFixed(2),
       r.x + r.w, r.y + r.h + 13,
       { size: 8.5, font: 'mono', color: '--ink-2', align: 'right' });
}

/* ---------- 第 3 幕:回撥驗證 ----------
   這一格不再用 canvas 畫示意圖,而是嵌兩個真的 3D demo。
   對應關係是照「行為」定的,不是照檔名:
     改版前 = MIL.html       D = 0.8,被岔線帶偏 0.8 m 再拉回 → 軌跡鼓一個弧
     改版後 = MIL copy.html  D = 0,  全程走車道中心          → 軌跡是直線
   面板原本的兩句說明就是這樣寫的(「跟著左轉邊線被帶出去」/「守住直行車道」),
   會動的那一份才對得上「改版前」。

   兩個檔案除了 D 之外逐字元相同,所以「唯一的變數是程式碼」這句話
   在這裡是字面意義上的成立。

   iframe 是 DOM,浮在 canvas 上面,所以要自己換算座標:canvas 的版面是
   920x640 的邏輯座標再等比縮放,換算就是 offX/offY/scale 那三個值。      */

const REPLAY_SRC = [
  { el: null, id: 'fBefore', file: 'MIL.html',
    label: '改版前', sub: '跟著岔線被帶出去', color: 'c2760b' },
  { el: null, id: 'fAfter',  file: 'MIL copy.html',
    label: '改版後', sub: '守住直行車道',     color: '0071e3' },
];

for (const f of REPLAY_SRC) {
  f.el = document.getElementById(f.id);
  f.el.src = encodeURI(f.file) +
    '?embed=1&label=' + encodeURIComponent(f.label) +
    '&sub='   + encodeURIComponent(f.sub) +
    '&color=' + f.color;
}

// 把 iframe 疊到面板的邏輯座標上
function placeFrame(el, x, y, w, h) {
  el.style.left   = (offX + x * scale) + 'px';
  el.style.top    = (offY + y * scale) + 'px';
  el.style.width  = (w * scale) + 'px';
  el.style.height = (h * scale) + 'px';
}

// 每一圈開頭叫兩個 demo 一起重播,才會和上排面板同步
function restartReplay() {
  for (const f of REPLAY_SRC) {
    if (f.el.contentWindow) f.el.contentWindow.postMessage({ type: 'mil:restart' }, '*');
  }
}

function drawReplay(p) {
  const r = plotOf(p);
  const gap = 12, hw = (r.w - gap) / 2;
  placeFrame(REPLAY_SRC[0].el, r.x,            r.y, hw, r.h);
  placeFrame(REPLAY_SRC[1].el, r.x + hw + gap, r.y, hw, r.h);

  text('輸入:同一段記錄的左轉車道場景　·　唯一的變數是程式碼',
       r.x, r.y + r.h + 14, { size: 9.5, font: 'mono', color: '--ink-3' });
}

/* ---------- 主迴圈 ----------
   相機模型是靜態的輸入,一開始就畫完、不再動。
   場景記錄與回撥驗證是同一件事的兩半(錄一段 → 拿同一段重跑),
   所以共用一個 k 同時播,而不是排成前後兩幕。
   TRUN 沿用原本第二幕的長度:要跑完一段有感的路程,
   又不能讓路面虛線快到閃爍。跑完停一下再回到開頭。            */
const TRUN = 6.7, TEND = 8.6;
const t0 = performance.now();
let prevTime = 0;

function frame(now) {
  const time = ((now - t0) / 1000) % TEND;
  const k = clamp(time / TRUN, 0, 1);
  const P = L.panels;

  // time 倒退代表這一圈剛結束 —— 用它當「重新開始」的信號，通知兩個
  // 嵌入的 demo 一起重播。它們自己跑 3.9 秒就會定格，剩下的時間停在
  // 結果畫面上，正好給人看完對比。
  if (time < prevTime) restartReplay();
  prevTime = time;

  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.clearRect(0, 0, L.W, L.H);
  ctx.fillStyle = C('--bg'); ctx.fillRect(0, 0, L.W, L.H);

  text('資料驅動的車道線模擬環境', 22, L.headY, { size: 15, weight: 700 });
  text('自研 MATLAB 腳本 · 用 Mini-FOT 實車資料建模,而非人工造場景',
       22, L.headY + 18, { size: 11, color: '--ink-2' });

  // 藍框留給最後那一格 —— 它是整頁的結論,不再是「現在播到這裡」
  P.forEach((p, i) => panelChrome(p, i === 2));

  drawCamera(P[0]);
  drawRecord(P[1], k);
  drawReplay(P[2]);          // 內容由 iframe 負責,這裡只擺位置和說明文字

  // 連接符號固定顯示:沒有分段揭露了,它們就是版面的一部分。
  // 共用同一條垂直軸(橫排時是上排兩格的接縫),讀起來才是「1+2 往下」。
  if (L.vertical) {
    const cx = P[0].x + P[0].w / 2;
    plus(cx, (P[0].y + P[0].h + P[1].y) / 2, L.gap * 0.32, 1);
    blockArrow(cx, P[1].y + P[1].h + 5, P[2].y - 5, 1);
  } else {
    const cx = P[0].x + P[0].w + L.gap / 2;
    plus(cx, P[0].y + P[0].h / 2, 14, 1);
    blockArrow(cx, P[0].y + P[0].h + 5, P[2].y - 5, 1);
  }

  ctx.save();
  ctx.globalAlpha = 0.6;
  ctx.strokeStyle = C('--line');
  ctx.beginPath();
  ctx.moveTo(22, L.footY - 22); ctx.lineTo(L.W - 22, L.footY - 22);
  ctx.stroke();
  ctx.restore();

  const tail = '個問題以此定位與驗證';
  // 頁尾原本左邊還有一句「路上只發生一次的狀況,在這裡可以重跑、也可以改參數
  // 生成變體」(直排版本用字略短),已移除,只留右邊的 50+ 統計。
  // 直排版的 50+ 原本在 footY+16(讓開上面那句),句子拿掉後往上收到 footY+2,
  // 否則會和上面那條分隔線之間空一大塊。
  if (L.vertical) {
    const nw = measure('50+', 15, 'mono');
    text('50+', 22, L.footY + 2,
         { size: 15, weight: 700, font: 'mono', color: '--blue' });
    text(tail, 26 + nw, L.footY + 2, { size: 11, color: '--ink-2' });
  } else {
    const tw = measure(tail, 11, 'sans');
    text(tail, L.W - 22, L.footY,
         { size: 11, color: '--ink-2', align: 'right' });
    text('50+', L.W - 26 - tw, L.footY,
         { size: 17, weight: 700, font: 'mono', color: '--blue', align: 'right' });
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
