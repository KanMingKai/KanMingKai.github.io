<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料驅動的車道線模擬環境 — 相機模型 · 道路模型 · 場景合成</title>
<style>
  :root{
    --bg:#fbfcfd;--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#86868b;--line:#d2d2d7;
    --blue:#0071e3;--green:#0a8a5c;--amber:#c2760b;--grid:#eaeef3;
    --sans:"SF Pro TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
/* ============================================================
   資料驅動的車道線模擬環境 — 三段式流程動畫

     1 相機模型  Mini-FOT 取 100 km 統計相機偵測車道線的參數行為
     2 場景記錄  本車座標系下,逐幀累積車道線 C0 與物件位置
     3 場景合成  路型 + 相機模型 + 合成車流 → 產生沒發生過的情境

   自動循環,無控制項(與本專案其他 demo 一致)。
   版面兩種:寬螢幕橫排三欄、窄螢幕直排三列 —— 等比縮放會讓手機上
   完全看不清,所以依容器長寬比切換,而不是縮小同一份版面。
   ============================================================ */

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const CSS = getComputedStyle(document.documentElement);
const C = n => CSS.getPropertyValue(n).trim();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease  = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
// 固定亂數:每次循環的散點都在同一個位置,才像「同一批資料」
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };

/* ---------- 版面 ---------- */
const META = [
  { n: '1', t: '相機模型', s: 'Mini-FOT 統計:車速 → 有效視野距離' },
  { n: '2', t: '場景記錄', s: '左:當下場景　右:逐幀累積的結果' },
  { n: '3', t: '場景合成', s: '加入合成車流,產生沒發生過的情境' },
];

let L = null, scale = 1, offX = 0, offY = 0;

// 第二格裡有「即時場景 + 累積圖」兩個子畫面,所以比另外兩格大一號
const SHARE = [0.29, 0.42, 0.29];

function buildLayout(cssW, cssH) {
  const vertical = cssW / cssH < 1.5;
  if (vertical) {
    const W = 360, H = 830, pad = 16, top = 62, gap = 16;
    const avail = H - top - 44 - gap * 2;
    let y = top;
    return {
      W, H, vertical, headY: 26, footY: H - 42,
      panels: META.map((m, i) => {
        const h = Math.floor(avail * SHARE[i]);
        const box = { ...m, x: pad, y, w: W - pad * 2, h };
        y += h + gap;
        return box;
      }),
    };
  }
  const W = 920, H = 400, pad = 22, top = 66, gap = 30;
  const avail = W - pad * 2 - gap * 2;
  let x = pad;
  return {
    W, H, vertical, headY: 30, footY: 374,
    panels: META.map((m, i) => {
      const w = Math.floor(avail * SHARE[i]);
      const box = { ...m, x, y: top, w, h: H - top - 62 };
      x += w + gap;
      return box;
    }),
  };
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width  = Math.round(r.width  * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  L = buildLayout(r.width, r.height);
  scale = Math.min(r.width / L.W, r.height / L.H);
  offX = (r.width  - L.W * scale) / 2;
  offY = (r.height - L.H * scale) / 2;
}
new ResizeObserver(resize).observe(cv);
resize();

/* ---------- 繪圖小工具 ---------- */
function text(s, x, y, { size = 12, weight = 400, color = '--ink',
                        font = 'sans', align = 'left', alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = C(color);
  ctx.font = `${weight} ${size}px ${font === 'mono' ? C('--mono') : C('--sans')}`;
  ctx.textAlign = align;
  ctx.fillText(s, x, y);
  ctx.restore();
}

function measure(s, size, font) {
  ctx.save();
  ctx.font = `400 ${size}px ${font === 'mono' ? C('--mono') : C('--sans')}`;
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}

// 面板內的繪圖區(扣掉標題列)
// 上緣留 64px 給面板標題與副標,避免與圖表的軸標籤擠在一起
const plotOf = p => ({ x: p.x + 16, y: p.y + 64, w: p.w - 32, h: p.h - 88 });

function panelChrome(p, state) {          // state: 0 未到 / 1 進行中 / 2 已完成
  ctx.save();
  ctx.strokeStyle = state === 1 ? C('--blue') : C('--line');
  ctx.globalAlpha = state === 1 ? 0.85 : state === 2 ? 0.55 : 0.35;
  ctx.lineWidth = state === 1 ? 1.5 : 1;
  ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 12); ctx.stroke();
  ctx.restore();

  const a = state ? 1 : 0.34;
  text(p.n, p.x + 15, p.y + 24, { size: 11, weight: 700, font: 'mono',
       color: state === 1 ? '--blue' : '--ink-3', alpha: a });
  text(p.t, p.x + 31, p.y + 24, { size: 12.5, weight: 700,
       color: state === 1 ? '--ink' : '--ink-2', alpha: a });
  text(p.s, p.x + 15, p.y + 41, { size: 9.5, font: 'mono', color: '--ink-3',
       alpha: state ? 0.95 : 0.3 });
}

function arrow(x1, y1, x2, y2, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = C('--ink-3'); ctx.fillStyle = C('--ink-3'); ctx.lineWidth = 1.4;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * 6, y2 - uy * 6); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ux * 7 - uy * 3.5, y2 - uy * 7 + ux * 3.5);
  ctx.lineTo(x2 - ux * 7 + uy * 3.5, y2 - uy * 7 - ux * 3.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 第 1 幕:相機模型 ----------
   統計出來的特性是「車速 → 有效視野距離」:
   低速時穩定在一個定值,超過約 40 kph 之後隨車速線性成長,
   而且有上下界。這條分段折線就是餵給模擬環境的相機模型。   */
const VMAX = 110, RMAX = 120, KNEE = 40;          // kph / m / 轉折車速

// 上下界(m):轉折前為定值,轉折後線性成長
function rangeAt(v, hi) {
  const flat = hi ? 42 : 30;
  if (v <= KNEE) return flat;
  const t = (v - KNEE) / (VMAX - KNEE);
  return flat + t * (hi ? 70 : 55);
}

function drawCamera(p, k) {
  const r = plotOf(p);
  const px = v => r.x + (v / VMAX) * r.w;            // 車速 → 畫布 x
  const py = m => r.y + r.h - (m / RMAX) * r.h;      // 距離 → 畫布 y

  // 格線與座標軸
  ctx.save();
  ctx.strokeStyle = C('--grid'); ctx.lineWidth = 1;
  for (const m of [40, 80, 120]) {
    ctx.beginPath(); ctx.moveTo(r.x, py(m)); ctx.lineTo(r.x + r.w, py(m)); ctx.stroke();
  }
  ctx.strokeStyle = C('--line'); ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(r.x, r.y); ctx.lineTo(r.x, r.y + r.h); ctx.lineTo(r.x + r.w, r.y + r.h);
  ctx.stroke();
  ctx.restore();

  for (const m of [40, 80]) {
    text(String(m), r.x - 4, py(m) + 3,
         { size: 8.5, font: 'mono', color: '--ink-3', align: 'right' });
  }
  text('有效視野距離 (m)', r.x, r.y - 6,
       { size: 9.5, font: 'mono', color: '--ink-3' });
  text('車速 (kph) →', r.x + r.w, r.y + r.h + 14,
       { size: 9.5, font: 'mono', color: '--ink-3', align: 'right' });

  // 實車量測散點
  const N = 420, shown = Math.floor(N * ease(k / 0.6));
  ctx.save();
  ctx.fillStyle = C('--green');
  for (let i = 0; i < shown; i++) {
    const v = rnd(i + 1) * VMAX;
    // 分佈:低速時集中在定值以下,轉折後跟著上界一起抬升
    const top = rangeAt(v, true) * 1.06;
    const m = top * (0.1 + 0.9 * Math.pow(rnd(i + 90), 0.75));
    ctx.globalAlpha = 0.14 + clamp((shown - i) / 40, 0, 1) * 0.34;
    ctx.beginPath(); ctx.arc(px(v), py(m), 1.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  const fit = ease((k - 0.48) / 0.44);
  if (fit <= 0) return;

  // 上下界之間的模型帶
  ctx.save();
  ctx.globalAlpha = fit * 0.16; ctx.fillStyle = C('--blue');
  ctx.beginPath();
  for (let v = 0; v <= VMAX; v += 5) ctx.lineTo(px(v), py(rangeAt(v, true)));
  for (let v = VMAX; v >= 0; v -= 5) ctx.lineTo(px(v), py(rangeAt(v, false)));
  ctx.closePath(); ctx.fill();

  // 上界(琥珀點劃線)與下界(藍虛線)
  for (const hi of [true, false]) {
    ctx.globalAlpha = fit;
    ctx.strokeStyle = hi ? C('--amber') : C('--blue');
    ctx.lineWidth = 1.8;
    ctx.setLineDash(hi ? [6, 3, 1.5, 3] : [5, 4]);
    ctx.beginPath();
    for (let v = 0; v <= VMAX; v += 2) ctx.lineTo(px(v), py(rangeAt(v, hi)));
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 轉折點
  ctx.globalAlpha = fit * 0.5;
  ctx.strokeStyle = C('--ink-3'); ctx.lineWidth = 1;
  ctx.setLineDash([2, 3]);
  ctx.beginPath();
  ctx.moveTo(px(KNEE), r.y + r.h); ctx.lineTo(px(KNEE), py(90));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // 兩個標註都放在低速側的上半部 —— 那塊區域沒有散點也沒有模型帶
  text('上下界折線 = 相機模型', r.x + 6, r.y + 12,
       { size: 10, font: 'mono', color: '--blue', alpha: fit });
  text('≈40 kph 起隨車速線性成長', px(KNEE) + 6, py(94),
       { size: 9, font: 'mono', color: '--ink-2', alpha: fit });
}

/* ---------- 第 2 幕:場景記錄 ----------
   本車座標系的累積圖,和實際工具的輸出同一個型式:

     原點 = 本車當下位置;x 為縱向,負值是已經過的路;y 為橫向
     綠線 × 4 = 逐幀累積的車道線 C0
     黑點     = 逐幀累積的物件位置(多目標,會中途進出視野)

   本車動態的補償已經反映在資料裡(所以線是平滑的,不是波浪),
   那一步寫在頁面文字裡,畫面只呈現結果。
   過彎時整條尾巴會相對現在的車頭甩出去 —— 這是本車座標系的必然,
   也正好說明累積是真的在世界座標下對齊過的。               */

// 預先算好一條路:曲率先小幅擺動,後段轉成持續彎道
const PATH = (() => {
  const N = 460, DS = 0.9, a = [];
  let x = 0, y = 0, th = 0;
  for (let i = 0; i < N; i++) {
    a.push({ x, y, th });
    const u = i / N;
    // 負號:讓累積的尾巴甩向 -y,落在畫布顯示的 y 範圍內
    const kappa = -(Math.sin(u * 7.5) * 0.0022 + (u > 0.45 ? (u - 0.45) * 0.0096 : 0));
    th += kappa * DS;
    x += Math.cos(th) * DS;
    y += Math.sin(th) * DS;
  }
  return a;
})();

const LANE_OFF = [-5.4, -1.8, 1.8, 5.4];            // m,四條車道線
const OBJS = [                                       // 物件:進出視野的時機不同
  { lead: 28, off:  0.2, from: 0.00, to: 1.00 },
  { lead: 46, off: -3.5, from: 0.34, to: 1.00 },
  { lead: 62, off:  3.4, from: 0.00, to: 0.62 },
];

// 世界座標 → 以第 c 個取樣點為原點的本車座標
function toEgo(px, py, c) {
  const o = PATH[c], dx = px - o.x, dy = py - o.y;
  const ct = Math.cos(o.th), st = Math.sin(o.th);
  return { x: dx * ct + dy * st, y: -dx * st + dy * ct };
}
// 沿路徑第 i 點、橫向偏移 off 的世界座標
function offsetPt(i, off) {
  const p = PATH[Math.max(0, Math.min(PATH.length - 1, i))];
  return { x: p.x - Math.sin(p.th) * off, y: p.y + Math.cos(p.th) * off };
}

// 沿路徑第 i 點往前看 d 公尺、橫向偏移 off 時,在本車座標系的位置
function aheadInEgo(cur, d, off) {
  const w = offsetPt(cur + Math.round(d / 0.9), off);
  return toEgo(w.x, w.y, cur);
}

/* --- 子畫面 A:當下場景(透視) ---
   投影刻意不是嚴格針孔:子畫面很窄,若橫縱用同一個焦距,
   近端十公尺處的三線道會整條溢出畫面。改成橫縱各自取焦距、
   近端從 12 m 起畫、視點抬高一些,才畫得出可讀的路。          */
function drawLive(r, cur) {
  const hz   = r.y + r.h * 0.28;                 // 地平線
  const cx   = r.x + r.w * 0.5;
  const FX   = r.w * 1.10, FY = r.h * 1.60;      // 橫向/縱向焦距
  const CAMH = 4.0, D0 = 9, D1 = 95;            // 視點高 / 近端 / 遠端
  const proj = (d, l) => ({ px: cx + (l / d) * FX, py: hz + (CAMH / d) * FY });
  const laneY = (d, off) => aheadInEgo(cur, d, off).y;

  ctx.save();
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.clip();

  ctx.fillStyle = '#dde5ee'; ctx.fillRect(r.x, r.y, r.w, hz - r.y);       // 天空
  ctx.fillStyle = '#ccd3cb'; ctx.fillRect(r.x, hz, r.w, r.y + r.h - hz);  // 路旁

  // 路面
  ctx.fillStyle = '#b7bec6';
  ctx.beginPath();
  for (let d = D1; d >= D0; d -= 2) { const q = proj(d, laneY(d, -6.2)); ctx.lineTo(q.px, q.py); }
  for (let d = D0; d <= D1; d += 2) { const q = proj(d, laneY(d,  6.2)); ctx.lineTo(q.px, q.py); }
  ctx.closePath(); ctx.fill();

  // 四條車道線,只畫到相機模型給的有效視野距離
  const VR = Math.min(D1, rangeAt(78, false));
  LANE_OFF.forEach(off => {
    const edge = Math.abs(off) > 3;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = edge ? 2.2 : 1.6;
    ctx.setLineDash(edge ? [] : [6, 7]);
    ctx.globalAlpha = edge ? 0.95 : 0.8;
    ctx.beginPath();
    for (let d = D0; d <= VR; d += 2) {
      const q = proj(d, laneY(d, off));
      ctx.lineTo(q.px, q.py);
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // 前方車輛:由遠而近畫,近的蓋住遠的
  OBJS.map(o => ({ o, d: o.lead * 0.9 }))
      .sort((a, b) => b.d - a.d)
      .forEach(({ o, d }) => {
        const u = cur / PATH.length;
        if (u < o.from || u > o.to || d < D0 || d > VR) return;
        const q = proj(d, laneY(d, o.off));
        const w = (2.0 / d) * FX, h = w * 0.85;
        ctx.fillStyle = '#454d59';
        ctx.beginPath();
        ctx.roundRect(q.px - w / 2, q.py - h, w, h, Math.max(1, w * 0.14));
        ctx.fill();
      });
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = C('--line'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
  ctx.restore();

  text('當下場景', r.x + 7, r.y + 13,
       { size: 8.5, font: 'mono', color: '--ink-2' });
}

/* --- 子畫面 B:累積圖(x 走水平、y 走垂直) --- */
function drawAccum(r, cur, k) {
  const XMIN = -200, YMIN = -100, YMAX = 20;
  // 本車在右,已經過的路往左延伸
  const G = (x, y) => ({
    px: r.x + r.w * (1 - x / XMIN),
    py: r.y + ((YMAX - y) / (YMAX - YMIN)) * r.h,
  });
  const seg = (ax, ay, bx, by) => {
    const a = G(ax, ay), b = G(bx, by);
    ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
  };

  ctx.save();
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();
  ctx.strokeStyle = C('--grid'); ctx.lineWidth = 1;
  for (const v of [-150, -100, -50]) seg(v, YMIN, v, YMAX);
  for (const v of [-80, -40, 0]) seg(XMIN, v, 0, v);
  ctx.strokeStyle = C('--line'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
  ctx.restore();

  const TRAIL = 235, lo = Math.max(0, cur - TRAIL);

  ctx.save();
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8); ctx.clip();

  ctx.strokeStyle = C('--green'); ctx.lineWidth = 1.4; ctx.globalAlpha = 0.9;
  for (const off of LANE_OFF) {
    ctx.beginPath();
    for (let i = lo; i <= cur; i += 2) {
      const w = offsetPt(i, off), e = toEgo(w.x, w.y, cur), q = G(e.x, e.y);
      ctx.lineTo(q.px, q.py);
    }
    ctx.stroke();
  }

  ctx.fillStyle = '#1d1d1f'; ctx.globalAlpha = 0.85;
  for (const o of OBJS) {
    const a = Math.max(lo, Math.floor(o.from * PATH.length));
    const b = Math.min(cur, Math.floor(o.to * PATH.length));
    for (let i = a; i <= b; i += 3) {
      const w = offsetPt(i + o.lead, o.off), e = toEgo(w.x, w.y, cur);
      if (e.x > 6) continue;
      const q = G(e.x, e.y);
      ctx.beginPath(); ctx.arc(q.px, q.py, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.globalAlpha = 1; ctx.fillStyle = C('--blue');
  const eg = G(0, 0);
  ctx.beginPath(); ctx.arc(eg.px, eg.py, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  text('逐幀累積', r.x + 7, r.y + 13, { size: 8.5, font: 'mono', color: '--ink-2' });
  text('x(m) →', r.x + r.w - 6, r.y + r.h - 7,
       { size: 8, font: 'mono', color: '--ink-3', align: 'right' });
  text('y(m)', r.x + 7, r.y + r.h - 7, { size: 8, font: 'mono', color: '--ink-3' });
}

function drawRecord(p, k) {
  const r = plotOf(p);
  const cur = Math.floor(60 + ease(clamp(k / 0.92, 0, 1)) * (PATH.length - 1 - 60));

  // 左右各一格(直排版面時左右仍然並排,因為面板本來就夠寬)
  const gap = 8, hw = (r.w - gap) / 2;
  drawLive({ x: r.x, y: r.y, w: hw, h: r.h }, cur);
  drawAccum({ x: r.x + hw + gap, y: r.y, w: hw, h: r.h }, cur, k);

  text('綠 = 車道線 C0 · 黑 = 物件 · 藍 = 本車', r.x, r.y + r.h + 13,
       { size: 8.5, font: 'mono', color: '--ink-3' });
  text('Time ' + (8.9 + (cur / PATH.length) * 17).toFixed(2),
       r.x + r.w, r.y + r.h + 13,
       { size: 8.5, font: 'mono', color: '--ink-2', align: 'right' });
}

/* ---------- 第 3 幕:場景合成 ---------- */
function drawScene(p, k, time) {
  const r = plotOf(p);
  const cx = r.x + r.w * 0.5;
  const bend = Math.min(40, r.w * 0.18);
  const lw = Math.min(30, r.w * 0.13);         // 車道半寬
  const laneAt = (t, lane) => cx + roadX(t, bend) + lane * lw;

  ctx.save();
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 10); ctx.clip();
  ctx.fillStyle = '#f2f3f5'; ctx.fillRect(r.x, r.y, r.w, r.h);

  // 車道線 —— 用相機模型的離散度加抖動:近處穩、遠處晃
  const app = ease(k / 0.45);
  for (const lane of [-1.5, -0.5, 0.5, 1.5]) {
    const edge = Math.abs(lane) > 1;
    ctx.globalAlpha = app * (edge ? 0.9 : 0.55);
    ctx.strokeStyle = edge ? C('--ink-2') : C('--ink-3');
    ctx.lineWidth = edge ? 2 : 1.4;
    ctx.setLineDash(edge ? [] : [7, 7]);
    ctx.beginPath();
    for (let s = 0; s <= 36; s++) {
      const t = s / 36;
      // 抖動依相機模型:視野距離內穩定,接近並超出有效距離才明顯晃動
      const noise = Math.sin(time * 2.4 + s * 0.8 + lane) * (0.05 + t * t * 0.5) * 9;
      ctx.lineTo(laneAt(t, lane) + noise, r.y + r.h * (1 - t));
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 合成車流
  const cars = [
    { lane: -1, base: 0.60, sp: 0.05, name: 'A' },
    { lane:  0, base: 0.78, sp: 0.03, name: 'B' },
    { lane:  1, base: 0.44, sp: 0.07, name: 'C' },
  ];
  const carIn = ease((k - 0.3) / 0.4);
  cars.forEach((c, i) => {
    const a = clamp(carIn * 3 - i, 0, 1);
    if (a <= 0) return;
    const t = (c.base + time * c.sp) % 0.86 + 0.08;
    const px = laneAt(t, c.lane), py = r.y + r.h * (1 - t);
    const sc = (0.55 + t * 0.55) * Math.min(1, r.w / 220);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#5b6472';
    ctx.beginPath();
    ctx.roundRect(px - 7 * sc, py - 12 * sc, 14 * sc, 24 * sc, 3.5 * sc);
    ctx.fill();
    ctx.globalAlpha = a * 0.9;
    text(c.name, px, py - 16 * sc, { size: 9, weight: 700, font: 'mono',
         color: '--ink-2', align: 'center' });
  });

  ctx.globalAlpha = app;
  ctx.fillStyle = C('--blue');
  const ex = laneAt(0.06, 0), ey = r.y + r.h * 0.94;
  ctx.beginPath(); ctx.roundRect(ex - 8, ey - 13, 16, 26, 4); ctx.fill();
  ctx.restore();

  text('本車', ex, r.y + r.h + 14,
       { size: 10, weight: 700, color: '--blue', align: 'center', alpha: app });
}

/* ---------- 主迴圈 ---------- */
// 第二幕有記錄/補償/路型三段,給它比較長的時間
const T1 = 3.2, T2 = 8.4, T3 = 13.4, TEND = 15.6;
const t0 = performance.now();

function frame(now) {
  const time = ((now - t0) / 1000) % TEND;
  const act = time < T1 ? 0 : time < T2 ? 1 : 2;
  const P = L.panels;

  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.clearRect(0, 0, L.W, L.H);
  ctx.fillStyle = C('--bg'); ctx.fillRect(0, 0, L.W, L.H);

  text('資料驅動的車道線模擬環境', 22, L.headY, { size: 15, weight: 700 });
  text('自研 MATLAB 腳本 · 用 Mini-FOT 實車資料建模,而非人工造場景',
       22, L.headY + 18, { size: 11, color: '--ink-2' });

  P.forEach((p, i) => panelChrome(p, i === act ? 1 : i < act ? 2 : 0));

  drawCamera(P[0], act === 0 ? clamp(time / T1, 0, 1) : 1);
  if (act >= 1) drawRecord(P[1], act === 1 ? clamp((time - T1) / (T2 - T1), 0, 1) : 1);
  if (act >= 2) drawScene(P[2], clamp((time - T2) / (T3 - T2), 0, 1), time);

  // 面板之間的箭頭:橫排指右、直排指下
  for (let i = 0; i < 2; i++) {
    const a = clamp((time - (i ? T2 : T1) + 0.5) * 2, 0, 1);
    if (L.vertical)
      arrow(P[i].x + P[i].w / 2, P[i].y + P[i].h + 3,
            P[i].x + P[i].w / 2, P[i + 1].y - 3, a);
    else
      arrow(P[i].x + P[i].w + 8, P[i].y + P[i].h / 2,
            P[i + 1].x - 8, P[i].y + P[i].h / 2, a);
  }

  const fin = ease((time - T3 + 0.6) / 1.1);
  if (fin > 0) {
    ctx.save();
    ctx.globalAlpha = fin * 0.6;
    ctx.strokeStyle = C('--line');
    ctx.beginPath();
    ctx.moveTo(22, L.footY - 22); ctx.lineTo(L.W - 22, L.footY - 22);
    ctx.stroke();
    ctx.restore();

    const tail = '個問題以此定位與驗證';
    if (L.vertical) {
      text('路上只發生一次的狀況,這裡可以重跑、也可以生成變體', 22, L.footY - 4,
           { size: 11, weight: 600, alpha: fin });
      const nw = measure('50+', 15, 'mono');
      text('50+', 22, L.footY + 16, { size: 15, weight: 700, font: 'mono',
           color: '--blue', alpha: fin });
      text(tail, 26 + nw, L.footY + 16,
           { size: 11, color: '--ink-2', alpha: fin });
    } else {
      text('路上只發生一次的狀況,在這裡可以重跑、也可以改參數生成變體', 22, L.footY,
           { size: 12, weight: 600, alpha: fin });
      const tw = measure(tail, 11, 'sans');
      text(tail, L.W - 22, L.footY, { size: 11, color: '--ink-2',
           align: 'right', alpha: fin });
      text('50+', L.W - 26 - tw, L.footY, { size: 17, weight: 700, font: 'mono',
           color: '--blue', align: 'right', alpha: fin });
    }
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
