<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同一把尺，兩顆相機 — View Range 差異如何決定 Fusion 邏輯</title>
<style>
  :root{
    --bg:#fbfcfd;--bg-alt:#f5f7f9;--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#86868b;--line:#d2d2d7;
    --grid:#eaeef3;
    /* 兩顆相機的類別色。刻意避開 --amber/--green:fot_analysis 那張
       「有效視野」已經用 amber=上界、green=實車量測,同一頁上同色不同義
       會讓人以為兩張圖在講同一件事。blue 與 magenta 在這幾張面板裡
       沒有被指派過語意,而且兩者的色覺異常距離夠。 */
    --camA:#0071e3;--camB:#a3277a;
    /* 左圖的散點沿用 fot_analysis 的 --green(#0a8a5c)。那裡 green 就是
       「實車量測」,這裡也是同一個意思 —— 同色同義,反而是接得起來的線索。*/
    --meas:#0a8a5c;
    --sans:"SF Pro TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
/* ============================================================
   同一把尺,兩顆相機 — View Range 差異如何決定 Fusion 邏輯

   ---- 為什麼是現在這個版面(一張卡,圖在上、表在下) ----

   資料本來就是 2x2:兩顆相機 x 兩個速域。最早的版本把文字拆成圖上
   四個角的浮出方塊,等於把一張表打散成四塊各自漂浮;之後改成
   「圖在上、表在下」,動線是對的,但整張變得又高又窄,圖與表隔了
   半個畫面,讀者要記著曲線再往下找對應的那一列。

   之後改成橫向兩張卡並排(左圖右表),動線是對的,但表被寬度綁死:
   920 的畫布分掉左卡之後,右卡內寬只剩 464,再扣掉列名欄,每欄
   只有 190 —— 字級卡在 11px 還是有兩格會斷成三行。字小又長短不一,
   看起來就是亂的。

   ---- 上半部為什麼是兩塊圖 ----

   右邊那條乾淨的折線,單看會像是規格書上抄來的。左邊補一塊原始量測
   的散點、中間一個「擬合」箭頭,讀者才看得出這條線是從一團很吵的點
   裡量出來的 —— 這一節導言講的就是「這些規律沒有人會給,是我一段
   一段量、擬合成公式的」,兩塊圖就是那句話的圖解。

   所以繞回「圖在上、表在下」,但這次成立,因為表已經瘦下來了:
   當初否決這個版面是因為那時每格有長條、數值、「?」籤,四格疊起來
   又高又窄,圖和表隔了半個畫面。現在每格只有兩行字,整張表約 140 高,
   圖和表緊鄰,當初的理由不成立了。
   表拿到整個 828 內寬,每欄 360,四格全部「一行現象、一行對策」,
   字級推到 14 —— 比並排時大 27%,而且零斷行。
     · 技術長讀表比讀圖快,他要的是「所以決策規則是什麼」,
       表自己就站得住,圖只是它的來源;
     · 由上而下就是證據 → 結論,不必記著曲線再左右對照。

   ---- 右卡為什麼只剩文字 ----

   右卡本來每格都有一條兩段式長條和一個數值(30 m / 105 m ...),
   加上速域抬頭的「差 N m」籤,一格裡有四種東西在講同一件事:
   誰遠、遠多少。可是「遠多少」左邊那張圖已經用填色面積講完了,
   右卡再畫一次長條,等於同一個結論畫兩遍,而右卡真正該回答的
   「所以要怎麼接」反而被擠成最小的一行字。
   現在右卡只留四格「現象 → 對策」,兩欄就是兩顆相機(表頭的圖例
   同時是欄頭),兩列就是兩個速域。數字全部留在左卡,右卡只講決策。

   ---- 左卡為什麼只剩圖 ----

   左卡本來有標題「同一把尺，兩顆相機」、一句副標、和一句結語
   「評估一顆新相機要怎麼接,看這張圖就夠」。這三句話 lfs01.html 的
   圖說(.ldemo-cap)一字不差地又講了一次 —— 這張面板是嵌在那句圖說
   正上方的 iframe,同一個畫面裡連講兩遍。留給圖說,面板只出示證據。
   標題沒了之後圖直接依卡片高度置中,順便放大到 250 高。

   圖上只剩四樣東西:兩條曲線、兩塊差距填色、兩個速域標籤、座標軸。
   差距不再用雙箭頭加白底標籤畫 —— 直接把兩條曲線之間的區域填起來,
   那塊面積本身就是差距,一個元素做完兩件事,而且面積大小自己會說話
   (高速那塊明顯比低速厚)。

   ⚠ 數值狀態:
     Camera A 的曲線沿用 fot_analysis「有效視野」那條模型(低速定值、
     約 40 kph 後線性成長)。
     Camera B 是對照組,目前是示意值 —— 要換成實測,改 CAM 裡的
     lo / hi / knee 即可,曲線、填色、速域標籤上的差值全部跟著算。
     (表不再印數值,所以沒有第二處要手動同步的地方。)
     左邊那塊散點也是示意(照真實形狀畫的,不是原始檔),圖上有標。
     手邊若有那張 matplotlib 原圖,換成圖片會比畫的更有說服力。

   靜態圖,不做動畫 —— 只在改視窗大小或字體載完時重畫。
   ============================================================ */

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const CSS = getComputedStyle(document.documentElement);
const C = n => CSS.getPropertyValue(n).trim();
const col = v => v.startsWith('--') ? C(v) : v;

/* ---------- 資料 ---------- */
const VMAX = 120, RMAX = 120;          // 車速上限 (kph) / 可用距離上限 (m)

/* 兩個速域 = 表格的兩列。range 同時決定圖上填色的範圍與表格的列名,
   兩邊用同一組數字與同一個詞,讀者才連得起來「表的這一列 = 圖的那一塊」。

   ⚠ at 是這一段的代表速度,圖上那塊填色標的「差 N m」由它算。它要取
   這一段裡最能代表差距的速度 —— 高速段兩條曲線在 120 kph 差最開,
   所以 at 寫 120,不是中間值。 */
const BAND = [
  { k: '低速', range: [0, 40],   at: 20  },
  { k: '高速', range: [90, 120], at: 120 },
];

/* 每顆相機一條分段折線:knee 之前是定值 lo,之後線性長到 hi。
   兩顆用同一個 knee,差別全在 lo/hi —— B 的 lo 高、hi 低,所以整條
   幾乎是平的,那正是它的特徵:低速就報得遠,高速卻沒跟著長。
   reads 依速域排列,順序必須和 BAND 一致(表格照這個順序畫)。 */
const CAM = [
  {
    name: 'ADAS Camera A', k: 'A', c: '--camA', lo: 30, hi: 105, knee: 40,
    reads: [
      { t: '視距短，車道線尾端不穩',
        fix: '依 Lane Degrade 受控降階，治「不穩」' },
      { t: '報得遠 —— 像素真的看得到這麼遠？', q: true,
        fix: '依有效視野上界截斷，超過不進融合' },
    ],
  },
  {
    name: 'ADAS Camera B', k: 'B', c: '--camB', lo: 55, hi: 60, knee: 40,
    reads: [
      { t: '報得遠但不準，S 彎易「切西瓜」',
        fix: '遠端降權，並用周圍車輛交叉驗證' },
      { t: '視距沒跟著長 —— 橫向 ODD 夠嗎？', q: true,
        fix: '橫向 ODD 限速' },
    ],
  },
];

const rangeAt = (cam, v) =>
  v <= cam.knee ? cam.lo : cam.lo + (v - cam.knee) / (VMAX - cam.knee) * (cam.hi - cam.lo);

// 速域標籤上的差值由這裡算,不寫死
const gapAt = v => Math.abs(rangeAt(CAM[0], v) - rangeAt(CAM[1], v));

/* ---------- 版面 ---------- */
let L = null, scale = 1, offX = 0, offY = 0;

/* 兩套尺寸,同一個版面 —— 圖在上、表在下,而表永遠是 A/B 兩欄並排。

   以前窄的時候會換成「一顆相機一組」的直排,A 疊在 B 上面。那個備援
   拿掉了:這張圖的主張是「同一個速域下 A 和 B 不一樣」,一旦上下疊,
   要比較的兩格就不在同一個視線高度上,得靠記憶對照 —— 版面把論點
   拆散了。窄的時候寧可整組縮一階(字級、欄寬、行距一起降),欄位關係
   不動。 */
const SIZES = {
  wide:   { W: 920, H: 510, pad: 22, inset: 24,
            panelW: 356, arrowW: 56, yLab: 40, titleY: 48, chartTop: 76, plotH: 140,
            gutter: 84, colGap: 24, fs: 14, lh: 20, nameFs: 13.5, keyFs: 13.5,
            rangeFs: 10, rangeDy: 16, fixDy: 9, sepDy: 18, bandGap: 30,
            arrowX: 18, panelFs: 11.5, tickFs: 9 },
  narrow: { W: 400, H: 520, pad: 16, inset: 16,
            panelW: 146, arrowW: 36, yLab: 28, titleY: 36, chartTop: 58, plotH: 108,
            gutter: 52, colGap: 12, fs: 10, lh: 14, nameFs: 10.5, keyFs: 11,
            rangeFs: 8.5, rangeDy: 12, fixDy: 6, sepDy: 12, bandGap: 20,
            arrowX: 13, panelFs: 9, tickFs: 7.5 },
};

function buildLayout(cssW, cssH) {
  /* 1.15 是換窄版的門檻。比這更瘦時,寬版會被 scale 縮到字看不清 ——
     窄版的設計尺寸小,同一個容器裡 scale 反而接近 1,字比較大。 */
  const S = cssW / cssH < 1.15 ? SIZES.narrow : SIZES.wide;
  const { W, H, pad } = S;

  const card = { x: pad, y: pad, w: W - pad * 2, h: H - pad * 2 };
  const ci = card.x + S.inset, cw = card.w - S.inset * 2;  // 卡內緣 / 內寬

  /* 上半部是兩塊等寬的圖,中間一個箭頭:左邊原始量測、右邊擬合出來的
     模型。兩塊加箭頭置中在卡片內寬裡,左右各留一樣的邊。 */
  const blockW = S.panelW * 2 + S.arrowW;
  const bx     = ci + (cw - blockW) / 2;
  const panels = [bx, bx + S.panelW + S.arrowW];
  const mk     = x => ({ x: x + S.yLab, y: S.chartTop, w: S.panelW - S.yLab, h: S.plotH });

  // 圖底 → 軸名 → 分隔線 → 圖例 → 表頭橫線 → 第一列,由上而下依序長出來
  const plotBot  = S.chartTop + S.plotH;
  const axisY    = plotBot + Math.round(S.lh * 1.6);
  const dividerY = axisY + Math.round(S.lh * 1.2);
  const headY    = dividerY + Math.round(S.lh * 1.7);
  const ruleY    = headY + Math.round(S.lh * 0.7);
  const colW     = (cw - S.gutter - S.colGap) / 2;

  return {
    W, H, pad, card, ci, cw,
    // [0] = 原始量測(散點),[1] = 擬合後的模型(曲線)
    plots: [mk(panels[0]), mk(panels[1])],
    panels, panelW: S.panelW, panelFs: S.panelFs, tickFs: S.tickFs,
    titleY: S.titleY,
    arrow: { x0: bx + S.panelW, x1: bx + S.panelW + S.arrowW,
             y: S.chartTop + S.plotH / 2 },
    axisY,
    dividerY,                                             // 圖與表之間那條線
    /* 表是一個矩陣:最左邊一條窄欄放列名(低速/高速),右邊兩欄是兩顆
       相機,欄頭就是表頭那兩個色塊,所以欄的 x 和圖例的 x 同一組。

       gutter 是列名那一欄的寬度:「90–120 kph」最長,寬版 10px mono
       約 55px,留 84 才不會頂到欄的起點。剩下的均分成兩欄。
       divX 落在 gutter 裡偏右(-12),靠內容欄近一點,線才像是欄的左
       邊界而不是漂在中間。 */
    table: {
      x: ci, w: cw, headY, ruleY,
      cols: [ci + S.gutter, ci + S.gutter + colW + S.colGap],
      cw: colW, divX: ci + S.gutter - 12,
      top: ruleY + Math.round(S.lh * 1.5),
      nameFs: S.nameFs, keyFs: S.keyFs, rangeFs: S.rangeFs, rangeDy: S.rangeDy,
      fixDy: S.fixDy, sepDy: S.sepDy, bandGap: S.bandGap,
      // arrowX:「→」單獨畫在欄的起點,對策文字往後縮排 —— 四個箭頭
      // 對齊成一條直線,而且對策若斷行,第二行也不會跑到箭頭底下。
      arrowX: S.arrowX, fs: S.fs, lh: S.lh,
    },
  };
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width  = Math.round(r.width  * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  L = buildLayout(r.width, r.height);
  scale = Math.min(r.width / L.W, r.height / L.H);
  offX = (r.width  - L.W * scale) / 2;
  offY = (r.height - L.H * scale) / 2;
}

/* ---------- 繪圖小工具 ---------- */
function text(s, x, y, { size = 12, weight = 400, color = '--ink',
                        font = 'sans', align = 'left' } = {}) {
  ctx.save();
  ctx.fillStyle = col(color);
  ctx.font = `${weight} ${size}px ${font === 'mono' ? C('--mono') : C('--sans')}`;
  ctx.textAlign = align;
  ctx.fillText(s, x, y);
  ctx.restore();
}

function measure(s, size, font, weight = 400) {
  ctx.save();
  ctx.font = `${weight} ${size}px ${font === 'mono' ? C('--mono') : C('--sans')}`;
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}

// 中日文沒有空格可斷,逐字量寬度換行。回傳畫了幾行。
function wrap(s, x, y, maxW, lh, opt = {}) {
  let line = '', n = 0;
  const flush = () => { if (line) { text(line, x, y + n * lh, opt); n++; line = ''; } };
  for (const ch of s) {
    if (measure(line + ch, opt.size || 12, opt.font, opt.weight || 400) > maxW) flush();
    line += ch;
  }
  flush();
  return n;
}

// 只算會斷成幾行,不畫。用來讓同一列兩欄的「對策」對齊同一條基線。
function lineCount(s, maxW, opt = {}) {
  let line = '', n = 0;
  for (const ch of s) {
    if (measure(line + ch, opt.size || 12, opt.font, opt.weight || 400) > maxW) { n++; line = ''; }
    line += ch;
  }
  return line ? n + 1 : n;
}

/* 斷行後不要留孤字。表格欄寬固定,常常只差一兩個字就滿出去,
   照 maxW 直接斷會變成第二行只剩「合」一個字。作法:先看照 maxW
   會斷成幾行,再往內縮到「還是同樣行數」的最小寬度去斷 —— 行數
   不變,但每行長度接近,看起來就是刻意排的兩行。 */
function wrapBalanced(s, x, y, maxW, lh, opt = {}) {
  let w = maxW;
  const n = lineCount(s, maxW, opt);
  if (n > 1) {
    let lo = 1, hi = maxW;
    while (hi - lo > 1) {
      const mid = (lo + hi) / 2;
      if (lineCount(s, mid, opt) <= n) hi = mid; else lo = mid;
    }
    w = hi;
  }
  return wrap(s, x, y, w, lh, opt);
}

// 卡片:白底 + 髮絲邊。底色 --bg 只比白暗一階,靠邊線把兩張分開。
function card(r) {
  ctx.save();
  ctx.beginPath(); ctx.roundRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1, 14);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.globalAlpha = .7; ctx.strokeStyle = C('--line'); ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function rrect(x, y, w, h, r, fill, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col(fill);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  ctx.restore();
}

function hline(x0, x1, y, color, w, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col(color); ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.restore();
}

function vline(x, y0, y1, color, w, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col(color); ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  ctx.restore();
}

/* ---------- 圖 ----------
   px / py 都吃一個 plot 矩形:同一組函式要畫兩塊圖(左邊原始量測、
   右邊擬合模型),兩塊共用同一組 0–VMAX / 0–RMAX 的刻度。 */
const px = (p, v) => p.x + (v / VMAX) * p.w;
const py = (p, m) => p.y + p.h - (m / RMAX) * p.h;

function drawAxes(p, tickFs) {
  ctx.save();
  ctx.strokeStyle = C('--grid'); ctx.lineWidth = 1;
  for (const m of [40, 80, 120]) {
    ctx.beginPath();
    ctx.moveTo(p.x, py(p, m)); ctx.lineTo(p.x + p.w, py(p, m)); ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = C('--line'); ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.h); ctx.lineTo(p.x + p.w, p.y + p.h);
  ctx.stroke();
  ctx.restore();

  for (const m of [40, 80, 120]) {
    text(String(m), p.x - 6, py(p, m) + 3.5,
         { size: tickFs, font: 'mono', color: '--ink-3', align: 'right' });
  }
  for (const v of [0, 40, 80, 120]) {
    text(String(v), px(p, v), p.y + p.h + 14,
         { size: tickFs, font: 'mono', color: '--ink-3', align: 'center' });
  }
  text('View Range (m)', p.x - 6, p.y - 9,
       { size: tickFs + .5, font: 'mono', color: '--ink-3' });
  text('車速 (kph) →', p.x, L.axisY,
       { size: tickFs + .5, font: 'mono', color: '--ink-3' });
}

/* ---------- 左圖:原始量測 ----------
   ⚠ 這裡的散點是「示意」,不是實測檔案。真實的那張是逐幀 View Range
   對車速的散佈圖(每顆相機各一張),形狀就是這樣:轉折速度以下貼著
   一條定值、以上跟著上界一起抬,而且整片很吵。這張的用途是讓讀者
   看見「右邊那條乾淨的曲線是從這一團點擬合出來的」,所以只要形狀
   對,不必是原檔 —— 但也因此左上角標了「示意」。

   綠點 = 實車量測、琥珀點劃線 = 上界、藍虛線 = 下界,三個都沿用
   fot_analysis 那張「有效視野」的色與義,兩張圖才接得起來。 */
const rnd = i => { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); };

function drawScatter(p) {
  const cam = CAM[0];                      // 左圖只畫一顆:一顆相機一張原始圖
  const hi  = v => rangeAt(cam, v) * 1.18; // 上界
  const lo  = v => rangeAt(cam, v) * 0.55; // 下界

  ctx.save();
  ctx.fillStyle = C('--meas'); ctx.globalAlpha = .38;
  for (let i = 1; i <= 420; i++) {
    const v = rnd(i) * VMAX;
    // 點集中在上下界之間,再讓少數往下漏 —— 真實資料的長尾在下面
    const t = Math.pow(rnd(i + 517), 0.8);
    const m = lo(v) * (1 - t) + hi(v) * t - (rnd(i + 91) < .12 ? rnd(i + 33) * 22 : 0);
    if (m <= 0) continue;
    ctx.beginPath(); ctx.arc(px(p, v), py(p, Math.min(m, RMAX)), 1.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.lineWidth = 1.6;
  for (const [f, c, dash] of [[hi, '--amber', [6, 3, 1.5, 3]], [lo, '--camA', [5, 4]]]) {
    ctx.strokeStyle = C(c); ctx.setLineDash(dash);
    ctx.beginPath();
    for (let v = 0; v <= VMAX; v += 2) ctx.lineTo(px(p, v), py(p, Math.min(f(v), RMAX)));
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

/* 差距填色:直接把兩條曲線之間的區域填起來,那塊面積本身就是差距。
   前一版用雙箭頭 + 白底數字標籤畫同一件事,兩個元素、還會壓到曲線。 */
function drawGap(band, p) {
  const [v0, v1] = band.range;
  ctx.save();
  ctx.globalAlpha = .13;
  ctx.fillStyle = C('--ink-3');
  ctx.beginPath();
  for (let v = v0; v <= v1; v += 2) ctx.lineTo(px(p, v), py(p, rangeAt(CAM[0], v)));
  for (let v = v1; v >= v0; v -= 2) ctx.lineTo(px(p, v), py(p, rangeAt(CAM[1], v)));
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // 標籤放在填色區上緣。用的詞和表格列名一致 —— 那是讀者把
  // 「表的這一列」接回「圖的那一塊」的唯一線索。
  /* 標籤要避開的是「它自己那一段 x 範圍內」的曲線最高點:
     取整段最高點,高速那個標籤會飄在填色區上方很遠;只取左緣那一點,
     斜著爬上去的 A 曲線會從字中間穿過去。所以量標籤實際蓋到的
     速度區間,在那一段裡取最高的曲線再往上讓 8px。 */
  const fs = L.tickFs + 1;
  const s = `${band.k}  差 ${Math.round(gapAt(band.at))} m`;
  const lx = px(p, v0) + 5;
  const lv1 = ((lx + measure(s, fs, 'mono', 700)) - p.x) / p.w * VMAX;
  let top = Infinity;
  for (let v = v0; v <= Math.min(lv1, v1); v += 1)
    for (const c of CAM) top = Math.min(top, py(p, rangeAt(c, v)));
  text(s, lx, top - 8, { size: fs, weight: 700, font: 'mono', color: '--ink-2' });
}

function drawCurve(cam, p) {
  ctx.save();
  ctx.strokeStyle = C(cam.c); ctx.lineWidth = 2.6;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let v = 0; v <= VMAX; v += 1.5) ctx.lineTo(px(p, v), py(p, rangeAt(cam, v)));
  ctx.stroke();
  ctx.fillStyle = C(cam.c);
  ctx.beginPath(); ctx.arc(px(p, VMAX), py(p, cam.hi), 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* 兩塊圖中間的箭頭:左邊是量到的,右邊是擬合出來的。箭頭上那行字
   就是這張面板要講的動作 —— 「分速域統計、擬合」。 */
function drawArrow() {
  const a = L.arrow, mid = (a.x0 + a.x1) / 2, w = (a.x1 - a.x0) * .52;
  ctx.save();
  ctx.strokeStyle = C('--ink-3'); ctx.globalAlpha = .75;
  ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(mid - w / 2, a.y); ctx.lineTo(mid + w / 2, a.y);
  ctx.moveTo(mid + w / 2 - 5, a.y - 4.5);
  ctx.lineTo(mid + w / 2, a.y);
  ctx.lineTo(mid + w / 2 - 5, a.y + 4.5);
  ctx.stroke();
  ctx.restore();
  text('擬合', mid, a.y - 12,
       { size: L.panelFs - 1.5, weight: 700, color: '--ink-3', align: 'center' });
}

// 每塊圖的抬頭。左邊多一個「示意」小籤 —— 那團點是照真實形狀畫的,
// 不是原始檔本身,不標的話會被當成真的量測輸出。
function drawPanelHeads() {
  const [a, b] = L.panels, fs = L.panelFs;
  text('原始量測 · 逐幀 View Range', a, L.titleY, { size: fs, weight: 700 });
  const nx = a + measure('原始量測 · 逐幀 View Range', fs, 'sans', 700) + 8;
  const nw = measure('示意', fs - 2.5, 'sans', 700) + 10;
  rrect(nx, L.titleY - fs + 1, nw, fs + 3, 3, '--bg-alt');
  text('示意', nx + nw / 2, L.titleY,
       { size: fs - 2.5, weight: 700, color: '--ink-3', align: 'center' });
  text('擬合後的相機模型', b, L.titleY, { size: fs, weight: 700 });
}

/* ---------- 表:2x2 的「現象 → 對策」 ----------
   兩欄是兩顆相機,兩列是兩個速域,格子裡只有一句現象和一句對策。
   數值與長條都不在這裡了 —— 「誰遠、差多少」上面那張圖的填色面積
   已經講完,表只回答「所以要怎麼接」。

   速域是「列」,所以列名放在最左邊自成一欄,和欄頭(A/B)構成一個
   真正的矩陣 —— 抬頭橫跨兩欄的寫法看起來像是把表切成兩段,讀者會
   以為那是兩張小表。列名原本還跟著一個「差 N m」籤,拿掉了 ——
   那個數字在圖的填色區上已經有一份,同一張面板印兩次沒有加分。 */
function drawTable() {
  const T = L.table;

  // 表頭的色塊同時是兩個東西:圖的圖例、下面這兩欄的欄頭。
  // 起點對齊欄的起點(不是卡片內緣)—— 最左邊那條窄欄留給列名。
  CAM.forEach((cam, i) => {
    const x = T.cols[i], s = Math.round(T.nameFs * .75);
    rrect(x, T.headY - s, s, s, 2, cam.c);
    text(cam.name, x + s + 7, T.headY, { size: T.nameFs, weight: 700, color: cam.c });
  });
  hline(T.x, T.x + T.w, T.ruleY, '--line', 1);

  const fopt = { size: T.fs, weight: 600 };
  const fw   = T.cw - T.arrowX;          // 對策的可用寬度(扣掉箭頭那格縮排)

  let y = T.top, last = T.top;
  BAND.forEach((band, r) => {
    // 列名:速域 + 速度範圍,疊成兩行放在最左欄。基線跟這一列的第一
    // 行字對齊 —— 列名和它管的內容要從同一條線起跑,才讀得出是同一列。
    text(band.k, T.x, y, { size: T.keyFs, weight: 700 });
    text(`${band.range[0]}–${band.range[1]} kph`, T.x, y + T.rangeDy,
         { size: T.rangeFs, font: 'mono', color: '--ink-3' });

    /* 同一列的兩欄,「→ 對策」從同一條基線起跑。各接各的話,現象多
       一行的那一欄會把自己的對策往下推,兩欄的箭頭錯開一行 —— 四個
       箭頭沒站成兩排,掃過去就是亂的。取兩欄現象的最大行數當起跑點。*/
    const tn = Math.max(...CAM.map(cam =>
      lineCount(cam.reads[r].t, T.cw, { size: T.fs })));
    const fy = y + tn * T.lh + T.fixDy;

    let bot = fy;
    CAM.forEach((cam, i) => {
      const d = cam.reads[r], x = T.cols[i];
      // 帶問號的那格用更淡的字:它是要回去問供應商的,不是已成立的結論。
      // 「?」小籤拿掉了 —— 句子本身就以問號結尾,籤是同一件事講第二次。
      wrapBalanced(d.t, x, y, T.cw, T.lh,
                   { size: T.fs, color: d.q ? '--ink-3' : '--ink-2' });
      // 箭頭單獨畫、文字縮排:斷行時第二行不會滑到箭頭底下。
      text('→', x, fy, fopt);
      const fn = wrapBalanced(d.fix, x + T.arrowX, fy, fw, T.lh, fopt);
      bot = Math.max(bot, fy + (fn - 1) * T.lh);
    });

    last = bot;
    if (r < BAND.length - 1) {
      hline(T.x, T.x + T.w, bot + T.sepDy, '--line', 1, .6);
      y = bot + T.sepDy + T.bandGap;
    }
  });

  /* 列名欄和內容欄之間的直線。橫線分列、直線分欄,兩條加起來讀者才
     看得出這是一個矩陣,而不是兩疊各自的清單。從表頭橫線拉到最後一
     列下面 —— 只圈住格子的範圍,不碰到圖例那一行。 */
  vline(T.divX, T.ruleY, last + 12, '--line', 1, .55);
}

/* ---------- 畫一次 ---------- */
function draw() {
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.clearRect(0, 0, L.W, L.H);
  ctx.fillStyle = C('--bg'); ctx.fillRect(0, 0, L.W, L.H);

  card(L.card);
  // 圖與表之間的分隔線:上面是證據,下面是結論。
  hline(L.ci, L.ci + L.cw, L.dividerY, '--line', 1, .6);

  const [raw, fit] = L.plots;
  drawPanelHeads();
  drawAxes(raw, L.tickFs);
  drawScatter(raw);
  drawArrow();
  drawAxes(fit, L.tickFs);
  BAND.forEach(b => drawGap(b, fit));
  CAM.forEach(c => drawCurve(c, fit));
  drawTable();

  ctx.restore();
}

new ResizeObserver(() => { resize(); draw(); }).observe(cv);
resize();
draw();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>
</body>
</html>
