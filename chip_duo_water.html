
<div style="display:flex;justify-content:center;gap:48px;padding:32px 16px;flex-wrap:wrap;align-items:center;">

  <!-- LEFT: overflow chip + text -->
  <div style="display:flex;flex-direction:row;align-items:center;gap:20px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <canvas id="c_left" width="160" height="160" style="border-radius:16px;"></canvas>
      <div style="text-align:center;">
        <div id="left-pct" style="font-size:22px;font-weight:500;font-family:monospace;color:#ef4444;">110%</div>
        <div style="font-size:11px;color:var(--text-muted);">OVERFLOW</div>
      </div>
    </div>
    <div style="max-width:160px;">
      <div style="font-size:13px;font-weight:600;color:#ef4444;line-height:1.5;margin-bottom:6px;">ADAS 功能越來越多</div>
      <div style="font-size:13px;color:#6b7280;line-height:1.6;">導致 CPU 運算量爆掉</div>
    </div>
  </div>

  <!-- RIGHT: normal chip + text -->
  <div style="display:flex;flex-direction:row;align-items:center;gap:20px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <canvas id="c_right" width="160" height="160" style="border-radius:16px;"></canvas>
      <div style="text-align:center;">
        <div id="right-pct" style="font-size:22px;font-weight:500;font-family:monospace;color:#10b981;">37%</div>
        <div style="font-size:11px;color:var(--text-muted);">NORMAL</div>
      </div>
    </div>
    <div style="max-width:160px;">
      <div style="font-size:13px;font-weight:600;color:#10b981;line-height:1.5;margin-bottom:6px;">新架構整合一體化開發</div>
      <div style="font-size:13px;color:#6b7280;line-height:1.6;">運算量降至 <span style="font-weight:700;color:#10b981;">37%</span></div>
    </div>
  </div>

</div>

<script>
(function() {

  function drawChipShell(ctx, overflowFlash) {
    const W = 160, H = 160;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.roundRect(0, 0, W, H, 16); ctx.fill();

    ctx.strokeStyle = '#c8d0dc';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    [30, 46, 62, 80, 98, 114, 130].forEach(p => {
      ctx.beginPath(); ctx.moveTo(p, 6);   ctx.lineTo(p, 22);  ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, 138); ctx.lineTo(p, 154); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6, p);   ctx.lineTo(22, p);  ctx.stroke();
      ctx.beginPath(); ctx.moveTo(138, p); ctx.lineTo(154, p); ctx.stroke();
    });

    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = overflowFlash ? `rgba(239,68,68,${overflowFlash})` : '#dde3ec';
    ctx.lineWidth = overflowFlash ? 3 : 1.5;
    ctx.beginPath(); ctx.roundRect(22, 22, 116, 116, 8); ctx.fill(); ctx.stroke();
  }

  function drawWater(ctx, pct, waterColor, waveColor, waveOffset) {
    const bodyBot = 136, bodyH = 112;
    const waterTopY = bodyBot - Math.min(pct, 1) * bodyH;
    const waveAmp = pct > 0.95 ? 1.5 : 4;

    ctx.save();
    ctx.beginPath(); ctx.roundRect(23, 23, 114, 114, 7); ctx.clip();

    ctx.beginPath();
    ctx.moveTo(22, waterTopY);
    for (let x = 22; x <= 138; x += 2) {
      const y = waterTopY
        + Math.sin((x * 0.08) + waveOffset) * waveAmp
        + Math.sin((x * 0.05) - waveOffset * 1.3) * (waveAmp * 0.6);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(138, bodyBot); ctx.lineTo(22, bodyBot); ctx.closePath();
    ctx.fillStyle = waterColor; ctx.fill();

    ctx.beginPath();
    ctx.moveTo(22, waterTopY);
    for (let x = 22; x <= 138; x += 2) {
      const y = waterTopY
        + Math.sin((x * 0.07) + waveOffset * 1.4 + 1.2) * (waveAmp * 0.7)
        + Math.sin((x * 0.12) - waveOffset * 0.9) * (waveAmp * 0.4);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(138, waterTopY + 12); ctx.lineTo(22, waterTopY + 12); ctx.closePath();
    ctx.fillStyle = waveColor; ctx.fill();

    ctx.restore();
  }

  function drawTicks(ctx) {
    const bodyBot = 136, bodyH = 112;
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 0.5;
    [0.25, 0.5, 0.75, 1.0].forEach(lvl => {
      const ty = bodyBot - lvl * bodyH;
      ctx.beginPath(); ctx.moveTo(130, ty); ctx.lineTo(136, ty); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.font = '7px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(Math.round(lvl * 100) + '%', 128, ty + 3);
      ctx.textAlign = 'left';
    });
  }

  function drawCenterText(ctx, pctStr, sub, textColor) {
    ctx.font = 'bold 26px monospace';
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pctStr, 80, 72);
    ctx.font = '500 10px monospace';
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillText(sub, 80, 92);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // ── LEFT: overflow chip (fixed at ~110%, bubbles) ──
  const ctxL = document.getElementById('c_left').getContext('2d');
  let tL = 0;
  let waveL = 0;
  const bubbles = Array.from({length: 12}, (_, i) => ({
    x: 28 + Math.random() * 100,
    y: 136 - Math.random() * 60,
    r: 1.5 + Math.random() * 2.5,
    speed: 0.4 + Math.random() * 0.5,
    wobble: Math.random() * Math.PI * 2
  }));

  function animLeft() {
    waveL += 0.045;
    tL++;
    const flashAlpha = (Math.sin(tL * 0.35) * 0.5 + 0.5) * 0.85;

    ctxL.clearRect(0, 0, 160, 160);
    drawChipShell(ctxL, flashAlpha);
    drawWater(ctxL, 1.05, 'rgba(239,68,68,0.85)', 'rgba(252,165,165,0.45)', waveL);

    // Bubbles rising inside water
    ctxL.save();
    ctxL.beginPath(); ctxL.roundRect(23, 23, 114, 114, 7); ctxL.clip();
    bubbles.forEach(b => {
      b.y -= b.speed;
      b.wobble += 0.04;
      b.x += Math.sin(b.wobble) * 0.4;
      if (b.y < 24) {
        b.y = 136;
        b.x = 28 + Math.random() * 100;
      }
      ctxL.beginPath();
      ctxL.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctxL.strokeStyle = 'rgba(255,255,255,0.55)';
      ctxL.lineWidth = 0.8;
      ctxL.stroke();
      ctxL.fillStyle = 'rgba(255,255,255,0.12)';
      ctxL.fill();
    });
    ctxL.restore();

    // Overflow splash at top
    const sp = (tL % 25) / 25;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const r = 8 + sp * 22;
      const fade = 1 - sp;
      const px = 80 + Math.cos(a) * r;
      const py = 24 + Math.sin(a) * r * 0.35;
      ctxL.beginPath(); ctxL.arc(px, py, 2.5 * fade + 0.3, 0, Math.PI*2);
      ctxL.fillStyle = `rgba(239,68,68,${fade * 0.85})`; ctxL.fill();
    }

    drawTicks(ctxL);
    drawCenterText(ctxL, '110%', 'CPU LOAD', '#dc2626');

    const leftPctEl = document.getElementById('left-pct');
    if (leftPctEl) leftPctEl.style.color = '#ef4444';

    requestAnimationFrame(animLeft);
  }

  // ── RIGHT: steady 37% green chip ──
  const ctxR = document.getElementById('c_right').getContext('2d');
  let tR = 0;
  let waveR = 0;
  // slight drift ±3% around 37
  function animRight() {
    waveR += 0.038;
    tR++;
    const drift = 0.37 + Math.sin(tR * 0.008) * 0.03;

    ctxR.clearRect(0, 0, 160, 160);
    drawChipShell(ctxR, 0);
    drawWater(ctxR, drift, 'rgba(16,185,129,0.75)', 'rgba(52,211,153,0.45)', waveR);
    drawTicks(ctxR);
    drawCenterText(ctxR, Math.round(drift * 100) + '%', 'CPU LOAD', '#059669');

    const rightPctEl = document.getElementById('right-pct');
    if (rightPctEl) {
      rightPctEl.textContent = Math.round(drift * 100) + '%';
    }

    requestAnimationFrame(animRight);
  }

  setTimeout(() => { animLeft(); animRight(); }, 80);
})();
</script>
