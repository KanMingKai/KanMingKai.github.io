/* ============================================================
   面試簡報 — 現場用的放映頁
   ------------------------------------------------------------
   投影片來源:簡報素材/HR面試簡報.pptx(7 頁)。
   以 PowerPoint 本身匯出成 2560×1440 PNG,再轉 WebP 放在 slides/:
     NN.webp    放映用(全尺寸)
     NN_t.webp  下方縮圖(480×270)
   用 PowerPoint 匯出而不是自己重排,字型與版面才會跟原檔一模一樣。

   ★ 改簡報後的更新方式:重新匯出 7 張圖覆蓋 slides/ 即可,
     頁數有增減才需要動下面 HTML 的 .dk-slide / .dk-thumb 兩組清單。

   ★ 講者備忘稿刻意沒有放上來。原檔第 7 頁的備忘稿是面試準備筆記
     (哪些句子改過、被追問時怎麼回答),repo 是公開的,放上來等於
     把講稿交給面試官。

   ★ 為什麼 7 張圖全部一開始就載入,而不是用到才載:
     現場網路不可靠。只要進場前把這頁打開過一次,換頁就完全不需要網路,
     也不會在投影時出現「圖還沒載完」的空白頁。7 張合計約 1.2 MB。

   ★ 放映模式 = 對 .dk-stage 呼叫 Fullscreen API,外加一個 .is-show class。
     iPhone 的 Safari 不支援對一般元素全螢幕,那時只剩 class 生效,
     用 position:fixed 鋪滿視窗,效果接近。

   樣式:共用 token 見 ../assets/tokens.css,導覽見 ../assets/nav.css。
   本頁專屬元件一律 .dk- 前綴。
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{font-family:var(--sans);background:var(--bg-alt);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
html.dk-showing{overflow:hidden}

/* 投影片寬度:同時受「容器寬」與「視窗高」限制,讓整張投影片連同上下兩列
   在筆電上一進頁就看得到,不用捲動。236px = 導覽 52 + 標題列與控制列的高度。
   下限 560px:矮的橫向視窗(手機橫放)不要縮成郵票大小,寧可捲一下。 */
.dk{padding:22px 22px 56px}
.dk-col{--h:calc(100vh - 236px);
  width:min(100%, max(calc(var(--h) * 16 / 9), 560px), 1180px);margin:0 auto}
@supports(height:100svh){ .dk-col{--h:calc(100svh - 236px)} }

/* ---------- 標題列 ---------- */
.dk-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.dk-eb{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.dk-h1{font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.015em;line-height:1.25;margin-top:4px}
.dk-h1 .en-note{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-top:3px}
.dk-h1 .en-note:empty{display:none}
.dk-acts{display:flex;gap:10px;flex:none}
.dk-btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13.5px;font-weight:600;
  text-decoration:none;border-radius:11px;padding:10px 16px;cursor:pointer;white-space:nowrap;
  transition:background .2s,border-color .2s,color .2s}
.dk-btn.p{background:var(--blue);color:#fff;border:1px solid var(--blue)}
.dk-btn.p:hover{background:var(--blue-d);border-color:var(--blue-d)}
.dk-btn.s{background:#fff;color:var(--ink);border:1px solid var(--line)}
.dk-btn.s:hover{border-color:var(--ink-3)}
.dk-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.dk-btn svg{width:12px;height:12px;flex:none}

/* ---------- 投影片舞台 ---------- */
.dk-stage{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;
  touch-action:pan-y;-webkit-user-select:none;user-select:none;outline:none}
.dk-stage:focus-visible{box-shadow:var(--shadow-lg),0 0 0 3px rgba(0,113,227,.45)}
/* 7 張疊在同一格,只切換可見度:圖片早已解碼好,換頁是瞬間的,不會閃白。 */
.dk-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  visibility:hidden;-webkit-user-drag:none;pointer-events:none}
.dk-slide.on{visibility:visible}

/* 左右兩側的換頁鈕:滑鼠移到投影片上才浮出,不擋畫面 */
.dk-edge{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.92);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;
  box-shadow:0 4px 14px rgba(0,0,0,.12);transition:opacity .2s,background .2s}
.dk-edge svg{width:16px;height:16px}
.dk-edge.prev{left:14px}
.dk-edge.next{right:14px}
.dk-stage:hover .dk-edge,.dk-edge:focus-visible{opacity:1}
.dk-edge:hover{background:#fff}
.dk-edge:disabled{opacity:0!important;pointer-events:none}
@media(hover:none){ .dk-edge{display:none} }

/* 黑畫面 / 白畫面(B、W 鍵,同 PowerPoint) */
.dk-blank{position:absolute;inset:0;display:none;z-index:3}
.dk-stage[data-blank="black"] .dk-blank{display:block;background:#000}
.dk-stage[data-blank="white"] .dk-blank{display:block;background:#fff}

/* ---------- 放映模式 ---------- */
.dk-stage.is-show{position:fixed;inset:0;z-index:1000;width:100vw;height:100vh;height:100dvh;
  aspect-ratio:auto;border:0;border-radius:0;background:#000;box-shadow:none;touch-action:none;cursor:default}
.dk-stage.is-show .dk-edge{display:none}
.dk-stage.is-show:not(.hud-on){cursor:none}
.dk-stage:fullscreen{width:100vw;height:100vh}

/* 放映時右下角的控制條,動一下滑鼠才出現,2.5 秒後自己收起 */
.dk-hud{position:absolute;right:18px;bottom:18px;z-index:4;display:none;align-items:center;gap:4px;
  padding:5px;border-radius:999px;background:rgba(20,20,22,.72);color:#fff;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:opacity .25s}
.dk-stage.is-show .dk-hud{display:flex}
.dk-stage.is-show.hud-on .dk-hud{opacity:1}
.dk-hud button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.dk-hud button:hover{background:rgba(255,255,255,.16)}
.dk-hud button:disabled{opacity:.35;cursor:default;background:transparent}
.dk-hud button svg{width:15px;height:15px}
.dk-hud .num{font-family:var(--mono);font-size:12.5px;font-weight:700;padding:0 8px;min-width:54px;text-align:center}
.dk-hud .sep{width:1px;height:18px;background:rgba(255,255,255,.22);margin:0 3px}

/* ---------- 投影片下方的控制列 ---------- */
.dk-ctl{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px}
.dk-pager{display:flex;align-items:center;gap:6px}
.dk-pager button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s}
.dk-pager button:hover{border-color:var(--ink-3)}
.dk-pager button:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.dk-pager button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.dk-pager button svg{width:14px;height:14px}
.dk-pager .num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);min-width:52px;text-align:center}
.dk-pager .num i{font-style:normal;color:var(--ink-3)}
.dk-keys{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 14px}
.dk-keys span{white-space:nowrap}
kbd{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-2);background:#fff;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;margin-right:4px}
.dk-touch{display:none;font-size:12px;color:var(--ink-3)}
@media(hover:none){ .dk-keys{display:none} .dk-touch{display:block} }

/* ---------- 縮圖 ---------- */
.dk-thumbs{list-style:none;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:22px}
.dk-thumb{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;
  overflow:hidden;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.dk-thumb img{display:block;width:100%;height:auto;aspect-ratio:16/9}
.dk-thumb span{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;
  color:var(--ink-2);background:rgba(255,255,255,.92);border-radius:5px;padding:1px 6px}
.dk-thumb:hover{border-color:var(--ink-3)}
.dk-thumb[aria-current="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.dk-thumb[aria-current="true"] span{background:var(--blue);color:#fff}
.dk-thumb:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media(max-width:720px){
  .dk{padding:16px 16px 44px}
  .dk-bar{flex-direction:column;align-items:stretch;gap:12px}
  .dk-acts .dk-btn{flex:1;justify-content:center}
  .dk-stage{border-radius:10px}
  .dk-thumbs{grid-template-columns:repeat(4,1fr);gap:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* 放映控制
   鍵盤對照沿用 PowerPoint 的習慣,簡報筆(翻頁器)送的鍵也都接得到:
     下一頁  → ↓ 空白 Enter PageDown N      上一頁  ← ↑ Backspace PageUp P
     第一頁 / 最後一頁  Home / End         跳到第 n 頁  數字 + Enter
     黑畫面  B 或 .      白畫面  W 或 ,     開始 / 結束放映  F、F5 / Esc
   ★ 一般瀏覽時(不在放映模式)只攔 ← → PageUp PageDown 與數字跳頁:
     空白鍵、上下鍵、Home/End 留給頁面捲動,訪客才不會覺得頁面「卡住」。
   ★ 網址會帶著目前頁數(#3),重新整理或把連結傳給別人都會停在同一頁。 */
(function () {
  'use strict';
  var stage = document.getElementById('dk-stage');
  if (!stage) return;
  var slides = [].slice.call(stage.querySelectorAll('.dk-slide'));
  var thumbs = [].slice.call(document.querySelectorAll('.dk-thumb'));
  var nums = [].slice.call(document.querySelectorAll('[data-dk-num]'));
  var prevBtns = [].slice.call(document.querySelectorAll('[data-go="-1"]'));
  var nextBtns = [].slice.call(document.querySelectorAll('[data-go="1"]'));
  var live = document.getElementById('dk-live');
  var N = slides.length;
  var cur = 0;

  function isEn() { return document.documentElement.lang === 'en'; }
  function showing() { return stage.classList.contains('is-show'); }
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }

  function fromHash() {
    var m = /^#(\d+)$/.exec(location.hash);
    var n = m ? parseInt(m[1], 10) - 1 : 0;
    return (n >= 0 && n < N) ? n : 0;
  }

  function render() {
    slides.forEach(function (s, k) { s.classList.toggle('on', k === cur); });
    thumbs.forEach(function (t, k) {
      if (k === cur) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current');
    });
    nums.forEach(function (n) { n.textContent = cur + 1; });
    prevBtns.forEach(function (b) { b.disabled = cur === 0; });
    nextBtns.forEach(function (b) { b.disabled = cur === N - 1; });
  }

  function go(i) {
    i = Math.max(0, Math.min(N - 1, i));
    setBlank('');
    if (i === cur) return;
    cur = i;
    render();
    if (history.replaceState) history.replaceState(null, '', '#' + (cur + 1));
    live.textContent = (isEn() ? 'Slide ' + (cur + 1) + ' of ' + N + ': ' : '第 ' + (cur + 1) + ' / ' + N + ' 頁:')
                       + slides[cur].getAttribute('data-t');
  }
  // 黑 / 白畫面時按翻頁只是回到畫面,不跳頁 —— 與 PowerPoint 相同,講者才不會漏掉一頁
  function next() { if (stage.hasAttribute('data-blank')) setBlank(''); else go(cur + 1); }
  function prev() { if (stage.hasAttribute('data-blank')) setBlank(''); else go(cur - 1); }

  /* ---- 黑 / 白畫面 ---- */
  function setBlank(c) {
    if (c) stage.setAttribute('data-blank', c); else stage.removeAttribute('data-blank');
  }
  function toggleBlank(c) { setBlank(stage.getAttribute('data-blank') === c ? '' : c); }

  /* ---- 放映模式 ---- */
  var hudT = 0;
  function pokeHud() {
    stage.classList.add('hud-on');
    clearTimeout(hudT);
    hudT = setTimeout(function () { stage.classList.remove('hud-on'); }, 2500);
  }

  function enterShow() {
    if (showing()) return;
    stage.classList.add('is-show');
    document.documentElement.classList.add('dk-showing');
    var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) {
      try { var p = req.call(stage); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    stage.focus({ preventScroll: true });
    pokeHud();
  }

  function exitShow() {
    if (!showing()) return;
    stage.classList.remove('is-show', 'hud-on');
    document.documentElement.classList.remove('dk-showing');
    setBlank('');
    if (fsEl()) {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) { try { var p = ex.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    }
  }

  // 在全螢幕裡按 Esc 是瀏覽器自己處理的,頁面收不到 keydown,只會收到這個事件
  function onFsChange() { if (!fsEl() && showing()) exitShow(); }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  document.getElementById('dk-play').addEventListener('click', enterShow);
  document.getElementById('dk-exit').addEventListener('click', exitShow);

  /* ---- 按鈕 ---- */
  prevBtns.forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); prev(); if (showing()) pokeHud(); }); });
  nextBtns.forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); next(); if (showing()) pokeHud(); }); });
  thumbs.forEach(function (t) {
    t.addEventListener('click', function () {
      go(parseInt(t.getAttribute('data-i'), 10));
      // 縮圖在投影片下方;若投影片已經捲出畫面,點完要讓人看得到換到哪
      if (stage.getBoundingClientRect().top < 0) stage.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
  });

  /* ---- 點擊與滑動 ----
     點投影片左側 30% 回上一頁,其餘地方下一頁(與多數放映軟體一致)。
     水平滑動超過 40px 視為翻頁;垂直為主的拖曳交給頁面捲動。 */
  var down = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || (e.target.closest && e.target.closest('button'))) { down = null; return; }
    down = { x: e.clientX, y: e.clientY };
  });
  stage.addEventListener('pointercancel', function () { down = null; });
  stage.addEventListener('pointerup', function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    down = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) next(); else prev(); return; }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      var r = stage.getBoundingClientRect();
      if (e.clientX - r.left < r.width * 0.3) prev(); else next();
    }
  });
  stage.addEventListener('pointermove', function () { if (showing()) pokeHud(); });

  /* ---- 鍵盤 ---- */
  var numBuf = '', numT = 0;
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    var k = e.key, show = showing(), done = true;

    if (/^[0-9]$/.test(k)) {
      numBuf += k;
      clearTimeout(numT);
      numT = setTimeout(function () { numBuf = ''; }, 1500);
      return;
    }
    if (k === 'Enter' && numBuf) {
      go(parseInt(numBuf, 10) - 1);
      numBuf = '';
      e.preventDefault();
      return;
    }

    switch (k) {
      case 'ArrowRight': case 'PageDown': next(); break;
      case 'ArrowLeft':  case 'PageUp':   prev(); break;
      case 'f': case 'F': case 'F5': if (show) exitShow(); else enterShow(); break;
      case 'Escape': if (show) exitShow(); else done = false; break;
      default: done = false;
    }
    if (!done && show) {
      done = true;
      switch (k) {
        case ' ': case 'Enter': case 'ArrowDown': case 'n': case 'N': next(); break;
        case 'ArrowUp': case 'Backspace': case 'p': case 'P': prev(); break;
        case 'Home': go(0); break;
        case 'End': go(N - 1); break;
        case 'b': case 'B': case '.': toggleBlank('black'); break;
        case 'w': case 'W': case ',': toggleBlank('white'); break;
        default: done = false;
      }
    }
    if (done) e.preventDefault();
  });

  window.addEventListener('hashchange', function () { go(fromHash()); });

  // 先把 7 張都解碼好,換頁時才不會閃一下白
  slides.forEach(function (img) { if (img.decode) img.decode().catch(function () {}); });

  cur = fromHash();
  render();
})();
</script>
</body>
</html>
